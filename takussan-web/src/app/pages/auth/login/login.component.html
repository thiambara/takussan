<div class="bg-gray-50 dark:bg-gray-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, rgb(59 130 246) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-white dark:bg-gray-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <lucide-icon [img]="LayoutGrid" class="mb-8 w-16 h-16 shrink-0 mx-auto text-blue-500"></lucide-icon>
                    <div class="text-gray-900 dark:text-white text-3xl font-medium mb-4">Welcome to Takussan!</div>
                    <span class="text-gray-600 dark:text-gray-400 font-medium">Sign in to continue</span>
                </div>

                <div>
                    <label class="form-label text-xl text-gray-900 dark:text-white"
                           for="username">Username</label>
                    <input
                            [(ngModel)]="username"
                            autofocus
                            class="form-input md:w-[30rem] mb-8"
                            id="username"
                            placeholder="Username"
                            type="text"/>

                    <label class="form-label text-xl text-gray-900 dark:text-white"
                           for="password">Password</label>
                    <div class="relative w-full md:w-[30rem] mb-4">
                        <input
                                [(ngModel)]="password"
                                [type]="showPassword ? 'text' : 'password'"
                                class="form-input !pr-12"
                                id="password"
                                placeholder="Password"/>
                        <button
                                (click)="togglePasswordVisibility()"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors duration-200"
                                type="button">
                            <lucide-icon [img]="showPassword ? EyeOff : Eye" class="w-5 h-5"></lucide-icon>
                        </button>
                    </div>

                    <div class="flex items-center justify-between mt-2 mb-8 gap-8">
                        <div class="flex items-center">
                            <input
                                    [(ngModel)]="rememberMe"
                                    class="form-checkbox mr-2"
                                    id="rememberMe"
                                    type="checkbox"/>
                            <label class="text-gray-900 dark:text-white cursor-pointer" for="rememberMe">Remember
                                me</label>
                        </div>
                        <span class="font-medium no-underline ml-2 text-right cursor-pointer text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors duration-200">Forgot password?</span>
                    </div>

                    <button
                            (click)="login()"
                            [disabled]="!validatedData()"
                            class="w-full inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-primary-600 border border-primary-600 rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200">
                        Sign In
                    </button>

                    <div class="flex items-center justify-center mt-4 gap-5">
                        <a [routerLink]="'/sign-up'"
                           class="font-medium no-underline ml-2 text-right cursor-pointer text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors duration-200">
                            Don't have an account (Sign Up)
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
