<div
  [formGroup]="propertyForm"
  class="bg-white dark:bg-gray-900 rounded-3xl border border-gray-200/50 dark:border-gray-800 shadow-sm p-6 md:p-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
  <div class="mb-8">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Informations de base</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Commencez par les informations essentielles de votre
      bien.</p>
  </div>

  <div class="space-y-6">
    <!-- Title -->
    <div class="form-group">
      <label class="form-label">Titre de l'annonce</label>
      <input class="form-input" formControlName="title"
             placeholder="Ex: Superbe villa avec piscine aux Almadies"
             type="text">
      @if (hasError('title', 'required')) {
        <p class="form-error">
          <lucide-icon [img]="icons.AlertCircle" class="w-3 h-3"></lucide-icon>
          Le titre est requis
        </p>
      }
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea resize-none" formControlName="description"
                placeholder="Décrivez les atouts de votre bien..."
                rows="5"></textarea>
      @if (hasError('description', 'required')) {
        <p class="form-error">
          <lucide-icon [img]="icons.AlertCircle" class="w-3 h-3"></lucide-icon>
          La description est requise
        </p>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Type -->
      <div class="form-group">
        <label class="form-label">Type de bien</label>
        <div class="relative">
          <p-select [options]="propertyTypes"
                    formControlName="type"
                    optionLabel="label"
                    optionValue="value"
                    styleClass="w-full">
          </p-select>
        </div>
      </div>

      <!-- Contract Type -->
      <div class="form-group">
        <label class="form-label">Type de contrat</label>
        <div class="grid grid-cols-3 gap-2 p-1 bg-gray-100 dark:bg-gray-800 rounded-xl">
          @for (opt of contractTypeOptions; track opt.value) {
            <label class="relative cursor-pointer">
              <input [value]="opt.value" class="peer sr-only" formControlName="contract_type" type="radio">
              <div class="form-radio-segment">
                {{ opt.label }}
              </div>
            </label>
          }
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Status -->
      <div class="form-group">
        <label class="form-label">Statut</label>
        <div class="relative">
          <p-select [options]="statusOptions"
                    formControlName="status"
                    optionLabel="label"
                    optionValue="value"
                    styleClass="w-full">
          </p-select>
        </div>
      </div>

      <!-- Visibility -->
      <div class="form-group">
        <label class="form-label">Visibilité</label>
        <div class="relative">
          <p-select [options]="visibilityOptions"
                    formControlName="visibility"
                    optionLabel="label"
                    optionValue="value"
                    styleClass="w-full">
          </p-select>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8 flex justify-end">
    <button (click)="next.emit()"
            class="flex items-center gap-2 px-6 py-2.5 bg-gray-900 text-white dark:bg-white dark:text-gray-900 rounded-xl font-medium hover:opacity-90 transition-opacity"
            type="button">
      Suivant
      <lucide-icon [img]="icons.ArrowRight" class="w-4 h-4"></lucide-icon>
    </button>
  </div>
</div>
