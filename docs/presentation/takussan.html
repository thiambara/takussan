ace : un compte, un profil (propriétaire, agent, administrateur) et un rôle d'agence qui porte ses capacités.","tables":["users","agencies","owner_profiles","agent_profiles","agency_roles","agency_role_capabilities","invitations"]},{"step":"Il crée un bien : adresse géolocalisée dans le référentiel, photos, équipements, conditions d'entrée, équipe et calendrier.","tables":["properties","addresses","geo_neighborhoods","media","tags","taggables","property_collaborators","property_unavailabilities"]},{"step":"Le bien est soumis, modéré (doublons, signalements) puis publié ; l'agence peut le mettre en avant en dépensant des crédits.","tables":["properties","duplicate_suspicions","media_fingerprints","moderation_claims","property_boosts","credit_lots","credit_movements"]},{"step":"Un visiteur cherche, filtre par quartier, met en favori ou enregistre une alerte ; chaque vue et chaque recherche est comptée.","tables":["search_query_stats","search_aliases","favorites","saved_searches","alert_subscribers","property_daily_views"]},{"step":"Il contacte l'agence depuis l'annonce : la demande arrive dans la boîte de réception et devient une fiche client dans le pipeline.","tables":["property_contact_leads","customers","customer_notes","conversations","messages"]},{"step":"Une visite est planifiée, confirmée puis rapportée par l'agent (objections, suite à donner).","tables":["property_visits","calendar_feeds","commitments","tasks"]},{"step":"Le client fait une réservation ou une offre, dépose son dossier et ses garants ; contre-offres possibles, acompte payé.","tables":["bookings","booking_dossier_items","booking_guarantor","guarantors","booking_counter_offers","booking_payments"]},{"step":"Le bail est rédigé, signé par les deux parties, et l'état des lieux d'entrée est dressé ; le locataire est accueilli.","tables":["leases","lease_signatures","lease_guarantor","inventories","documents","tenant_onboarding_checklists"]},{"step":"Chaque mois, une échéance de loyer est appelée, payée en ligne ou relancée, facturée et rapprochée du relevé bancaire.","tables":["lease_payments","lease_payment_links","lease_payment_reminders","invoices","bank_statements","bank_statement_lines"]},{"step":"L'argent est reversé : au bailleur (net de commission), aux agents (commissions), à l'agence (net des frais plateforme).","tables":["payouts","payout_lease_payment","payout_methods","commission_entries","platform_payouts","owner_statement_snapshots"]},{"step":"Une panne survient : demande d'intervention, devis, prestataire, créneau, facture refacturée au bailleur — le tout suivi dans le fil.","tables":["maintenance_requests","maintenance_quote_alternatives","maintenance_reschedule_requests","service_provider_bills","conversations","commitments"]},{"step":"En fin de parcours, le locataire laisse un avis vérifié (adossé à sa visite ou à son bail) ; l'état des lieux de sortie solde la caution.","tables":["reviews","inventories","payouts","notification_delivery_attempts","app_notifications"]}],"stats":{"tables":155,"tables_hors_technique":147,"models":135,"pivots":7,"pivot_names":["taggables","payout_lease_payment","payout_booking_payment","lease_guarantor","radar_outreach_listing","radar_listing_target","booking_guarantor"],"pivots_avec_modele":["conversation_participants","user_customer_relationships","service_provider_agency_collaborations","agency_role_capabilities"],"morph_relations":25,"relations":411,"migrations":385}},"actors":[{"id":"visitor","name":"Visiteur","icon_hint":"loupe","pitch":"Toute personne qui arrive sur Takussan sans compte : elle cherche un logement à louer ou à acheter, ou elle veut publier un bien.","value":["Chercher parmi les annonces du Sénégal par ville, quartier, budget, carte ou « autour de moi », sans créer de compte.","Voir avant de se déplacer le coût d'entrée réel (« Total à l'entrée »), les photos, la visite virtuelle et des signaux de confiance (téléphone vérifié, agence vérifiée).","Joindre l'agent ou le propriétaire en un geste : WhatsApp, appel, message ou demande de visite par jour et tranche horaire.","Recevoir une alerte par e-mail ou WhatsApp sur une recherche, sans compte, et la rattacher plus tard à son compte.","Publier son bien gratuitement (« 0 F de commission ») : l'annonce se remplit sans compte, le compte n'est demandé qu'au moment de publier.","Comparer les agences et agents : biens en ligne, avis, délai de réponse habituel."],"pains":["Des annonces éparpillées sur Facebook, WhatsApp et les sites de petites annonces, sans prix fiable ni photos à jour.","Les arnaques au logement : argent demandé avant la visite, faux bailleurs, annonces fantômes.","Un coût d'entrée caché (cautions, avances de plusieurs mois, commission) qu'on découvre sur place.","Des démarcheurs injoignables ou qui ne répondent jamais."],"entry":{"summary":"Le visiteur n'a pas de compte et navigue librement. Le compte naît au premier geste qui l'exige (réserver, écrire dans la messagerie, publier), par le numéro de téléphone et un code SMS, sans mot de passe ; l'e-mail + mot de passe et Google / Facebook / Apple restent possibles. Une seule porte (/auth/login) sert à la connexion comme à l'inscription.","steps":[{"label":"Arriver et chercher","detail":"Page d'accueil, liste et carte servies sans session ; chaque recherche de page 1 alimente un journal anonyme (compteurs, aucune identité).","page":"/fr/properties","api":["GET /api/public/properties/discovery","GET /api/public/properties/search"],"tables":["properties","search_query_stats","search_query_visitors"]},{"label":"Geste anonyme","detail":"Demander un contact, une visite ou une alerte se fait sans compte (nom + téléphone ou e-mail).","page":"/fr/properties/[slug]","api":["POST /api/public/properties/{slug}/contact-lead","POST /api/public/properties/{slug}/visit-request","POST /api/public/search-alerts"],"tables":["property_contact_leads","property_visits","alert_subscribers","saved_searches"]},{"label":"Porte unique par numéro","detail":"/auth/register redirige vers /auth/login en gardant l'intention (bien, dates, action). Le numéro reçoit un code à 6 chiffres, valable 5 min, stocké haché en cache (Redis) ; la réponse est la même que le numéro ait un compte ou non (pas d'énumération). Drapeau `phone_login`.","page":"/auth/login","api":["GET /api/auth/oauth/providers","POST /api/auth/phone/request-code"],"tables":[]},{"label":"Code vérifié = compte créé","detail":"Le premier code juste sur un numéro inconnu crée l'utilisateur (prénom vide, sans e-mail, mot de passe aléatoire, `phone_verified_at` posé) et émet un jeton Sanctum ; le BFF Next le pose en cookie HttpOnly (`/api/auth/set-token`).","page":"/auth/login","api":["POST /api/auth/phone/verify-code"],"tables":["users","personal_access_tokens"]},{"label":"Prénom puis orientation","detail":"/onboarding/intention demande le prénom s'il manque, puis trois portes : chercher (crée une alerte, éventuellement WhatsApp), publier, professionnel (ouvre une agence `standard`). L'intention est écrite dans les préférences du compte.","page":"/onboarding/intention","api":["PUT /api/auth/profile","PATCH /api/me","POST /api/saved-searches","POST /api/me/agencies"],"tables":["users","saved_searches","agencies","agency_admin_profiles"]},{"label":"Ou : publier tout de suite","detail":"Depuis /publish, après le code SMS, le compte reçoit sans aucune question une agence `individual` (« Espace de {prénom} »), un profil admin d'agence et un profil propriétaire, puis le bien est créé et publié.","page":"/publish","api":["POST /api/host/individual/auto-onboard","POST /api/properties","POST /api/properties/{property}/publish"],"tables":["agencies","agency_admin_profiles","owner_profiles","properties"]}]},"profile_model":null,"capabilities":[],"capabilities_note":"Aucune capacité : les routes `api/public/*` sont ouvertes, protégées par des limiteurs par visiteur (`public-read` 90/min, `public-contact-lead` 5 par 10 min, `public-visit-request` 10/h…) dont la clé n'est pas falsifiable par un en-tête.","spaces":[{"path":"/fr","label":"Accueil","what":"Louer ou Acheter, tuiles de quartiers, rangées « À {ville} », « Coup de cœur », « Nouveau »."},{"path":"/fr/properties","label":"Liste et carte des biens","what":"Recherche, filtres, tri, histogramme des prix, emplacements sponsorisés."},{"path":"/fr/properties/[slug]","label":"Fiche d'un bien","what":"Galerie, coût d'entrée, confiance, contact, visite, avis, signalement."},{"path":"/fr/agencies","label":"Professionnels","what":"Annuaire des agences et agents, fiches /fr/agencies/[slug] et /fr/agents/[slug]."},{"path":"/fr/compare","label":"Comparateur","what":"Biens côte à côte ; favoris locaux sur /fr/favorites."},{"path":"/publish","label":"Publier sans compte","what":"Assistant d'annonce gardé dans le navigateur, compte demandé à la fin."},{"path":"/fr/claim/[token]","label":"Réclamer ses annonces","what":"Lien signé reçu après une collecte du Radar."},{"path":"/fr/search-alerts/confirm","label":"Alerte sans compte","what":"Confirmer, changer la fréquence ou se désinscrire (/fr/search-alerts/unsubscribe)."}],"journey":[{"stage":"Découvrir","what":"Arrive par Google, un lien partagé ou WhatsApp ; parcourt l'accueil et la liste par quartier."},{"stage":"Comparer","what":"Filtre par budget et chambres, regarde la carte, compare deux ou trois biens et les agences."},{"stage":"Contacter","what":"Écrit, appelle ou ouvre WhatsApp depuis la fiche ; la demande arrive à l'agent ou au propriétaire."},{"stage":"Visiter","what":"Demande une visite (jour + matin / après-midi / fin de journée) ; reçoit la confirmation et des rappels par SMS ou e-mail."},{"stage":"S'alerter","what":"Laisse une alerte e-mail ou WhatsApp et reçoit les nouveaux biens qui correspondent."},{"stage":"Rejoindre","what":"Crée son compte avec son numéro pour réserver, candidater ou publier : il devient client (locataire / acheteur) ou propriétaire."}],"features":[{"id":"accueil-decouverte","domain":"§1.2 Recherche & découverte publique"," },{"from":"API","to":"Front","msg":"marqueurs"}],"rules":["Limiteur dédié 60 req/min."],"notifications":[]},{"id":"emplacements-sponsorises","domain":"§1.2 Recherche & découverte publique","title":"Biens sponsorisés dans les résultats","business":"Des biens mis en avant par leur annonceur apparaissent en tête de page puis toutes les dix cartes, marqués « Sponsorisé ». Le visiteur voit plus d'offres pertinentes ; l'annonceur paie une visibilité mesurée.","priority":"P1","status":"livré","pages":["/fr/properties","/fr"],"api":["GET /api/public/properties/search","POST /api/public/properties/sponsored-impressions"],"backend":["App\\Http\\Controllers\\Public\\PublicSponsoredImpressionController","App\\…\\BoostStatsRecorder"],"tables":[{"name":"property_boosts","access":"lit","why":"boosts actifs à faire tourner"},{"name":"property_boost_daily_stats","access":"met à jour","why":"impressions par jour"}],"flow":[{"from":"API","to":"Front","msg":"sponsored[].position (0, 11, 22…)"},{"from":"Front","to":"Visiteur","msg":"carte « Sponsorisé » dans la grille"},{"from":"Front","to":"API","msg":"POST sponsored-impressions (slugs[])","note":"moitié de la carte visible"},{"from":"API","to":"PostgreSQL","msg":"upsert stats du jour"}],"rules":["24 slugs max par appel, 30 appels/min par visiteur, robots exclus.","Une impression par visiteur et par bien sur 30 min.","Jamais deux vedettes de suite ni un doublon d'un résultat."],"notifications":[]},{"id":"fiche-bien","domain":"§1.2 Recherche & découverte publique","title":"Fiche publique d'un bien","business":"Le visiteur voit la galerie, la visite virtuelle, le prix, le « Total à l'entrée », l'interlocuteur et des conseils de prudence (« ne versez jamais d'argent avant la visite »). Il décide s'il vaut la peine de se déplacer.","priority":"P0","status":"livré","pages":["/fr/properties/[slug]"],"api":["GET /api/public/properties/{slug}","POST /api/public/properties/{slug}/view","GET /api/public/properties/{slug}/similar","GET /api/publi p\\Services\\Model\\NotificationService"],"tables":[{"name":"property_contact_leads","access":"crée","why":"la demande (ou le clic WhatsApp/appel, sans identité)"},{"name":"app_notifications","access":"crée","why":"cloche des destinataires"}],"flow":[{"from":"Visiteur","to":"Front","msg":"remplit nom + téléphone/e-mail"},{"from":"Front","to":"API","msg":"POST contact-lead","note":"en-tête d'idempotence"},{"from":"API","to":"PostgreSQL","msg":"insère property_contact_leads"},{"from":"API","to":"File","msg":"e-mail / mobile en file"},{"from":"API","to":"Front","msg":"201 accepted"},{"from":"File","to":"Externe:E-mail/WhatsApp/SMS","msg":"prévient agent ou propriétaire"}],"rules":["Limiteur `public-contact-lead` : 5 par 10 min par visiteur.","Champ piège `company` : un robot reçoit 201 sans rien écrire.","À défaut de contact joignable, les admins de l'agence reçoivent la demande.","Source et medium des liens partagés attribués à la demande."],"notifications":["Agent / propriétaire / admins d'agence : cloche + e-mail (canal mobile selon préférences)."]},{"id":"demande-visite","domain":"§1.3 Réservations courte durée & visites","title":"Demander une visite sans compte","business":"Le visiteur choisit un créneau libre ou un jour et une tranche (matin, après-midi, fin de journée), avec son nom et son téléphone. L'agent fixe l'heure en confirmant ; le visiteur est prévenu et reçoit des rappels.","priority":"P2","status":"livré","pages":["/fr/properties/[slug]"],"api":["GET /api/public/properties/{slug}/visit-slots","POST /api/public/properties/{slug}/visit-request"],"backend":["App\\Http\\Controllers\\Public\\PublicPropertyController@visitRequest","App\\Services\\Visit\\VisitSchedulingService","App\\Services\\Visit\\VisitNotifier","App\\Jobs\\SendPropertyVisitReminders"],"tables":[{"name":"property_visits","access":"crée","why":"la visite `scheduled`, avec nom/téléphone du visiteur"},{"name":"customers","access":"lit","why":"rattache la fiche client existante si le visiteur rte"}],"flow":[{"from":"Front","to":"API","msg":"POST search-alerts (critères + contact)"},{"from":"API","to":"File","msg":"RecordPublicSearchAlert"},{"from":"API","to":"Front","msg":"202, même corps dans tous les cas"},{"from":"File","to":"PostgreSQL","msg":"abonné + recherche"},{"from":"File","to":"Externe:E-mail/WhatsApp","msg":"lien ou code de confirmation"},{"from":"Visiteur","to":"API","msg":"POST confirm"},{"from":"File","to":"Externe:E-mail/WhatsApp","msg":"nouveaux biens","note":"chaque jour à 09:00"}],"rules":["Rien ne part avant la double confirmation.","Aucune énumération : 202 identique que le contact soit connu ou non.","Désinscription : propose d'abord un envoi hebdomadaire."],"notifications":["Visiteur : message de confirmation, puis récapitulatif des nouveaux biens (e-mail ou WhatsApp)."]},{"id":"annuaire-professionnels","domain":"§1.2 Recherche & découverte publique","title":"Annuaire des agences et agents, fiches publiques","business":"Le visiteur compare les professionnels d'une ville : biens en ligne, villes, note, nombre d'avis, délai de réponse habituel. Il ouvre une fiche d'agence ou d'agent pour chercher dans ses biens et le contacter.","priority":"P1","status":"livré","pages":["/fr/agencies","/fr/agencies/[slug]","/fr/agents","/fr/agents/[slug]"],"api":["GET /api/public/agencies","GET /api/public/agencies/{slug}","GET /api/public/agencies/{slug}/properties","GET /api/public/agents","GET /api/public/agents/{slug}","GET /api/public/agents/{slug}/properties"],"backend":["App\\Http\\Controllers\\Public\\PublicAgencyController@index","App\\Http\\Controllers\\Public\\PublicAgentController@show","App\\Jobs\\RefreshDirectoryResponseTimes"],"tables":[{"name":"agencies","access":"lit","why":"fiche, vitrine, délai médian"},{"name":"agent_profiles","access":"lit","why":"agents en exercice, langues, quartiers"},{"name":"agency_spotlights","access":"lit","why":"agence mise en avant par ville"},{"name":"reviews","access":"lit","why":"note et avis"},{"name":"properties","access":"lit","why":"portefeuille public"}],"flow":[{"from":"Visiteur","to":"Front","msg":"ouvre /fr/agencies?city=Dakar"},{"from":"Front","to":"API","msg":"GET /public/agencies"},{"from":"API","to":"PostgreSQL","msg":"agences + vitrine `spotlight`"},{"from":"API","to":"Front","msg":"lignes + vitrine"},{"from":"Front","to":"API","msg":"GET /public/agencies/{slug}/properties","note":"recherche dans ses biens"}],"rules":["Aucun numéro sur une ligne d'annuaire.","Un propriétaire particulier n'y paraît que s'il l'a choisi ; il est nommé « Prénom N. ».","Délai de réponse : médiane sur 90 jours, affichée à partir de 5 conversations, recalculée chaque nuit (04:20).","Un ancien slug redirige en 308."],"notifications":[]},{"id":"comparateur-favoris-locaux","domain":"§1.2 Recherche & découverte publique","title":"Comparateur et favoris locaux","business":"Le visiteur met des biens côte à côte (prix, surface, coût d'entrée) et garde des favoris dans son navigateur, relisibles hors connexion. Il décide sans créer de compte.","priority":"P2","status":"livré","pages":["/fr/compare","/fr/favorites","/fr/favorites/shared"],"api":["GET /api/public/properties/compare","GET /api/public/properties/by-ids"],"backend":["App\\Http\\Controllers\\Public\\PublicPropertyController@compare","App\\Http\\Controllers\\Public\\PublicPropertyController@byIds"],"tables":[{"name":"properties","access":"lit","why":"biens comparés ; un bien retiré est rendu « plus disponible »"}],"flow":[{"from":"Visiteur","to":"Front","msg":"ajoute au comparateur (stockage local)"},{"from":"Front","to":"API","msg":"GET compare?ids[]=…"},{"from":"API","to":"PostgreSQL","msg":"biens publics seulement"},{"from":"API","to":"Front","msg":"grille de comparaison"}],"rules":["Limiteurs 30/min (compare) et 60/min (by-ids).","Le site est installable (manifeste PWA)."],"notifications":[]},{"id":"signaler","domain":"§1.11 Avis & réputation","title":"Signaler une annonce ou un avis","business":"Sans compte, le visi ["Page `noindex`."],"notifications":[]},{"id":"publier-sans-compte","domain":"§1.1 Gestion des biens","title":"Publier un bien sans compte préalable","business":"Le particulier remplit toute son annonce (photos, prix, lieu, en collant un lien Google Maps ou une position WhatsApp) ; tout reste dans son navigateur. Au moment de publier, une feuille demande numéro, code et nom : le compte et son espace sont créés et l'annonce part en ligne, sans commission.","priority":"P1","status":"livré","pages":["/publish","/app/properties/[id]/en-ligne"],"api":["GET /api/public/publish/demand","POST /api/public/geo/resolve-link","POST /api/auth/phone/request-code","POST /api/auth/phone/verify-code","POST /api/host/individual/auto-onboard","POST /api/properties","POST /api/properties/{property}/media","POST /api/properties/{property}/publish"],"backend":["App\\Http\\Controllers\\HostAutoOnboardController@store","App\\Http\\Controllers\\Public\\PublicPublishDemandController","App\\Http\\Controllers\\Api\\GeoLinkController","App\\Http\\Controllers\\Api\\PropertyController@publish"],"tables":[{"name":"users","access":"crée","why":"compte par téléphone"},{"name":"agencies","access":"crée","why":"agence `individual` « Espace de {prénom} »"},{"name":"agency_admin_profiles","access":"crée","why":"le particulier administre son espace"},{"name":"owner_profiles","access":"crée","why":"profil propriétaire"},{"name":"properties","access":"crée","why":"l'annonce"},{"name":"consent_proofs","access":"crée","why":"acceptation des CGU"},{"name":"search_query_stats","access":"lit","why":"« N recherches à {ville} cette semaine »"}],"flow":[{"from":"Front","to":"API","msg":"GET publish/demand?city=","note":"null sous le seuil de 200"},{"from":"Visiteur","to":"Front","msg":"remplit l'annonce (stockée localement)"},{"from":"Front","to":"API","msg":"POST phone/request-code puis verify-code"},{"from":"Front","to":"BFF","msg":"POST /api/auth/set-token","note":"cookie HttpOnly"},{"from":"Front","to":"API","msg":"POST host/individual/auto-onboard"},{"from":"API","to":"PostgreSQL","msg":"agence + 2 profils"},{"from":"Front","to":"API","msg":"POST properties + media + publish"},{"from":"API","to":"Meilisearch","msg":"indexation du bien","note":"via Scout"}],"rules":["Création automatique portée par un drapeau ; aucun abonnement requis dans un espace particulier.","Limiteur 5/min sur auto-onboard ; `public-geo-link` 10/min.","Les champs propres aux agences sont masqués pour le particulier."],"notifications":[]},{"id":"reclamation-radar","domain":"§2.12 Radar — acquisition d'annonces","title":"Réclamer ses annonces collectées (Radar)","business":"Un annonceur repéré ailleurs reçoit un lien signé : il coche et corrige ses annonces, accepte les conditions et confirme par un code SMS envoyé à son seul numéro. Il peut aussi refuser (« Ce n'est pas moi », « Ne plus me contacter »).","priority":"P1","status":"livré","pages":["/fr/claim/[token]"],"api":["GET /api/radar/claims/{token}","POST /api/radar/claims/{token}/otp","POST /api/radar/claims/{token}/confirm","POST /api/radar/claims/{token}/decline"],"backend":["App\\Http\\Controllers\\Public\\RadarClaimController@confirm"],"tables":[{"name":"radar_outreaches","access":"lit","why":"le jeton et les annonces visées"},{"name":"radar_listings","access":"met à jour","why":"annonces réclamées"},{"name":"radar_consents","access":"met à jour","why":"accord ou refus (STOP)"},{"name":"users","access":"crée","why":"compte de l'annonceur"},{"name":"properties","access":"crée","why":"annonces publiées dans son espace"}],"flow":[{"from":"Visiteur","to":"Front","msg":"ouvre /fr/claim/{jeton}"},{"from":"Front","to":"API","msg":"GET radar/claims/{token}"},{"from":"Front","to":"API","msg":"POST otp"},{"from":"API","to":"Externe:SMS","msg":"code au numéro de l'annonce"},{"from":"Front","to":"API","msg":"POST confirm (code + annonces + CGU)"},{"from":"API","to":"PostgreSQL","msg":"compte, espace, biens"}],"rules":["Lien valable 30 jours, mort après un STOP ou une révocation.","Limiteurs `auth-phone-send` / `auth-phone-verify`.","La demande du quartier n'est affichée qu'au-dessus d'un seuil."],"notifications":["Annonceur : code SMS."]},{"id":"connexion-telephone","domain":"§2.1 Authentification & comptes","title":"Entrer par son numéro (inscription = connexion)","business":"Le visiteur donne son numéro, reçoit un code et entre : pas de mot de passe à retenir, ce qui colle aux usages mobiles au Sénégal. L'intention (le bien, les dates, l'action) est gardée jusqu'au retour sur la fiche.","priority":"P1","status":"livré","pages":["/auth/login","/auth/register","/onboarding/intention"],"api":["GET /api/auth/oauth/providers","POST /api/auth/phone/request-code","POST /api/auth/phone/verify-code","POST /api/auth/login","GET /api/auth/oauth/{provider}/redirect","PUT /api/auth/profile","PATCH /api/me"],"backend":["App\\Http\\Controllers\\Api\\Auth\\PhoneLoginController@verifyCode","App\\Services\\Auth\\PhoneLoginService","App\\Services\\Auth\\PhoneVerificationService"],"tables":[{"name":"users","access":"crée","why":"compte neuf au premier code juste"},{"name":"personal_access_tokens","access":"crée","why":"jeton de session Sanctum"},{"name":"consent_proofs","access":"crée","why":"acceptation des conditions quand elle est requise"}],"flow":[{"from":"Visiteur","to":"Front","msg":"saisit +221…"},{"from":"Front","to":"API","msg":"POST phone/request-code"},{"from":"API","to":"Externe:SMS","msg":"code à 6 chiffres","note":"haché en cache Redis, 5 min"},{"from":"Visiteur","to":"Front","msg":"saisit le code"},{"from":"Front","to":"API","msg":"POST phone/verify-code"},{"from":"API","to":"PostgreSQL","msg":"crée users + jeton"},{"from":"Front","to":"BFF","msg":"POST /api/auth/set-token"},{"from":"Front","to":"Visiteur","msg":"/onboarding/intention puis retour au bien"}],"rules":["Réponse identique que le numéro ait un compte ou non (anti-énumération).","Seuls les indicatifs autorisés ; verrou par numéro après échecs.","Un numéro ne connecte que le compte qui l'a vérifié ; 2FA reste exigé s'il est activé.","Fonction derrière le drapeau `phone_login`."],"notifications":["Visiteur : code par SMS (repli vocal prévu dans le service)."]},{"id":"annuaire-prestataires","domain":"§1.8 Maintenance & interventions","title":"Annuaire public des prestataires","business":"Trouver un plombier ou un électricien recommandé, sur consentement du prestataire, et le contacter via la plateforme.","priority":"P3","status":"prévu","pages":[],"api":[],"backend":[],"tables":[],"flow":[],"rules":["Aucune route publique ni page : seule l'agence voit son carnet de prestataires."],"notifications":[]}]},{"id":"customer","name":"Locataire / Acheteur","icon_hint":"maison","pitch":"La personne qui a un compte et loue, réserve ou achète un bien : d'abord candidat ou client d'une agence, puis locataire quand un bail est en cours.","value":["Garder ses favoris et ses recherches, et être alerté (e-mail, WhatsApp) des nouveaux biens et des baisses de prix.","Candidater, réserver ou faire une offre en ligne avec un dossier complet (pièces, garants, revenus), et suivre chaque demande avec un seul geste à faire.","Payer acompte et loyer par Wave ou Orange Money, recevoir quittances et reçus PDF, savoir en un écran ce qu'il reste à régler.","Signer son bail et son état des lieux par code à usage unique, depuis son téléphone.","Signaler une panne photo d'abord et suivre l'intervention jusqu'à la confirmation.","Parler à l'agence dans une messagerie en direct liée à son bail ou sa réservation, avec relais WhatsApp/SMS."],"pains":["Des paiements de loyer en espèces sans reçu, et des litiges sur ce qui a été payé.","Des pannes signalées par téléphone qui se perdent, sans suivi ni date.","Un bail papier et un état des lieux contestés faute de trace signée.","Des pénalités et des relances dont on ne comprend pas le calcul."],"entry":{"summary":"Le Customer n'est PAS un profil polymorphe : `customer` est un rôle dérivé que tout compte authentifié porte (et `tenant` s'y ajoute quand un bail est en cours). Côté données, `customers` est une fiche CRM PAR AGENCE (`agency_id`, `user_id`) : elle naît à la première candidature / réservation / offre sur un bien de l'agence, ou existe déjà quand l'agence a saisi le client et l'invite à créer son compte.","steps":[{"label":"Avoir un compte","detail":"Connexion par numéro + code SMS (ou e-mail / OAuth) ; voir l'acteur Visiteur. À ce stade le compte a le rôle dérivé `customer` sans aucune ligne `customers`.","page":"/auth/login","api":["POST /api/auth/phone/request-code","POST /api/auth/phone/verify-code"],"tables":["users","personal_access_tokens"]},{"label":"Orientation « Chercher » et profil minimal","detail":"La porte « chercher » crée une alerte (plusieurs quartiers possibles). Une modale d'accueil (3 écrans) puis la complétion différée du profil (téléphone, ville, type de recherche) au premier geste sensible.","page":"/onboarding/intention","api":["PATCH /api/me","POST /api/saved-searches","GET /api/me/welcome-seen","POST /api/me/welcome-seen"],"tables":["users","saved_searches","welcome_views"]},{"label":"Première demande = fiche client dans l'agence","detail":"La candidature, l'offre ou la réservation résout la fiche par `CustomerService::findOrCreateFromUser` : fiche existante du compte dans l'agence du bien, sinon fiche saisie par l'agence au même téléphone/e-mail VÉRIFIÉ (rattachée), sinon fiche neuve. Une visite ou un contact ne crée pas de fiche.","page":"/fr/bookings","api":["POST /api/public/properties/{slug}/booking-request"],"tables":["customers","bookings"]},{"label":"Ou : invité par l'agence","detail":"L'agence a saisi le locataire sans compte et l'invite (lien à usage unique à l'e-mail ou au téléphone de la fiche). Il accepte par code SMS : le compte naît ou s'ouvre et la fiche lui est liée (`linkUser`).","page":"/invitations/accept","api":["POST /api/customers/{customer}/invite","GET /api/public/invitations/{token}","POST /api/public/invitations/{token}/code","POST /api/public/invitations/{token}/verify"],"tables":["invitations","customers","users"]},{"label":"Bail actif = locataire","detail":"Un bail `leases.tenant_id` → `customers.id` dont la fiche porte son `user_id` donne le rôle dérivé `tenant` : l'espace affiche baux, paiements, interventions et la check-list d'entrée.","page":"/app","api":["GET /api/auth/me","GET /api/me/leases/{lease}/onboarding-checklist"],"tables":["leases","tenant_onboarding_checklists"]}]},"profile_model":null,"capabilities":[],"capabilities_note":"Aucune capacité de l'enum `Capability` : `customer` et `tenant` sont des rôles dérivés (`HasProfiles::profileTypes`). Les droits viennent des policies, par lien de propriété : `leases.tenant → customers.user_id` (LeasePolicy), la fiche client de la réservation, le visiteur d'une visite, le participant d'une conversation.","spaces":[{"path":"/app","label":"Ma situation","what":"Accueil : prochaines échéances, visites, réservations, interventions ; biens de sa ville sans dossier."},{"path":"/app/favorites","label":"Favoris","what":"Biens gardés, note personnelle, état « plus disponible »."},{"path":"/app/saved-searches","label":"Recherches","what":"Alertes réglables (coupée / quotidienne / hebdomadaire)."},{"path":"/app/bookings","label":"Mes réservations","what":"Candidatures, offres, séjours ; un seul geste par carte."},{"path":"/app/visits","label":"Mes visites","what":"Demandes, confirmations, replanification, avis post-visite."},{"path":"/app/messages","label":"Messages","what":"Le Fil : conversations directes et salles du bail / de la réservation."},{"path":"/app/leases","label":"Mes baux","what":"Détail, signature, contrat PDF, congé, check-list d'entrée."},{"path":"/app/payments","label":"Paiements","what":"Total à régler, paiement en ligne, quittances."},{"path":"/app/maintenance","label":"Interventions","what":"Signaler, suivre, confirmer ou contester."},{"path":"/app/inventories","label":"États des lieux","what":"Reli /SMS pour un participant sans app."]},{"id":"ma-situation","domain":"§2.5 Reporting & tableaux de bord","title":"« Ma situation » : l'accueil du client","business":"Un seul écran pour toutes ses agences : prochaine échéance, visites, réservations, interventions ouvertes ; sans dossier, des biens de sa ville selon sa recherche. Le client sait quoi faire en ouvrant l'app.","priority":"P1","status":"livré","pages":["/app","/app/overview/tenant"],"api":["GET /api/dashboard/me","GET /api/me/rent-summary"],"backend":["App\\Http\\Controllers\\Api\\DashboardController@me","App\\Http\\Controllers\\Api\\Me\\TenantRentSummaryController","App\\Services\\Payments\\TenantRentSummary"],"tables":[{"name":"lease_payments","access":"lit","why":"échéances et restant dû"},{"name":"bookings","access":"lit","why":"réservations en cours"},{"name":"property_visits","access":"lit","why":"visites à venir"},{"name":"maintenance_requests","access":"lit","why":"interventions ouvertes"}],"flow":[{"from":"Visiteur","to":"Front","msg":"ouvre /app"},{"from":"Front","to":"API","msg":"GET dashboard/me + me/rent-summary"},{"from":"API","to":"PostgreSQL","msg":"agrégats de ses fiches client"},{"from":"API","to":"Front","msg":"cartes « à faire »"}],"rules":["Une restitution de caution n'est jamais présentée comme une échéance à payer.","/app/overview/tenant redirige vers /app.","Dates et montants dans la langue de l'utilisateur."],"notifications":[]},{"id":"bail-signature-entree","domain":"§1.4 Location longue durée (baux)","title":"Bail : consulter, signer par code, check-list d'entrée","business":"Le locataire lit son bail, le signe par un code reçu par SMS (sinon e-mail) et télécharge le contrat PDF. À l'activation, une check-list d'entrée le guide : état des lieux, premier paiement, documents.","priority":"P2","status":"livré","pages":["/app/leases","/app/leases/[id]"],"api":["GET /api/leases","GET /api/leases/{lease}","POST /api/leases/{lease}/signature/otp","POST /api/leases/{lease}/signature","GET /api/leases/{lease}/contract/pdf","GET /api/me/leases/{lease}/onboarding-checklist","POST /api/me/leases/{lease}/onboarding-checklist/{item}/complete"],"backend":["App\\Http\\Controllers\\Api\\LeaseSignatureController@sign","App\\Services\\Lease\\LeaseSignatureService","App\\Http\\Controllers\\Api\\Me\\TenantOnboardingChecklistController@complete"],"tables":[{"name":"leases","access":"met à jour","why":"activé à la seconde signature"},{"name":"lease_signatures","access":"crée","why":"empreinte du contrat figé, horodatage, IP"},{"name":"tenant_onboarding_checklists","access":"met à jour","why":"étapes d'entrée cochées"}],"flow":[{"from":"Front","to":"API","msg":"POST …/signature/otp"},{"from":"API","to":"Externe:SMS","msg":"code au numéro vérifié","note":"sinon e-mail"},{"from":"Visiteur","to":"Front","msg":"saisit le code"},{"from":"Front","to":"API","msg":"POST …/signature"},{"from":"API","to":"PostgreSQL","msg":"lease_signatures ; bail actif si 2e signature"},{"from":"API","to":"File","msg":"lease.signed_by_party / lease.signature_completed"}],"rules":["Seul le locataire du bail (tenant.user_id) signe pour la partie `tenant`.","Contrat PDF offert à toute partie qui lit le bail."],"notifications":["Parties : lease.signature_requested, lease.signed_by_party, lease.signature_completed ; « Bienvenue chez vous » à la signature."]},{"id":"payer-loyer","domain":"§1.4 Location longue durée (baux)","title":"Payer son loyer en ligne et recevoir ses quittances","business":"La page Paiements donne un seul total à régler (pénalités comprises), séparé entre ce qui se paie en ligne et à l'agence. Le locataire paie par Wave ou Orange Money, même sans compte via un lien reçu par SMS, et télécharge sa quittance. Les relances arrivent à J-3, J+1 et J+7.","priority":"P1","status":"livré","pages":["/app/payments","/app/payments/return","/fr/pay/[token]"],"api":["GET /api/me/rent-summary","GET /api/lease-payments/{paymentId}/providers","POST /api/lease-payments/{paymentId}/initiate","GET /api/lease-payments/{paymentId}/verify","POST /api/webhooks/payments/{provider}/{token}","GET /api/leases/{lease}/receipts/{payment}/pdf","GET /api/pay/{token}","POST /api/pay/{token}/initiate","GET /api/pay/{token}/receipt"],"backend":["App\\Http\\Controllers\\Api\\PaymentGatewayController@initiate","App\\Http\\Controllers\\Api\\PublicPaymentLinkController@initiate","App\\Services\\Payments\\TenantRentSummary","App\\Listeners\\Payments\\SendRentReceiptAfterOnlinePayment","App\\Jobs\\SendLeasePaymentReminders"],"tables":[{"name":"lease_payments","access":"met à jour","why":"échéance payée, pénalité"},{"name":"lease_payment_links","access":"lit","why":"jeton haché du lien sans compte"},{"name":"integrations","access":"lit","why":"fournisseurs activés par l'agence"}],"flow":[{"from":"Front","to":"API","msg":"GET me/rent-summary"},{"from":"Front","to":"API","msg":"POST lease-payments/{id}/initiate"},{"from":"API","to":"Externe:Wave/Orange Money","msg":"session de paiement"},{"from":"Externe:Wave/Orange Money","to":"API","msg":"webhook signé"},{"from":"API","to":"PostgreSQL","msg":"échéance payée"},{"from":"API","to":"File","msg":"LeasePaymentSettledOnline"},{"from":"File","to":"Externe:E-mail/WhatsApp/SMS","msg":"quittance (lien pour un locataire sans compte)"},{"from":"File","to":"Reverb","msg":"événement dans la salle du bail"}],"rules":["Montant réellement dû : restant du loyer + pénalité si l'agence l'a choisi.","Quittance jamais pour une échéance non acquittée.","Lien de paiement : jeton expirant et révocable ; échéance annulée entre-temps → jamais de « réessayer ».","Relances quotidiennes à 08:00, WhatsApp puis SMS, dans la langue du locataire."],"notifications":["Locataire : lease_payment.due_soon, lease_payment.overdue, lease_payment.settled_online (quittance).","Bailleur : lease_payment.received_landlord, lease_payment.overdue_landlord."]},{"id":"donner-conge","domain":"§1.4 Location longue durée (baux)","title":"Donner congé depuis son espace","business":"Le locataire annonce son départ : le délai de préavis et la pénalité éventuelle sont affichés avant l'envoi, et il peut retirer sa demande tant que la fenêtre d'annulation est ouverte. La clôture reste au gestionnaire.","priority":"P2","status":"livré","pages":["/app/leases/[id]"],"api":["POST /api/leases/{lease}/early-termination","DELETE /api/leases/{lease}/early-termination"],"backend":["App\\Http\\Controllers\\Api\\LeaseEarlyTerminationController@store","App\\Services\\Lease\\EarlyTerminationService"],"tables":[{"name":"leases","access":"met à jour","why":"`early_termination_requested_at`, date d'effet"},{"name":"settings","access":"lit","why":"pénalité en mois de loyer"}],"flow":[{"from":"Visiteur","to":"Front","msg":"choisit la date de départ"},{"from":"Front","to":"API","msg":"POST …/early-termination"},{"from":"API","to":"PostgreSQL","msg":"contrôle du préavis + écrit la demande"},{"from":"API","to":"Front","msg":"demande enregistrée"}],"rules":["Refus si le préavis est trop court ou la date après la fin du bail.","Pénalité = loyer × réglage `lease.early_termination_penalty_months`.","Le gestionnaire confirme (`…/early-termination/confirm`)."],"notifications":[]},{"id":"signaler-panne","domain":"§1.8 Maintenance & interventions","title":"Signaler une panne et suivre l'intervention","business":"Le locataire signale un problème photo d'abord, avec une catégorie et une urgence (description facultative, message vocal possible). Il est prévenu à chaque étape, peut demander un autre créneau, puis confirme ou conteste la résolution.","priority":"P1","status":"livré","pages":["/app/maintenance","/app/maintenance/new","/app/maintenance/[id]","/app/maintenance/[id]/envoyee"],"api":["POST /api/maintenance-requests","POST /api/maintenance-requests/{maintenanceRequest}/photos","GET /api/maintenance-requests","GET /api/maintenance-requests/{maintenanceRequest}","GET /api/maintenance-requests/{maintenanceRequest}/journal","POST /api/maintenance-requests/{maintenanceRequest}/reschedule-requests","POST /api/maintenance-requests/{maintenanceRequest}/confirm-resolution","POST /api/maintenance-requests/{maintenanceRequest}/contest-resolution","POST /api/service-providers/{serviceProviderProfile}/reviews"],"backend":["App\\Http\\Controllers\\Api\\MaintenanceRequestController@store","App\\Observers\\MaintenanceRequestObserver","App\\Jobs\\EscalateUrgentMaintenanceJob","commande maintenance:auto-close"],"tables":[{"name":"maintenance_requests","access":"crée","why":"la demande, statut `open`"},{"name":"media","access":"crée","why":"photos, note vocale"},{"name":"maintenance_reschedule_requests","access":"crée","why":"autre créneau demandé"},{"name":"conversations","access":"crée","why":"salle Le Fil de l'intervention (sujet maintenance_request)"},{"name":"reviews","access":"crée","why":"note du prestataire"}],"flow":[{"from":"Visiteur","to":"Front","msg":"photo + catégorie + urgence"},{"from":"Front","to":"API","msg":"POST maintenance-requests"},{"from":"API","to":"PostgreSQL","msg":"crée la demande + journal","note":"transaction"},{"from":"API","to":"File","msg":"maintenance.created (urgent : escalade)"},{"from":"File","to":"Externe:E-mail/WhatsApp","msg":"prévient l'agence"},{"from":"API","to":"Reverb","msg":"signal dans le fil de l'intervention"},{"from":"Front","to":"API","msg":"POST confirm-resolution"}],"rules":["Le locataire d'un bail en cours sur le bien peut créer ; le lien au bail est vérifié par la policy.","Le demandeur ne voit ni coût estimé, ni coût réel, ni devis.","Clôture automatique sans réponse après 7 jours (04:00) ; le prestataire ne clôt pas."],"notifications":["Agence : maintenance.created / maintenance.urgent_created.","Demandeur : maintenance.step_acknowledged, step_assigned, step_in_progress, step_completed, schedule_changed, auto_closed."]},{"id":"etat-des-lieux","domain":"§1.9 État des lieux & inventaires","title":"État des lieux : signer, contester, recevoir le PDF","business":"Le locataire relit l'état des lieux pièce par pièce, le signe par un tracé (ou sur le téléphone de l'agent avec un code), ou le conteste. À la seconde signature, le PDF part aux deux parties : une preuve opposable pour la caution.","priority":"P2","status":"livré","pages":["/app/inventories","/app/inventories/[id]"],"api":["GET /api/inventories","GET /api/inventories/{inventory}","POST /api/inventories/{inventory}/sign","POST /api/inventories/{inventory}/sign/onsite-code","POST /api/inventories/{inventory}/dispute","GET /api/inventories/{inventory}/pdf"],"backend":["App\\Http\\Controllers\\Api\\InventoryController@sign","App\\Http\\Controllers\\Api\\InventoryController@dispute","App\\Observers\\InventoryOnboardingObserver"],"tables":[{"name":"inventories","access":"met à jour","why":"signatures, contestation"},{"name":"media","access":"lit","why":"photos des pièces"},{"name":"tenant_onboarding_checklists","access":"met à jour","why":"étape « état des lieux » cochée"}],"flow":[{"from":"Front","to":"API","msg":"GET inventories/{id}"},{"from":"Visiteur","to":"Front","msg":"signe (tracé)"},{"from":"Front","to":"API","msg":"POST …/sign"},{"from":"API","to":"PostgreSQL","msg":"signature du locataire"},{"from":"API","to":"File","msg":"inventory.signed_pdf_available","note":"à la seconde signature"}],"rules":["Seuls le locataire et le bailleur du bail contestent.","Chacun signe pour lui-même."],"notifications":["Locataire et bailleur : inventory.signed_pdf_available (cloche + e-mail)."]},{"id":"coffre-documents","domain":"§1.10 Documents & contrats","title":"Coffre de documents et partage sécurisé","business":"Le client retrouve par dossier tout ce qu'il peut lire : ses pièces, celles de ses baux et biens, les documents générés (contrat, quittances). Il voit ce qui expire, télécharge tout en .zip et partage une pièce par un lien temporaire protégé.","priority":"P1","status":"livré","pages":["/app/documents","/app/documents/[id]","/app/pieces","/fr/share/[token]"],"api":["GET /api/me/document-vault","GET /api/me/document-vault/archive","POST /api/me/document-vault/archives","GET /api/me/pieces","POST /api/documents","POST /api/documents/{document}/share","GET /api/share/{token}"],"backend":["App\\Http\\Controllers\\Api\\DocumentVaultController@show","App\\Http\\Controllers\\Api\\DocumentShareLinkController@store","App\\Http\\Controllers\\Api\\DocumentVaultArchiveController@store"],"tables":[{"name":"documents","access":"lit","why":"pièces lisibles par le client"},{"name":"media","access":"lit","why":"fichiers"},{"name":"document_share_links","access":"crée","why":"jeton haché, expiration, mot de passe"},{"name":"document_vault_archives","access":"crée","why":"archive préparée en arrière-plan au-delà de 40 entrées"}],"flow":[{"from":"Front","to":"API","msg":"GET me/document-vault"},{"from":"API","to":"PostgreSQL","msg":"documents lisibles, hors internes"},{"from":"Front","to":"API","msg":"POST documents/{id}/share"},{"from":"API","to":"PostgreSQL","msg":"lien haché"},{"from":"Visiteur","to":"API","msg":"GET /api/share/{token}","note":"tiers sans compte"}],"rules":["Lien : jeton haché, débit limité, mot de passe envoyé dans le corps et protégé contre les essais.","Rappel d'expiration à J-60 et J-7 (07:00, jour de Dakar)."],"notifications":["Client : document.expiring_soon."]},{"id":"avis-client","domain":"§1.11 Avis & réputation","title":"Laisser un avis sur un bien, un agent, une agence","business":"Après un bail, un séjour, une visite ou une intervention, le client laisse un avis ; l'écran « À laisser » liste ce qu'il peut noter. L'avis public dit d'où vient son auteur (« Locataire · bail ») sans exposer la preuve.","priority":"P2","status":"livré","pages":["/app/profile/reviews"],"api":["GET /api/me/review-opportunities","GET /api/public/properties/{slug}/review-eligibility","POST /api/properties/{property}/reviews","POST /api/agents/{user}/reviews","POST /api/agencies/{agency}/reviews","POST /api/reviews/{review}/report"],"backend":["App\\Http\\Controllers\\Api\\ReviewController@storeForProperty","App\\Http\\Controllers\\Api\\ReviewController@opportunities","App\\Observers\\ReviewObserver"],"tables":[{"name":"reviews","access":"crée","why":"note, texte, contexte (`context_kind`)"}],"flow":[{"from":"Front","to":"API","msg":"GET me/review-opportunities"},{"from":"Visiteur","to":"Front","msg":"note + commentaire"},{"from":"Front","to":"API","msg":"POST properties/{id}/reviews"},{"from":"API","to":"PostgreSQL","msg":"vérifie la preuve, insère"},{"from":"API","to":"File","msg":"review.to_moderate / review.received"}],"rules":["Un avis exige une preuve (bail, séjour, visite, intervention).","Sur les routes publiques l'auteur est « Prénom N. »."],"notifications":["Modérateurs : review.to_moderate ; personne notée : review.received."]},{"id":"notifications-preferences","domain":"§2.3 Notifications","title":"Notifications et choix des canaux","business":"Le client reçoit dans la cloche et par e-mail, WhatsApp (SMS en secours) ce qui le concerne : échéance, retard, visite, réservation. WhatsApp est actif par défaut dès que le téléphone est vérifié, et désactivable événement par événement.","priority":"P1","status":"livré","pages":["/app/notifications","/app/profile/notifications"],"api":["GET /api/notifications","POST /api/notifications/read-all","POST /api/notifications/{notification}/read","GET /api/me/notification-preferences","PATCH /api/me/notification-preferences"],"backend":["App\\Http\\Controllers\\Api\\NotificationController@index","App\\Services\\Model\\NotificationService","App\\Notifications\\Channels\\WhatsappChannel","App\\Notifications\\Channels\\SmsChannel"],"tables":[{"name":"app_notifications","access":"lit","why":"la cloche, texte rendu dans la langue du compte"},{"name":"notification_preferences","access":"met à jour","why":"interrupteurs par code et canal"},{"name":"notification_delivery_attempts","access":"lit","why":"suivi des envois"}],"flow":[{"from":"API","to":"PostgreSQL","msg":"ligne app_notifications (synchrone)"},{"from":"API","to":"File","msg":"CodedNotification"},{"from":"File","to":"Externe:WhatsApp","msg":"message","note":"SMS en secours ; heures calmes"},{"from":"Front","to":"API","msg":"GET /api/notifications"},{"from":"Front","to":"API","msg":"PATCH me/notification-preferences"}],"rules":["L'API émet des codes ; le front possède le texte (fr/en/wo).","Le wolof est en pause : une clé neuve porte le texte français."],"notifications":[]},{"id":"factures-espace-locataire","domain":"§1.4 Location longue durée (baux)","title":"Voir les factures adressées au locataire","business":"Le locataire retrouverait dans son espace les factures que l'agence lui adresse (frais de dossier, réparations refacturées).","priority":"P3","status":"partiel","pages":[],"api":["GET /api/invoices"],"backend":["App\\Http\\Controllers\\Api\\InvoiceController@index"],"tables":[{"name":"invoices","access":"lit","why":"factures du client"}],"flow":[{"from":"Front","to":"API","msg":"GET /api/invoices","note":"l'API les liste ; aucun écran client"},{"from":"API","to":"PostgreSQL","msg":"factures adressées au client"},{"from":"API","to":"Front","msg":"liste (non affichée)"},{"from":"Front","to":"Visiteur","msg":"— écran à construire"}],"rules":["features.md le dit : l'API les liste, l'espace ne les montre pas encore."],"notifications":[]},{"id":"evolutions-prevues-client","domain":"§1.3 / §1.7 / §1.2","title":"Remboursement partiel automatique, appels intégrés, traduction, recherche vocale","business":"Pistes inscrites au catalogue sans code : annulation avec remboursement partiel calculé automatiquement, appels audio/vidéo dans la messagerie, traduction automatique FR ↔ EN ↔ WO, recherche vocale ou en langage naturel.","priority":"P3","status":"prévu","pages":[],"api":[],"backend":[],"tables":[],"flow":[],"rules":["Aujourd'hui le remboursement d'acompte est signalé à l'agence et traité à la main.","La dictée (`lib/dictee.ts`) sert au compte rendu de visite et à l'état des lieux, pas à la recherche."],"notifications":[]}]},{"id":"owner","name":"Propriétaire","icon_hint":"maison","pitch":"Le bailleur qui possède un ou plusieurs biens : seul (« hôte », il gère lui-même son espace) ou confié à une agence qui le gère pour lui sous mandat.","value":["Publier une annonce en quelques minutes, même sans compte : le compte se crée au moment de publier, avec le seul numéro de téléphone.","Voir d'un coup d'œil ses loyers du mois (reçus, en retard, à venir), l'occupation de ses biens et ce que l'agence lui a reversé.","Relances de loyer automatiques par WhatsApp (SMS en secours) et paiement en ligne Wave / Orange Money par lien, sans que le locataire ait besoin d'un compte.","Baux signés à distance par code SMS, quittances et contrat en PDF, relevé de gérance mensuel et attestation annuelle de revenus.","Garder la main sur l'argent des travaux : au-delà d'un plafond, aucun devis n'est accepté sans son accord.","Tous ses papiers (titres, mandat, baux, états des lieux) dans un coffre unique, partageables par lien sécurisé."],"pains":["Loyers payés en liquide ou par mobile money sans trace : impayés repérés tard, aucune quittance, litiges sans preuve.","Opacité des agences : le bailleur ne sait pas ce qui a été encaissé, ce qui a été retenu en commission ni quand il sera payé.","Annonces copiées et republiées sur Facebook ou les sites d'annonces sans son accord, avec des numéros d'intermédiaires.","Bailleur souvent à l'étranger (diaspora) : impossible de signer, de valider des travaux ou de suivre un état des lieux sur place."],"entry":{"summary":"Deux portes. (1) L'hôte solo clique « Publier » : il remplit son annonce sans compte, puis donne son numéro ; Takussan crée le compte, un espace individuel (agence de type `individual`) et, dans cet espace, DEUX profils polymorphes — `AgencyAdminProfile` (actif, posé en cookie) et `OwnerProfile`. (2) Le bailleur invité par une agence reçoit un lien ; l'acceptation fait naître son compte et active son `OwnerProfile` seul, puis l'assistant /onboarding/owner vérifie son téléphone et son KYC. Il n'existe pas de table « membership » : l'appartenance est la ligne de profil elle-même (`agency_id` + `agency_role_id`), qui pointe vers un rôle système de l'agence (`agency_roles`) dont les capacités sont dans `agency_role_capabilities`. Le profil actif de chaque requête est résolu par le middleware `ResolveActiveProfile` (en-tête, cookie `active_profile_id`, dernier espace retenu, ou bascule automatique s'il n'y a qu'une agence). Capacités : Amorce du rôle système `owner` (SystemRoleCapabilities::owner) : une seule capacité. Presque tout ce que fait le bailleur est jugé par les policies sur la PROPRIÉTÉ de la ressource (bien dont il est titulaire `properties.user_id`, bail dont il est `leases.landlord_id`, reversement dont il est bénéficiaire `payouts.landlord_id`), jamais par une capacité d'agence. L'hôte solo cumule aussi l'AgencyAdminProfile de son espace : il reçoit alors toutes les capacités assignables d'agence (dont `properties.create`, `properties.publish`, `boost.spend`, `payouts.approve`). Le vrai juge reste le pivot `agency_role_capabilities` : un rôle personnalisé peut s'écarter de l'amorce.","steps":[{"label":"Annonce sans compte","detail":"L'assistant de publication tourne entièrement dans le navigateur ; le brouillon est gardé localement. La page affiche la demande de la ville (recherches des 7 derniers jours) pour donner envie de publier.","page":"/publish","api":["GET /api/public/publish/demand"],"tables":["search_query_stats"]},{"label":"Compte par téléphone","detail":"« Publier » ouvre la feuille de compte : code SMS envoyé puis vérifié ; le compte naît vérifié par son numéro (connexion Google/Facebook/Apple aussi possible).","page":"/publish","api":["POST /api/auth/phone/request-code","POST /api/auth/phone/verify-code"],"tables":["users","personal_access_tokens"]},{"label":"Espace individuel créé sans question","detail":"HostIndividualOnboardingService::autoOnboard crée l'agence « Espace de {prénom} » (kind=individual, statut actif), l'AgencyAdminProfile et l'OwnerProfile ; chaque profil reçoit le rôle système de l'agence (AgencySystemRoleSeeder). Idempotent ; derrière le drapeau `host_auto_space` (sinon assistant /onboarding/host avec OTP).","page":"/publish","api":["POST /api/host/individual/auto-onboard","POST /api/host/individual/onboard"],"tables":["agencies","agency_admin_profiles","owner_profiles","agency_roles","agency_role_capabilities","activity_log"]},{"label":"Brouillon versé puis publication","detail":"Le brouillon local est versé au brouillon serveur, le bien est créé dans l'espace du profil actif puis publié après acceptation des CGU et contrôle du contact joignable (PublishReadiness).","page":"/app/properties/new","api":["PUT /api/me/wizard-drafts/{key}","POST /api/properties","POST /api/properties/{property}/publish"],"tables":["wizard_drafts","properties","consent_proofs"]},{"label":"Variante : invitation par une agence","detail":"Le personnel de l'agence invite le bailleur (profil `draft` + invitation). Le lien montre un aperçu public, le numéro est vérifié par code, puis l'acceptation crée le compte et active l'OwnerProfile.","page":"/invitations/accept","api":["POST /api/agencies/{agency}/owners/invite","GET /api/public/invitations/{token}","POST /api/public/invitations/{token}/code","POST /api/public/invitations/{token}/verify","POST /api/invitations/{token}/accept"],"tables":["invitations","owner_profiles","users"]},{"label":"Assistant bailleur (KYC)","detail":"Vérification du téléphone, pièces KYC (CNI/passeport, RIB, NINEA) en revue par l'agence ; le profil passe actif et devient le profil courant.","page":"/onboarding/owner","api":["POST /api/me/owner-profiles/{owner_profile}/kyc/upload","POST /api/me/owner-profiles/{owner_profile}/kyc/submit","POST /api/owner/onboard/complete"],"tables":["documents","media","owner_profiles","activity_log"]},{"label":"Choix de l'espace actif","detail":"Un compte qui a des profils dan rs application"}],"rules":["Périmètre de messagerie : une seule règle sert le sélecteur, la création et l'ajout.","URL signée des pièces jointes émise aux seuls participants.","Signalement avec motif."],"notifications":["`message.received`, `message.group_invite`, `message.mention`."]},{"id":"owner-avis","domain":"§1.11 Avis & réputation","title":"Avis reçus et réponses publiques","business":"Il lit les avis laissés sur ses biens, y répond publiquement et signale un avis inapproprié. La note moyenne publiée ne compte que les avis publiés.","priority":"P2","status":"livré","pages":["/app/profile/reviews"],"api":["GET /api/properties/{property}/reviews","POST /api/reviews/{review}/reply","DELETE /api/reviews/{review}/reply","POST /api/reviews/{review}/report"],"backend":["App\\Http\\Controllers\\Api\\ReviewController@reply"],"tables":[{"name":"reviews","access":"met à jour","why":"réponse publique ; signalements gardés dans metadata.reports"}],"flow":[{"from":"Propriétaire","to":"Front","msg":"répond à un avis"},{"from":"Front","to":"API","msg":"POST /reviews/{id}/reply"},{"from":"API","to":"API","msg":"policy : auteur de la réponse = sujet de l'avis"},{"from":"API","to":"PostgreSQL","msg":"réponse enregistrée"},{"from":"API","to":"Front","msg":"réponse affichée sur la fiche publique"}],"rules":["Un signalement range l'avis en modération sans le masquer."],"notifications":["`review.received`."]},{"id":"owner-radar-reclamer","domain":"§2.12 Radar — acquisition d'annonces","title":"Réclamer ses annonces repérées par le Radar","business":"Le Radar repère des annonces publiées ailleurs. Le propriétaire reçoit un message avec un lien signé : en confirmant par code SMS, il récupère ses annonces dans son propre espace Takussan, ou les refuse.","priority":"P1","status":"livré","pages":["/claim/[token]"],"api":["GET /api/radar/claims/{token}","POST /api/radar/claims/{token}/otp","POST /api/radar/claims/{token}/confirm","POST /api/radar/claims/{token}/decline"],"backend":["App\  du rôle"},{"name":"properties","access":"lit","why":"filtre par titulaire"}],"flow":[{"from":"Front","to":"API","msg":"requête avec profil actif"},{"from":"API","to":"API","msg":"ResolveActiveProfile"},{"from":"API","to":"API","msg":"policy : titulaire / landlord_id / personnel actif"},{"from":"API","to":"PostgreSQL","msg":"requête bornée à ses ressources"}],"rules":["Le « périmètre d'agence » est le PERSONNEL de l'agence (isStaffOf), jamais tout membre : un autre bailleur n'y entre pas (TCK-587).","L'agence est la frontière d'isolation ; une capacité se juge pour un couple (utilisateur, agence)."],"notifications":[]}]},{"id":"agent","name":"Agent immobilier","icon_hint":"mallette","pitch":"Le salarié ou collaborateur d'une agence qui prospecte, fait visiter, signe les baux et gère au quotidien les biens qu'on lui confie.","value":["Une journée organisée : l'accueil « Aujourd'hui » liste les comptes rendus manquants, les demandes qui attendent depuis plus de 24 h et les tâches en retard.","Un CRM qui suggère l'étape suivante (visite confirmée → Prospect, candidature → Négociation) et rapproche automatiquement biens et prospects.","Visites, candidatures et baux enchaînés sans ressaisie : le bail se crée depuis la candidature acceptée et se signe par code SMS.","Commissions calculées automatiquement à l'activation de chaque bail, partagées entre les agents du bien.","Relances de loyers, d'impayés et de signatures en un geste par WhatsApp, et un copilote qui propose des réponses dans la messagerie."],"pains":["Prospects éparpillés entre WhatsApp, appels et carnets papier : leads perdus, aucun suivi.","Visites non confirmées, clients qui ne viennent pas, adresse donnée trop tôt.","Commissions calculées à la main et contestées entre agents.","Relances de loyers et de travaux chronophages, sans trace de ce qui a été dit."],"entry":{"summary":"L'agent entre par INVITATION de son agence. L'admin d'agence l'invite : un `AgentProfile` naît en statut `draft`, avec une invitation (e-mail ou lien partagé). L'agent ouvre le lien, voit un aperçu public, vérifie son numéro par code, puis accepte : le compte est créé s'il n'existe pas et le profil passe `active`. L'assistant /onboarding/agent recueille son KYC (numéro de carte professionnelle, pièce d'identité, spécialité, zones) et lui montre son premier prospect. Son profil pointe vers le rôle système `agent` de l'agence (`agency_role_id`) ; ses capacités sont lues dans `agency_role_capabilities`. Il n'y a pas de table « membership » : la ligne `agent_profiles` (agency_id + agency_role_id) EST l'appartenance. Un professionnel peut aussi passer par la porte « pro » et créer sa propre agence (il est alors admin d'agence, pas agent). Capacités : Amorce du rôle système `agent` (SystemRoleCapabilities::agent, 20 capacités). Pas de `boost.spend`, `payouts.approve`, `properties.delete`, `reports.view_agency` ni `team.*` par défaut. Le juge réel est le pivot `agency_role_capabilities` : l'admin peut créer un rôle personnalisé, et une délégation de rôle active (`role_delegations`) peut ajouter des capacités, jamais plus que celles du délégant.","steps":[{"label":"Invitation par l'admin","detail":"L'admin (capacité team.invite) saisit l'agent ; profil draft + invitation à jeton.","page":"/app/agency/team","api":["POST /api/agencies/{agency}/agents/invite"],"tables":["agent_profiles","invitations"]},{"label":"Aperçu public du lien","detail":"Agence, prénom de l'invitant, rôle, destinataire masqué ; états expiré / annulé / accepté discriminés ; renouvellement demandable.","page":"/invitations/accept","api":["GET /api/public/invitations/{token}","POST /api/public/invitations/{token}/renewal-request"],"tables":["invitations"]},{"label":"Numéro vérifié","detail":"Code SMS envoyé puis vérifié sur le jeton de l'invitation.","page":"/invitations/accept","api":["POST /api/public/invitations/{token}/code","POST /api/public/invitations/{token}/verify"],"tables":["users"]},{"label":"Acceptation","detail":"Crée le compte si l'e-mail est inconnu (sinon demande la connexion puis rejoue), matérialise le profil et le passe actif.","page":"/invitations/accept","api":["POST /api/invitations/{token}/accept"],"tables":["users","agent_profiles","invitations","personal_access_tokens"]},{"label":"Assistant agent (KYC)","detail":"Pièces, spécialité, zones et langues, fiche d'annuaire, premier prospect ; fin de l'assistant.","page":"/onboarding/agent","api":["POST /api/me/agent-profiles/{agent_profile}/kyc/upload","POST /api/me/agent-profiles/{agent_profile}/kyc/submit","PATCH /api/me/agent-profiles/{agent_profile}/specialization","GET /api/me/agent-profiles/{agent_profile}/first-lead","POST /api/agent/onboard/complete"],"tables":["documents","media","agent_profiles","activity_log"]},{"label":"Profil actif et capacités","detail":"Le cookie active_profile_id désigne l'AgentProfile ; ResolveActiveProfile le relit à chaque requête ; le front lit ses capacités pour afficher les gestes.","page":"/app","api":["GET /api/me/profiles","PATCH /api/me/active-profile","GET /api/me/capabilities","GET /api/me/agent-profiles/{agent_profile}/role-capabilities"],"tables":["agency_roles","agency_role_capabilities"]}]},"profile_model":"AgentProfile","profile_table":"agent_profiles","capabilities":["properties.create","properties.update_own","properties.publish","bookings.validate","bookings.cancel","leases.create","leases.sign","leases.renew","leases.terminate","leases.refund_deposit","leases.rent_review","payments.record","invoices.create","invoices.send","payouts.create","crm.view_all","crm.assign","maintenance.assign","maintenance.close","messaging.copilot"],"capabilities_note":"Amorce du rôle système `agent` (SystemRoleCapabilities::agent, 20 capacités). Pas de `boost.spend`, `payouts.approve`, `properties.delete`, `reports.view_agency` ni `team.*` par défaut. Le juge réel est le pivot `agency_role_capabilities` : l'admin peut créer un rôle personnalisé, et une délégation de rôle active (`role_delegations`) peut ajouter des capacités, jamais plus que celles du délégant.","spaces":[{"path":"/app","label":"Aujourd'hui","what":"Accueil de l'agent : ce qu'il y a à régler, la journée, ses chiffres."},{"path":"/app/messages","label":"Messagerie","what":"Le Fil, boîte de pilotage, notes d'équipe, copilote."},{"path":"/app/tasks","label":"Tâches","what":"En retard / aujourd'hui / à venir."},{"path":"/app/leads","label":"Demandes","what":"Demandes de contact à prendre en charge et convertir."},{"path":"/app/customers","label":"Clients","what":"Fiches clients ; pipeline sous /app/crm/pipeline."},{"path":"/app/visits","label":"Visites","what":"Aujourd'hui, à confirmer, à clore, plus tard."},{"path":"/app/calendar","label":"Calendrier","what":"Mon agenda (semaine) et occupation des biens."},{"path":"/app/properties","label":"Biens","what":"Catalogue de l'agent, saisie et publication."},{"path":"/app/bookings","label":"Réservations","what":"Séjours, candidatures, offres."},{"path":"/app/leases","label":"Baux","what":"File « À traiter », création, signature, vie du bail."},{"path":"/app/inventories","label":"États des lieux","what":"Entrées / sorties pièce par pièce."},{"path":"/app/maintenance","label":"Interventions","what":"Files par état d'attente, dispatch des prestataires."},{"path":"/app/commissions","label":"Commissions","what":"Son grand livre de commissions."},{"path":"/app/reports","label":"Rapports","what":"Vue d'ensemble, pipeline, exports."},{"path":"/app/payments","label":"Argent (hors menu)","what":"Historique des paiements, factures, création d'un reversement ; atteint depuis les baux et la fiche bailleur."},{"path":"/app/profile/public-profile","label":"Profil public","what":"Fiche publique et annuaire (langues, quartiers, note)."}],"journey":[{"stage":"Rejoindre","what":"Invité par son agence, il vérifie son numéro, accepte et complète son KYC."},{"stage":"Rentrer des mandats","what":"Il saisit les biens, au nom d'un bailleur qu'il invite au besoin, et les publie."},{"stage":"Capter","what":"Les demandes de contact arrivent ; il les prend en charge, appelle ou écrit par WhatsApp, crée la fiche client."},{"stage":"Faire visiter","what":"Il planifie et confirme les visites, puis rédige le compte rendu et propose la suite (candidater, faire une offre)."},{"stage":"Conclure","what":"Il instruit la candidature ou l'offre (dossier, garants, contre-offre), crée le bail et le fait signer par code SMS."},{"stage":"Gérer","what":"Il suit les loyers et relances, les interventions et états des lieux, prépare les reversements."},{"stage":"Être payé","what":"Sa commission est inscrite au grand livre à l'activation du bail, puis réglée par l'agence."}],"features":[{"id":"agent-rejoindre-agence","domain":"§2.1 Authentification & comptes","title":"Rejoindre une agence par invitation","business":"L'agent reçoit un lien de son agence, vérifie son numéro et accepte en quelques secondes. Un assistant en deux étapes complète son profil et lui présente son premier prospect.","priority":"P1","status":"livré","pages":["/invitations/accept","/onboarding/agent"],"api":["POST /api/agencies/{agency}/agents/invite","GET /api/public/invitations/{token}","POST /api/public/invitations/{token}/code","POST /api/public/invitations/{token}/verify","POST /api/invitations/{token}/accept","POST /api/agent/onboard/complete"],"backend":["App\\Http\\Controllers\\Api\\Agency\\AgentInvitationController","App\\Http\\Controllers\\Public\\InvitationAcceptController","App\\Http\\Controllers\\AgentOnboardingController@complete","commandes planifiées invitations:remind / invitations:expire"],"tables":[{"name":"invitations","access":"crée","why":"jeton d'invitation"},{"name":"agent_profiles","access":"crée","why":"draft puis active"},{"name":"users","access":"crée","why":"compte de l'invité"},{"name":"agency_roles","access":"lit","why":"rôle système agent"}],"flow":[{"from":"Externe:Admin d'agence","to":"API","msg":"POST agencies/{id}/agents/invite"},{"from":"API","to" s":"écrit","why":"équipements"},{"name":"addresses","access":"crée","why":"adresse géolocalisée"},{"name":"property_price_histories","access":"crée","why":"historique de prix"}],"flow":[{"from":"Agent immobilier","to":"Front","msg":"remplit le formulaire du bien"},{"from":"Front","to":"API","msg":"POST /properties"},{"from":"API","to":"API","msg":"properties.create dans l'agence active"},{"from":"API","to":"PostgreSQL","msg":"bien + référence"},{"from":"Front","to":"API","msg":"POST /properties/{id}/publish"},{"from":"API","to":"API","msg":"PublishReadiness : contact joignable"},{"from":"API","to":"Meilisearch","msg":"indexation"},{"from":"API","to":"File","msg":"revalidation page publique"}],"rules":["`properties.create` et `properties.publish` (amorce agent).","Publier exige un contact joignable (agent principal, à défaut titulaire).","Un bien publié peut passer en modération (vérifications automatiques)."],"notifications":["`property.approved` / `property.rejected` après modération."]},{"id":"agent-mandat-bailleur","domain":"§1.1 Gestion des biens","title":"Saisir un bien au nom d'un bailleur et l'inviter","business":"L'agent rattache le bien à un bailleur actif de l'agence, ou invite un nouveau bailleur depuis le formulaire : le bien lui revient quand il accepte. Il voit tous les biens d'un bailleur d'un coup.","priority":"P1","status":"livré","pages":["/app/properties/new","/app/properties/[id]"],"api":["POST /api/agencies/{agency}/owners/invite","GET /api/properties","GET /api/properties/{property}/owner-transfer","PUT /api/properties/{property}/owner"],"backend":["App\\Http\\Controllers\\Api\\Agency\\OwnerInvitationController","App\\Services\\Property\\TitulaireALaSaisie","App\\Services\\Property\\PropertyOwnerTransfer"],"tables":[{"name":"properties","access":"met à jour","why":"titulaire ou pending_owner_profile_id"},{"name":"owner_profiles","access":"crée","why":"bailleur invité (draft)"},{"name":"invitations","access":"crée","why":"invitation du bailleur"}],"flow":[{"from":"Agent immobilier","to":"Front","msg":"choisit « inviter un bailleur »"},{"from":"Front","to":"API","msg":"POST agencies/{id}/owners/invite"},{"from":"API","to":"PostgreSQL","msg":"owner_profiles draft + invitation"},{"from":"Front","to":"API","msg":"POST /properties (pending_owner_profile_id)"},{"from":"API","to":"File","msg":"invitation.received au bailleur"},{"from":"File","to":"PostgreSQL","msg":"à l'acceptation : bien transféré"},{"from":"API","to":"File","msg":"property.assigned_to_owner"}],"rules":["Le bien reste à l'agence tant que l'invitation n'est pas acceptée ; révoquée ou expirée, il y reste.","Filtre `filter[owner_profile_id]` borné à l'agence du profil."],"notifications":["`invitation.received`, `property.assigned_to_owner`."]},{"id":"agent-collaborateurs","domain":"§1.1 Gestion des biens","title":"Collaborateurs, agent principal et réattribution","business":"Plusieurs agents peuvent travailler sur un bien avec une part de commission explicite. Un seul est l'agent principal, celui que les visiteurs appellent. Un bien se réattribue à un autre agent actif de l'agence.","priority":"P1","status":"livré","pages":["/app/properties/[id]"],"api":["GET /api/properties/{property}/collaborators","POST /api/properties/{property}/collaborators","PUT /api/properties/{property}/collaborators/{collaborator}/primary","PUT /api/properties/{property}/assigned-agent"],"backend":["App\\Http\\Controllers\\Api\\PropertyCollaboratorController@store","App\\Services\\Property\\PrimaryAgentDesignator","App\\Services\\Property\\ResponsibleAgentAssigner"],"tables":[{"name":"property_collaborators","access":"crée","why":"rôle et part de commission"},{"name":"properties","access":"met à jour","why":"agent responsable"}],"flow":[{"from":"Agent immobilier","to":"Front","msg":"ajoute un collaborateur"},{"from":"Front","to":"API","msg":"POST /properties/{id}/collaborators"},{"from":"API","to":"PostgreSQL","msg":"collaborateur + part"},{"from":"Front","to":"API","msg" celle de sa fiche publique."],"notifications":["`review.received`."]}]},{"id":"agency_admin","name":"Administrateur d'agence","icon_hint":"bouclier","pitch":"Le gérant ou le responsable d'une agence immobilière : il configure l'agence, compose l'équipe, fixe les droits et pilote l'activité et l'argent.","value":["Une agence montée en quelques minutes : fiche, logo, mentions légales, vérification KYC suivie à l'écran.","Une équipe sous contrôle : invitations, rôles sur mesure, suspension, retrait et passation du portefeuille d'un agent qui part.","Les bailleurs suivis dans un carnet : mandat, relevé du mois, reste à verser, fin de mandat encadrée.","Un pilotage chiffré : rapports, performance de l'équipe, impayés, exports, KPI et alertes de seuil.","Un journal d'audit propre à l'agence, pour savoir qui a fait quoi et quand.","Une visibilité qui se paie en crédits : boosts d'annonces et place « Mise en avant » de l'annuaire."],"pains":["Les droits de chaque collaborateur se gèrent à la main et sans trace.","Le départ d'un agent laisse des biens, des clients et des visites sans responsable.","Les bailleurs, les reversements et les impayés se suivent sur des tableurs dispersés.","Rien ne prouve à un client ou à la plateforme que l'agence est en règle (RCCM, NINEA)."],"entry":{"summary":"Trois portes. (1) Console : un super-admin crée l'agence et son gérant ; le gérant (pas l'opérateur) reçoit un e-mail d'activation valable 7 jours et devient administrateur principal (AgencyAdminProfile + AgentProfile). (2) Libre-service : depuis l'orientation, « Créer mon espace pro » ouvre une agence « standard » active mais non vérifiée ; l'appelant en devient administrateur principal (AgencyAdminProfile + AgentProfile) et le dossier KYC naît « en attente ». (3) Hôte : « Publier » crée sans question une agence individuelle ; l'appelant reçoit un AgencyAdminProfile et un OwnerProfile, puis peut demander le passage en agence standard. Un co-admin, lui, entre par invitation (rôle agency_admin).","steps":[{"label":"Création par la console","detail":"Un super-admin saisit l'agence et son gérant. Un e-mail ou un numéro déjà connu est refusé (409). L'API crée l'agence, l'adresse, le compte, l'AgentProfile et l'AgencyAdminProfile, puis met l'e-mail d'activation en file.","page":"/super-admin/agencies","api":["POST /api/admin/agencies"],"tables":["agencies","addresses","users","agent_profiles","agency_admin_profiles","activity_log"]},{"label":"Activation et sécurisation","detail":"Le lien d'activation pose le mot de passe, puis mène à un assistant en deux étapes : accueil, puis double authentification.","page":"/onboarding/agency-admin","api":["POST /api/auth/reset-password","POST /api/auth/two-factor/enable","POST /api/auth/two-factor/confirm"],"tables":["users","password_reset_tokens"]},{"label":"Ou : ouvrir soi-même son espace pro","detail":"Depuis l'orientation, avec un numéro vérifié. Un NINEA déjà porté par une agence vérifiée est refusé. Tant qu'elle n'est pas vérifiée, l'agence ne publie aucun bien et ne reçoit pas les crédits de bienvenue.","page":"/onboarding/intention","api":["POST /api/me/agencies"],"tables":["agencies","agency_admin_profiles","agent_profiles","kyc_dossiers","activity_log"]},{"label":"Ou : espace hôte puis passage en pro","detail":"« Publier » crée sans question une agence individuelle (admin + bailleur). Le passage en « standard » se demande avec les pièces légales et un super-admin le valide.","page":"/app/settings/agency/upgrade","api":["POST /api/host/individual/auto-onboard","POST /api/agencies/{agency}/upgrade-requests"],"tables":["agencies","agency_admin_profiles","owner_profiles","agency_upgrade_requests"]},{"label":"Faire vérifier l'agence","detail":"Dépôt du RCCM, du NINEA et de la pièce du dirigeant, puis soumission. La plateforme vérifie le dossier, puis l'agence.","page":"/app/agency/kyc","api":["POST /api/agencies/{agency}/kyc/documents","POST /api/agencies/{agency}/kyc/submit"],"tables":["kyc_dossiers","media"]}]},"profile_model":"AgencyAdminProfile","profile_table":"agency_admin_profiles","capabilities":["agency.update","agency.update_kyc","agency.update_billing","agency.upgrade_request","team.invite","team.assign_role","team.remove","team.suspend","team.delegate_role","properties.create","properties.update_any","properties.update_own","properties.delete","properties.publish","bookings.validate","bookings.cancel","bookings.refund","leases.create","leases.sign","leases.terminate","leases.renew","leases.refund_deposit","leases.rent_review","leases.rent_review_force","payments.record","payments.refund","payments.export","payments.reconcile","invoices.create","invoices.write_off","invoices.send","payouts.create","payouts.approve","owners.update","crm.view_all","crm.export","crm.assign","maintenance.assign","maintenance.close","messaging.broadcast","messaging.archive","messaging.copilot","reports.view_agency","reports.export","roles.create_custom","roles.edit_custom","roles.delete_custom","boost.spend"],"spaces":[{"path":"/app","label":"Accueil","what":"Tableau de bord du jour, avec le groupe « Démarrer » tant que l'espace est neuf."},{"path":"/app/agency","label":"Fiche de l'agence","what":"Identité, contacts, mentions légales, vitrine publique et jauge de complétude."},{"path":"/app/agency/team","label":"Équipe","what":"Agents et admins : invitations, rôles, absences, suspension, retrait et passation."},{"path":"/app/agency/roles","label":"Rôles","what":"Éditeur de rôles personnalisés (agences standard)."},{"path":"/app/agency/kyc","label":"Vérification","what":"Dossier KYC de l'agence et ses pièces."},{"path":"/app/agency/billing","label":"Offre et reversements","what":"Abonnement, quotas et reversements de la plateforme vers l'agence."},{"path":"/app/agency/finances","label":"Argent","what":"Finances de l'agence, rapprochement bancaire."},{"path":"/app/agency/integrations","label":"Intégrations","what":"Passerelles de paiement et leurs webhooks."},{"path":"/app/agency/audit","label":"Journal","what":"Journal d'audit de l'agence et son export."},{"path":"/app/owners","label":"Bailleurs","what":"Carnet des propriétaires sous mandat."},{"path":"/app/maintenance/providers","label":"Prestataires","what":"Carnet des prestataires et invitations."},{"path":"/app/reports","label":"Rapports","what":"Vue d'ensemble, équipe, impayés, exports, indicateurs et alertes."},{"path":"/app/credits","label":"Crédits","what":"Solde, boosts et place « Mise en avant »."}],"journey":[{"stage":"Arrivée","what":"Création par la console, ouverture en libre-service ou passage d'un espace hôte en pro."},{"stage":"Mise en règle","what":"Fiche complétée, double authentification, dossier KYC soumis puis vérifié."},{"stage":"Équipe","what":"Invitation des agents et co-admins, attribution des rôles, puis des bailleurs et des prestataires."},{"stage":"Exploitation","what":"Suivi des biens, baux, encaissements, reversements et interventions par l'équipe."},{"stage":"Pilotage","what":"Rapports, impayés, KPI, alertes, journal d'audit, crédits de visibilité."},{"stage":"Vie de l'équipe","what":"Absences, suspensions, départs avec passation, fin de mandat d'un bailleur."}],"features":[{"id":"agence-fiche","domain":"§1.12 Agence & équipe","title":"Configurer la fiche et la vitrine de l'agence","business":"L'admin renseigne le nom, le logo, les contacts, les mentions légales et la vitrine publique (accroche, « Pourquoi nous », six biens au plus). Une jauge de complétude dit ce qui manque, et la vitrine peut reprendre les biens les plus vus du mois.","priority":"P0","status":"livré","pages":["/app/agency"],"api":["GET /api/agencies/{agency}","PATCH /api/agencies/{agency}","GET /api/agencies/{agency}/properties/most-viewed","GET /api/agencies/{agency}/setup-status"],"backend":["App\\Http\\Controllers\\Api\\AgencyController@update","App\\Http\\Controllers\\Api\\Agency\\AgencyMostViewedPropertiesController","App\\Services\\Agency\\AgencySetupStatus"],"tables":[{"name":"agencies"
