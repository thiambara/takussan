<div class="group cursor-pointer">
    <!-- Property Card (same structure as above) -->
    <div class="relative">
        <div class="relative aspect-square rounded-xl overflow-hidden bg-gray-200 shadow-sm">
            <img
                    [alt]="property.title"
                    [src]="featuredImageUrl"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">

            <button class="absolute top-3 right-3 p-2 rounded-full bg-white/80 hover:bg-white transition-colors">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                          stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"></path>
                </svg>
            </button>

            <div class="absolute top-3 left-3">
              <span class="px-3 py-1 bg-white/90 backdrop-blur-sm rounded-full text-xs font-medium text-gray-900">
                {{ property.contract_type === 'sale' ? 'Vente' : 'Location' }}
              </span>
            </div>
        </div>

        <div class="mt-1.5">
            <div class="flex items-start justify-between">
                <div class="flex-1">
                    <h3 class="font-medium text-gray-900 line-clamp-1">{{ property.title }}</h3>
                    <p class="text-sm text-gray-500">
                        {{ property.area }} m²
                    </p>
                </div>
            </div>
            <div class="">
                <span class="font-semibold text-gray-900">{{ formatedPrice }} FCFA</span>
                <span *ngIf="property.contract_type === 'rent'"
                      class="text-sm text-gray-500"> /mois</span>
            </div>
        </div>
    </div>
</div>
