<div class="bg-white dark:bg-gray-900 rounded-3xl border border-gray-200/50 dark:border-gray-800 shadow-sm p-6 md:p-8 animate-in fade-in slide-in-from-bottom-4 duration-500" [formGroup]="propertyForm">
  <div class="mb-8">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Informations de base</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Commencez par les informations essentielles de votre bien.</p>
  </div>

  <div class="space-y-6">
    <!-- Title -->
    <div class="space-y-2">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Titre de l'annonce</label>
      <input type="text" formControlName="title"
             class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all placeholder:text-gray-400"
             placeholder="Ex: Superbe villa avec piscine aux Almadies">
      @if (hasError('title', 'required')) {
        <p class="text-xs text-red-500 flex items-center gap-1">
          <lucide-icon [img]="icons.AlertCircle" class="w-3 h-3"></lucide-icon>
          Le titre est requis
        </p>
      }
    </div>

    <!-- Description -->
    <div class="space-y-2">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Description</label>
      <textarea formControlName="description" rows="5"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all placeholder:text-gray-400 resize-none"
                placeholder="Décrivez les atouts de votre bien..."></textarea>
      @if (hasError('description', 'required')) {
        <p class="text-xs text-red-500 flex items-center gap-1">
          <lucide-icon [img]="icons.AlertCircle" class="w-3 h-3"></lucide-icon>
          La description est requise
        </p>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Type -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Type de bien</label>
        <div class="relative">
          <select formControlName="type"
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all appearance-none">
            @for (type of propertyTypes; track type.value) {
              <option [value]="type.value">{{ type.label }}</option>
            }
          </select>
          <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 rotate-90 pointer-events-none"></lucide-icon>
        </div>
      </div>

      <!-- Contract Type -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Type de contrat</label>
        <div class="grid grid-cols-3 gap-2 p-1 bg-gray-100 dark:bg-gray-800 rounded-xl">
          @for (opt of contractTypeOptions; track opt.value) {
            <label class="relative cursor-pointer">
              <input type="radio" formControlName="contract_type" [value]="opt.value" class="peer sr-only">
              <div class="text-center py-1.5 text-sm font-medium text-gray-500 rounded-lg transition-all peer-checked:bg-white peer-checked:text-gray-900 peer-checked:shadow-sm dark:peer-checked:bg-gray-700 dark:peer-checked:text-white">
                {{ opt.label }}
              </div>
            </label>
          }
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Status -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Statut</label>
        <div class="relative">
          <select formControlName="status"
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all appearance-none">
            @for (opt of statusOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
          <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 rotate-90 pointer-events-none"></lucide-icon>
        </div>
      </div>

      <!-- Visibility -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Visibilité</label>
        <div class="relative">
          <select formControlName="visibility"
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all appearance-none">
            @for (opt of visibilityOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
          <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 rotate-90 pointer-events-none"></lucide-icon>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8 flex justify-end">
    <button type="button" (click)="next.emit()"
            class="flex items-center gap-2 px-6 py-2.5 bg-gray-900 text-white dark:bg-white dark:text-gray-900 rounded-xl font-medium hover:opacity-90 transition-opacity">
      Suivant
      <lucide-icon [img]="icons.ArrowRight" class="w-4 h-4"></lucide-icon>
    </button>
  </div>
</div>
