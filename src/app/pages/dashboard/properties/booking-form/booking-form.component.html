<p-dialog (onHide)="onHide()" [(visible)]="visible" [modal]="true" [style]="{width: '500px'}"
          header="{{ isEditMode ? 'Edit Booking' : 'Create New Booking' }}" styleClass="p-fluid">
    <p-toast></p-toast>

    <form *ngIf="bookingForm" [formGroup]="bookingForm">
        <!-- Customer Selection -->
        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="customer">Customer</label>
            <div class="flex gap-2">
                <p-autoComplete
                        (completeMethod)="filterCustomer($event)"
                        (onSelect)="onCustomerSelect($event)"
                        [disabled]="!!selectedCustomer"
                        [dropdown]="true"
                        [forceSelection]="true"
                        [inputStyle]="{'width':'100%'}"
                        [placeholder]="'Search for a customer...'"
                        [style]="{'width':'100%'}"
                        [suggestions]="filteredCustomers"
                        field="last_name">
                    <ng-template let-customer pTemplate="item">
                        <div class="customer-item">
                            <div>{{ customer.first_name }} {{ customer.last_name }}</div>
                            <div class="text-sm text-gray-500">{{ customer.email }}</div>
                        </div>
                    </ng-template>
                </p-autoComplete>
                <button (click)="clearCustomer()" *ngIf="selectedCustomer" class="p-button-rounded p-button-danger p-button-text" icon="pi pi-times" pButton
                        pRipple type="button"></button>
            </div>

            <div *ngIf="selectedCustomer" class="p-2 mt-2 bg-gray-50 rounded-md">
                <div class="text-sm font-medium">{{ selectedCustomer.first_name }} {{ selectedCustomer.last_name }}</div>
                <div class="text-xs text-gray-500">{{ selectedCustomer.email }}</div>
                <div *ngIf="selectedCustomer.phone" class="text-xs text-gray-500">{{ selectedCustomer.phone }}</div>
            </div>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="booking_date">Booking Date *</label>
            <p-datePicker [showButtonBar]="true" [showIcon]="true" dateFormat="yy-mm-dd" formControlName="booking_date"
                          id="booking_date" styleClass="w-full"></p-datePicker>
            <small *ngIf="bookingForm.get('booking_date')?.invalid && bookingForm.get('booking_date')?.touched"
                   class="text-red-500">Booking date is required.</small>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="expiration_date">Expiration Date</label>
            <p-datePicker [showButtonBar]="true" [showIcon]="true" dateFormat="yy-mm-dd" formControlName="expiration_date"
                          id="expiration_date" styleClass="w-full"></p-datePicker>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="status">Status *</label>
            <p-select [options]="bookingStatusOptions" formControlName="status" id="status" optionLabel="label"
                      optionValue="value" styleClass="w-full"></p-select>
            <small *ngIf="bookingForm.get('status')?.invalid && bookingForm.get('status')?.touched"
                   class="text-red-500">Status is required.</small>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="price_at_booking">Price at Booking *</label>
            <p-inputNumber [minFractionDigits]="2" currency="EUR" formControlName="price_at_booking" id="price_at_booking"
                           mode="currency" styleClass="w-full"></p-inputNumber>
            <small *ngIf="bookingForm.get('price_at_booking')?.invalid && bookingForm.get('price_at_booking')?.touched"
                   class="text-red-500">Price is required and must be greater than 0.</small>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="deposit_amount">Deposit Amount</label>
            <p-inputNumber [minFractionDigits]="2" currency="EUR" formControlName="deposit_amount" id="deposit_amount"
                           mode="currency" styleClass="w-full"></p-inputNumber>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="reference_number">Reference Number</label>
            <input class="w-full" formControlName="reference_number" id="reference_number" pInputText/>
        </div>

        <div class="mb-4 field">
            <label class="block mb-2 font-medium" for="notes">Notes</label>
            <textarea class="w-full" formControlName="notes" id="notes" pTextarea rows="3"></textarea>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button (click)="onHide()" label="Cancel" styleClass="p-button-text"></p-button>
        <p-button (click)="saveBooking()" label="Save" styleClass="p-button-primary"></p-button>
    </ng-template>
</p-dialog>
