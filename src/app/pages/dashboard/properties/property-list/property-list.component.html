<div class="space-y-6">
    <!-- Toolbar -->
    <app-card>
        <div class="flex justify-between items-center" slot="body">
            <app-button
                    (click)="openNew()"
                    variant="primary">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                New
            </app-button>

            <app-button
                    (click)="exportCSV()"
                    variant="secondary">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"/>
                </svg>
                Export
            </app-button>
        </div>
    </app-card>

    <!-- Data Table -->
    <app-card>
        <div class="flex justify-between items-center" slot="header">
            <h5 class="text-lg font-semibold text-gray-900 m-0">Manage Properties</h5>
            <app-search-input
                    (search)="onSearch($event)"
                    placeholder="Search properties...">
            </app-search-input>
        </div>

        <div slot="body">
            <app-data-table
                    (selectionChange)="onSelectionChange($event.item)"
                    (sort)="onSort($event)"
                    [columns]="tableColumns"
                    [data]="paginatedProperties"
                    [loading]="loading"
                    [selectable]="true"
                    [selectedItems]="selectedProperties"
                    [sortField]="sortField"
                    [sortOrder]="sortOrder">

                <!-- Custom Status Column Template -->
                <ng-template #statusTemplate let-property="item">
                    <app-status-badge [variant]="getStatusVariant(property.status)">
                        {{ property.status | titlecase }}
                    </app-status-badge>
                </ng-template>

                <!-- Custom Actions Column Template -->
                <ng-template #actionsTemplate let-property="item">
                    <div class="flex items-center space-x-2">
                        <app-button
                                [routerLink]="['/dashboard/properties', property.id]"
                                size="sm"
                                variant="primary">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"/>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"/>
                            </svg>
                        </app-button>

                        <app-button
                                [routerLink]="['/dashboard/properties', property.id, 'edit']"
                                size="sm"
                                variant="primary">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"/>
                            </svg>
                        </app-button>
                    </div>
                </ng-template>

                <!-- Empty State Template -->
                <ng-template #emptyTemplate>
                    <div class="text-center py-12">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"/>
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-gray-900">No properties found</h3>
                        <p class="mt-1 text-sm text-gray-500">Get started by adding a new property.</p>
                        <div class="mt-6">
                            <app-button (click)="openNew()" variant="primary">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"
                                          stroke-width="2"/>
                                </svg>
                                Add Property
                            </app-button>
                        </div>
                    </div>
                </ng-template>
            </app-data-table>

            <!-- Pagination -->
            <div *ngIf="properties.length > 0" class="mt-6">
                <nav class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6">
                    <div class="flex flex-1 justify-between sm:hidden">
                        <button
                                (click)="goToPage(currentPage - 1)"
                                [disabled]="currentPage === 1"
                                class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Previous
                        </button>
                        <button
                                (click)="goToPage(currentPage + 1)"
                                [disabled]="currentPage === totalPages"
                                class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Next
                        </button>
                    </div>

                    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                        <div class="flex items-center space-x-2">
                            <p class="text-sm text-gray-700">
                                Showing
                                <span class="font-medium">{{ getStartIndex() }}</span>
                                to
                                <span class="font-medium">{{ getEndIndex() }}</span>
                                of
                                <span class="font-medium">{{ properties.length }}</span>
                                results
                            </p>

                            <div class="flex items-center space-x-2">
                                <label class="text-sm text-gray-700" for="rows-per-page">Rows per page:</label>
                                <select
                                        (ngModelChange)="onRowsPerPageChange($event)"
                                        [(ngModel)]="rowsPerPage"
                                        class="text-sm border border-gray-300 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        id="rows-per-page">
                                    <option *ngFor="let option of rowsPerPageOptions" [value]="option">
                                        {{ option }}
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <nav aria-label="Pagination" class="isolate inline-flex -space-x-px rounded-md shadow-sm">
                                <button
                                        (click)="goToPage(currentPage - 1)"
                                        [disabled]="currentPage === 1"
                                        class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <span class="sr-only">Previous</span>
                                    <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                        <path clip-rule="evenodd"
                                              d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                                              fill-rule="evenodd"/>
                                    </svg>
                                </button>

                                <ng-container *ngFor="let page of getPageNumbers()">
                                    <button
                                            (click)="goToPage(page)"
                                            *ngIf="page !== '...'"
                                            [class]="page === currentPage
                      ? 'relative z-10 inline-flex items-center bg-blue-600 px-4 py-2 text-sm font-semibold text-white focus:z-20 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-blue-600'
                      : 'relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0'">
                                        {{ page }}
                                    </button>
                                    <span
                                            *ngIf="page === '...'"
                                            class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-700 ring-1 ring-inset ring-gray-300 focus:outline-offset-0">
                    ...
                  </span>
                                </ng-container>

                                <button
                                        (click)="goToPage(currentPage + 1)"
                                        [disabled]="currentPage === totalPages"
                                        class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <span class="sr-only">Next</span>
                                    <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                        <path clip-rule="evenodd"
                                              d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                                              fill-rule="evenodd"/>
                                    </svg>
                                </button>
                            </nav>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </app-card>
</div>
