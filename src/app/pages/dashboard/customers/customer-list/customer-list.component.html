<!--CUSTOMER LIST CONTAINER-->
<div class="customer-list-container animate-[fadeIn_0.5s_ease-in-out]">
    <!-- Toolbar -->
    <app-toolbar class="mb-6 bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <div class="flex items-center gap-3" slot="start">
            <app-button
                    (click)="openNew()"
                    class="transition-all duration-200 hover:-translate-y-0.5"
                    variant="primary"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                New Customer
            </app-button>
        </div>

        <div class="flex items-center gap-3" slot="end">
            <app-button
                    (click)="exportCSV()"
                    class="transition-all duration-200 hover:-translate-y-0.5"
                    variant="secondary"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"></path>
                </svg>
                Export
            </app-button>
        </div>
    </app-toolbar>

    <!-- Data Table -->
    <app-data-table
            [(selectedItems)]="selectedCustomers"
            [columns]="tableColumns"
            [data]="customers"
            [loading]="loading"
            [paginated]="true"
            [rowsPerPageOptions]="rowsPerPageOptions"
            [rowsPerPage]="10"
            [selectable]="true"
            [showCurrentPageReport]="true"
            [sortable]="true"
            class="bg-white rounded-lg shadow-sm border border-gray-200"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            emptyMessage="No customers found"
    >
        <!-- Table Caption with Search -->
        <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg"
             slot="caption">
            <h5 class="text-lg font-semibold text-gray-900 m-0">Manage Customers</h5>
            <app-search-input
                    (search)="search($event)"
                    [(value)]="searchQuery"
                    [debounceTime]="500"
                    class="w-64"
                    placeholder="Search customers..."
            ></app-search-input>
        </div>

        <!-- Custom Row Template -->
        <ng-template #rowTemplate let-customer="item" let-selected="selected">
            <tr
                    (click)="viewCustomerDetails(customer)"
                    [class.bg-blue-50]="selected"
                    class="cursor-pointer hover:bg-gray-50 transition-colors duration-150 animate-[slideIn_0.3s_ease-in-out]"
            >
                <td (click)="$event.stopPropagation()" class="px-4 py-3 w-12">
                    <input
                            (change)="toggleSelection(customer)"
                            [checked]="selected"
                            class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 transition-colors duration-200"
                            type="checkbox"
                    />
                </td>
                <td class="px-4 py-3 font-medium text-gray-900">
                    {{ customer.first_name }} {{ customer.last_name }}
                </td>
                <td class="px-4 py-3 text-gray-700">{{ customer.email }}</td>
                <td class="px-4 py-3 text-gray-700">{{ customer.phone || 'N/A' }}</td>
                <td class="px-4 py-3">
                    <app-status-badge
                            [label]="customer.status || 'inactive'"
                            [variant]="getStatusVariant(customer.status || 'inactive')"
                            class="animate-[fadeIn_0.3s_ease-in-out]"
                    ></app-status-badge>
                </td>
                <td (click)="$event.stopPropagation()" class="px-4 py-3">
                    <div class="flex gap-2 justify-end">
                        <app-button
                                (click)="editCustomer(customer)"
                                class="transition-all duration-200 hover:scale-105"
                                size="sm"
                                variant="secondary"
                        >
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"></path>
                            </svg>
                            Edit
                        </app-button>
                        <app-button
                                (click)="viewCustomerDetails(customer)"
                                class="transition-all duration-200 hover:scale-105"
                                size="sm"
                                variant="info"
                        >
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"></path>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"></path>
                            </svg>
                            Details
                        </app-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <!-- Empty State -->
        <div class="flex flex-col items-center justify-center py-12 text-gray-500 animate-[fadeIn_0.5s_ease-in-out]"
             slot="empty">
            <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="1.5"></path>
            </svg>
            <p class="text-lg font-medium mb-2">No customers found</p>
            <p class="text-sm text-gray-400">Get started by adding your first customer</p>
            <app-button
                    (click)="openNew()"
                    class="mt-4 transition-all duration-200 hover:-translate-y-0.5"
                    variant="primary"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                Add Customer
            </app-button>
        </div>
    </app-data-table>
</div>
