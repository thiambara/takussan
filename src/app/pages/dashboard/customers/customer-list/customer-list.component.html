<!--CUSTOMER LIST CONTAINER-->
<div class="customer-list-container animate-[fadeIn_0.5s_ease-in-out]">
    <!-- Toolbar -->
    <app-toolbar class="mb-6 bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <div class="flex items-center gap-3" slot="start">
            <button
                    (click)="openNew()"
                    class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:-translate-y-0.5"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                New Customer
            </button>
        </div>

        <div class="flex items-center gap-3" slot="end">
            <button
                    (click)="exportCSV()"
                    class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:-translate-y-0.5"
            >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                          stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"></path>
                </svg>
                Export
            </button>
        </div>
    </app-toolbar>

    <!-- Data Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden" [class.opacity-50]="loading">
        <!-- Loading Overlay -->
        <div *ngIf="loading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>

        <!-- Table Caption with Search -->
        <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
            <h5 class="text-lg font-semibold text-gray-900 m-0">Manage Customers</h5>
            <app-search-input
                    (search)="search($event)"
                    [debounceTime]="500"
                    class="w-64"
                    placeholder="Search customers..."
            ></app-search-input>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <!-- Table Header -->
                <thead class="bg-gray-50">
                <tr>
                    <th class="w-12 px-4 py-3 text-left">
                        <input
                                type="checkbox"
                                [checked]="isAllSelected()"
                                [indeterminate]="isSomeSelected()"
                                (change)="onSelectAll($event)"
                                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2">
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" 
                        (click)="onSort('first_name')">
                        <div class="flex items-center gap-1">
                            Name
                            <svg *ngIf="sortField !== 'first_name'" class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                            <svg *ngIf="sortField === 'first_name' && sortOrder === 1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                            </svg>
                            <svg *ngIf="sortField === 'first_name' && sortOrder === -1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
                        (click)="onSort('email')">
                        <div class="flex items-center gap-1">
                            Email
                            <svg *ngIf="sortField !== 'email'" class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                            <svg *ngIf="sortField === 'email' && sortOrder === 1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                            </svg>
                            <svg *ngIf="sortField === 'email' && sortOrder === -1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
                        (click)="onSort('phone')">
                        <div class="flex items-center gap-1">
                            Phone
                            <svg *ngIf="sortField !== 'phone'" class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                            <svg *ngIf="sortField === 'phone' && sortOrder === 1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                            </svg>
                            <svg *ngIf="sortField === 'phone' && sortOrder === -1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
                        (click)="onSort('status')">
                        <div class="flex items-center gap-1">
                            Status
                            <svg *ngIf="sortField !== 'status'" class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                            <svg *ngIf="sortField === 'status' && sortOrder === 1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                            </svg>
                            <svg *ngIf="sortField === 'status' && sortOrder === -1" class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
                </thead>

                <!-- Table Body -->
                <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let customer of paginatedCustomers; trackBy: trackByCustomer"
                    (click)="viewCustomerDetails(customer)"
                    [class.bg-blue-50]="isCustomerSelected(customer)"
                    class="cursor-pointer hover:bg-gray-50 transition-colors duration-150 animate-[slideIn_0.3s_ease-in-out]">
                    
                    <td (click)="$event.stopPropagation()" class="px-4 py-3 w-12">
                        <input
                                (change)="toggleSelection(customer)"
                                [checked]="isCustomerSelected(customer)"
                                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 transition-colors duration-200"
                                type="checkbox"/>
                    </td>
                    <td class="px-4 py-3 font-medium text-gray-900">
                        {{ customer.first_name }} {{ customer.last_name }}
                    </td>
                    <td class="px-4 py-3 text-gray-700">{{ customer.email }}</td>
                    <td class="px-4 py-3 text-gray-700">{{ customer.phone || 'N/A' }}</td>
                    <td class="px-4 py-3">
                        <app-status-badge
                                [label]="customer.status || 'inactive'"
                                [variant]="getStatusVariant(customer.status || 'inactive')"
                                class="animate-[fadeIn_0.3s_ease-in-out]">
                        </app-status-badge>
                    </td>
                    <td (click)="$event.stopPropagation()" class="px-4 py-3">
                        <div class="flex gap-2 justify-end">
                            <button
                                    (click)="editCustomer(customer)"
                                    class="inline-flex items-center justify-center px-3 py-1.5 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:scale-105">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                                          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                                </svg>
                                Edit
                            </button>
                            <button
                                    (click)="viewCustomerDetails(customer)"
                                    class="inline-flex items-center justify-center px-3 py-1.5 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:scale-105">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                                </svg>
                                Details
                            </button>
                        </div>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr *ngIf="customers.length === 0 && !loading">
                    <td colspan="6" class="text-center">
                        <div class="flex flex-col items-center justify-center py-12 text-gray-500 animate-[fadeIn_0.5s_ease-in-out]">
                            <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                                      stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
                            </svg>
                            <p class="text-lg font-medium mb-2">No customers found</p>
                            <p class="text-sm text-gray-400">Get started by adding your first customer</p>
                            <button
                                    (click)="openNew()"
                                    class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed mt-4 transition-all duration-200 hover:-translate-y-0.5">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                                </svg>
                                Add Customer
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div *ngIf="customers.length > 0" class="flex items-center justify-between px-4 py-3 border-t border-gray-200 bg-gray-50">
            <div class="flex items-center gap-2">
                <span class="text-sm text-gray-700">Show</span>
                <select
                        [(ngModel)]="currentRowsPerPage"
                        (ngModelChange)="onRowsPerPageChange($event)"
                        class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                    <option *ngFor="let option of rowsPerPageOptions" [value]="option">{{ option }}</option>
                </select>
                <span class="text-sm text-gray-700">entries</span>
            </div>

            <div class="text-sm text-gray-700">
                {{ getCurrentPageReport() }}
            </div>

            <div class="flex items-center gap-1">
                <button
                        (click)="previousPage()"
                        [disabled]="currentPage === 0"
                        class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous
                </button>

                <button
                        *ngFor="let page of getVisiblePages()"
                        (click)="goToPage(page)"
                        [class.bg-blue-600]="page === currentPage"
                        [class.text-white]="page === currentPage"
                        [class.hover:bg-gray-100]="page !== currentPage"
                        class="px-3 py-1 text-sm border border-gray-300 rounded transition-colors">
                    {{ page + 1 }}
                </button>

                <button
                        (click)="nextPage()"
                        [disabled]="currentPage >= totalPages - 1"
                        class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>
