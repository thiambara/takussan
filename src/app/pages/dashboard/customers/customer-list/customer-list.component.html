<!--CUSTOMER TABLE TOOLBAR-->

<!--PROJECTS TABLE-->
<div class="customer-list-container">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <p-button (click)="openNew()" icon="pi pi-plus" label="New" severity="primary" styleClass="mr-2"></p-button>
        </ng-template>


        <ng-template pTemplate="end">
            <p-button (click)="exportCSV()" icon="pi pi-download" label="Export" severity="secondary"></p-button>
        </ng-template>
    </p-toolbar>

    <p-table #customersTable [(selection)]="selectedCustomers" [paginator]="true"
             [rowsPerPageOptions]="rowsPerPageOptions" [rows]="10" [showCurrentPageReport]="true"
             [value]="customers" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
             dataKey="id"
             styleClass="p-datatable-striped">

        <!--CUSTOMERS TABLE CAPTION-->
        <ng-template #caption>
            <div class="flex justify-between items-center">
                <h5 class="m-0">Manage customers</h5>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search"/>
                    <input (input)="onSearch()" [(ngModel)]="searchQuery" pInputText placeholder="Search..."
                           type="text"/>
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 3rem">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th pSortableColumn="first_name" style="min-width: 10rem">Name
                    <p-sortIcon field="first_name"></p-sortIcon>
                </th>
                <th pSortableColumn="email" style="min-width: 15rem">Email
                    <p-sortIcon field="email"></p-sortIcon>
                </th>
                <th pSortableColumn="phone" style="min-width: 10rem">Phone
                    <p-sortIcon field="phone"></p-sortIcon>
                </th>
                <th pSortableColumn="status" style="min-width: 8rem">Status
                    <p-sortIcon field="status"></p-sortIcon>
                </th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template let-customer pTemplate="body">
            <tr (click)="viewCustomerDetails(customer)" class="cursor-pointer">
                <td (click)="$event.stopPropagation()">
                    <p-tableCheckbox [value]="customer"></p-tableCheckbox>
                </td>
                <td>{{ customer.first_name }} {{ customer.last_name }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone || 'N/A' }}</td>
                <td>
          <span class="customer-status-badge status-{{customer.status || 'inactive'}}">
            {{ customer.status || 'inactive' }}
          </span>
                </td>
                <td (click)="$event.stopPropagation()">
                    <div class="flex gap-2 justify-end">
                        <p-button (onClick)="editCustomer(customer)" class="p-button-text p-button-warning"
                                  icon="pi pi-pencil" label="Edit"></p-button>
                        <p-button (onClick)="viewCustomerDetails(customer)" class="p-button-text" icon="pi pi-eye"
                                  label="Details"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6">
                    <div class="flex p-5 flex-column align-items-center">
                        <i class="text-gray-300 pi pi-users" style="font-size: 3rem"></i>
                        <p class="mt-3 text-gray-500">No customers found</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
