<!--CUSTOMER LIST CONTAINER-->
<div class="customer-list-container animate-[fadeIn_0.5s_ease-in-out]">
  <!-- Toolbar -->
  <app-toolbar class="mb-6 bg-white rounded-lg shadow-sm border border-gray-200 p-4">
    <div slot="start" class="flex items-center gap-3">
      <app-button
        variant="primary"
        (click)="openNew()"
        class="transition-all duration-200 hover:-translate-y-0.5"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        New Customer
      </app-button>
    </div>

    <div slot="end" class="flex items-center gap-3">
      <app-button
        variant="secondary"
        (click)="exportCSV()"
        class="transition-all duration-200 hover:-translate-y-0.5"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Export
      </app-button>
    </div>
  </app-toolbar>

  <!-- Data Table -->
  <app-data-table
    [data]="customers"
    [columns]="tableColumns"
    [loading]="loading"
    [selectable]="true"
    [(selectedItems)]="selectedCustomers"
    [sortable]="true"
    [paginated]="true"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [rowsPerPage]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    emptyMessage="No customers found"
    class="bg-white rounded-lg shadow-sm border border-gray-200"
  >
    <!-- Table Caption with Search -->
    <div slot="caption" class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
      <h5 class="text-lg font-semibold text-gray-900 m-0">Manage Customers</h5>
      <app-search-input
        [(value)]="searchQuery"
        (search)="search($event)"
        placeholder="Search customers..."
        [debounceTime]="500"
        class="w-64"
      ></app-search-input>
    </div>

    <!-- Custom Row Template -->
    <ng-template #rowTemplate let-customer="item" let-selected="selected">
      <tr 
        (click)="viewCustomerDetails(customer)" 
        class="cursor-pointer hover:bg-gray-50 transition-colors duration-150 animate-[slideIn_0.3s_ease-in-out]"
        [class.bg-blue-50]="selected"
      >
        <td class="px-4 py-3 w-12" (click)="$event.stopPropagation()">
          <input
            type="checkbox"
            [checked]="selected"
            (change)="toggleSelection(customer)"
            class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 transition-colors duration-200"
          />
        </td>
        <td class="px-4 py-3 font-medium text-gray-900">
          {{ customer.first_name }} {{ customer.last_name }}
        </td>
        <td class="px-4 py-3 text-gray-700">{{ customer.email }}</td>
        <td class="px-4 py-3 text-gray-700">{{ customer.phone || 'N/A' }}</td>
        <td class="px-4 py-3">
          <app-status-badge
            [variant]="getStatusVariant(customer.status || 'inactive')"
            [text]="customer.status || 'inactive'"
            class="animate-[fadeIn_0.3s_ease-in-out]"
          ></app-status-badge>
        </td>
        <td class="px-4 py-3" (click)="$event.stopPropagation()">
          <div class="flex gap-2 justify-end">
            <app-button
              variant="secondary"
              size="sm"
              (click)="editCustomer(customer)"
              class="transition-all duration-200 hover:scale-105"
            >
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
              Edit
            </app-button>
            <app-button
              variant="info"
              size="sm"
              (click)="viewCustomerDetails(customer)"
              class="transition-all duration-200 hover:scale-105"
            >
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              Details
            </app-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Empty State -->
    <div slot="empty" class="flex flex-col items-center justify-center py-12 text-gray-500 animate-[fadeIn_0.5s_ease-in-out]">
      <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
      </svg>
      <p class="text-lg font-medium mb-2">No customers found</p>
      <p class="text-sm text-gray-400">Get started by adding your first customer</p>
      <app-button
        variant="primary"
        (click)="openNew()"
        class="mt-4 transition-all duration-200 hover:-translate-y-0.5"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Add Customer
      </app-button>
    </div>
  </app-data-table>
</div>
