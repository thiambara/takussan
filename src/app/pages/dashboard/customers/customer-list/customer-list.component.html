<!--CUSTOMER TABLE TOOLBAR-->

<div class="card">
    <p-toolbar styleClass="mb-6 rounded-xl border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-700">
        <ng-template pTemplate="start">
            <button pButton pRipple class="p-button-success mr-2 gap-2" (click)="openNew()">
                <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
                <span>Nouveau</span>
            </button>
        </ng-template>

        <ng-template pTemplate="end">
            <button pButton pRipple class="p-button-help gap-2" (click)="exportCSV()">
                <lucide-icon [img]="Upload" class="w-4 h-4"></lucide-icon>
                <span>Exporter</span>
            </button>
        </ng-template>
    </p-toolbar>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <p-table #customersTable [(selection)]="selectedCustomers" [paginator]="true"
                 [rowsPerPageOptions]="rowsPerPageOptions" [rows]="10" [showCurrentPageReport]="true"
                 [value]="customers" currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"
                 dataKey="id"
                 styleClass="p-datatable-sm">

            <!--CUSTOMERS TABLE CAPTION-->
            <ng-template #caption>
                <div class="flex justify-between items-center p-2">
                    <h5 class="m-0 text-lg font-semibold text-gray-900 dark:text-white">Gestion des clients</h5>
                    <p-iconfield>
                        <p-inputicon>
                            <lucide-icon [img]="Search" class="w-4 h-4 text-gray-500"></lucide-icon>
                        </p-inputicon>
                        <input (input)="onSearch()" [(ngModel)]="searchQuery" class="pl-10" pInputText placeholder="Rechercher..."
                               type="text"/>
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                    </th>
                    <th pSortableColumn="first_name" style="min-width: 14rem">
                        <div class="flex items-center gap-2">
                            Nom
                            <lucide-icon [img]="ArrowUpDown" class="w-3 h-3 text-gray-400"></lucide-icon>
                        </div>
                    </th>
                    <th pSortableColumn="email" style="min-width: 14rem">
                        <div class="flex items-center gap-2">
                            Email
                            <lucide-icon [img]="ArrowUpDown" class="w-3 h-3 text-gray-400"></lucide-icon>
                        </div>
                    </th>
                    <th pSortableColumn="phone" style="min-width: 10rem">
                        <div class="flex items-center gap-2">
                            Téléphone
                            <lucide-icon [img]="ArrowUpDown" class="w-3 h-3 text-gray-400"></lucide-icon>
                        </div>
                    </th>
                    <th pSortableColumn="status" style="min-width: 8rem">
                        <div class="flex items-center gap-2">
                            Statut
                            <lucide-icon [img]="ArrowUpDown" class="w-3 h-3 text-gray-400"></lucide-icon>
                        </div>
                    </th>
                    <th style="width: 8rem" class="text-right">Actions</th>
                </tr>
            </ng-template>
            <ng-template let-customer pTemplate="body">
                <tr (click)="viewCustomerDetails(customer)" class="cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                    <td (click)="$event.stopPropagation()">
                        <p-tableCheckbox [value]="customer"></p-tableCheckbox>
                    </td>
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                {{ customer.first_name?.charAt(0) || 'U' }}
                            </div>
                            <span class="font-medium text-gray-900 dark:text-white">{{ customer.first_name }} {{ customer.last_name }}</span>
                        </div>
                    </td>
                    <td>{{ customer.email }}</td>
                    <td>{{ customer.phone || 'N/A' }}</td>
                    <td>
                        <app-badge [variant]="getStatusVariant(customer.status)" size="sm" [rounded]="true">
                            {{ customer.status || 'inactive' }}
                        </app-badge>
                    </td>
                    <td (click)="$event.stopPropagation()" class="text-right">
                        <div class="flex gap-2 justify-end">
                            <button pButton class="p-button-text p-button-sm p-button-rounded p-button-warning"
                                    (click)="editCustomer(customer)" pTooltip="Éditer">
                                <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
                            </button>
                            <button pButton class="p-button-text p-button-sm p-button-rounded p-button-info"
                                    (click)="viewCustomerDetails(customer)" pTooltip="Détails">
                                <lucide-icon [img]="Eye" class="w-4 h-4"></lucide-icon>
                            </button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="6" class="text-center py-8">
                        <div class="flex flex-col items-center justify-center">
                            <lucide-icon [img]="Users" class="w-10 h-10 text-gray-300 mb-3"></lucide-icon>
                            <p class="text-gray-500 font-medium">Aucun client trouvé</p>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
