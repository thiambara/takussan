; Réglages de production de l'API Takussan (ADR-0028 §4). Chargé après php.ini-production.
expose_php = Off
memory_limit = 256M
; nginx acceptait 25 Mo : PHP ne doit pas refuser en dessous.
upload_max_filesize = 25M
post_max_size = 26M
; TCK-673 : fixé, et non laissé au défaut. Au-delà, PHP ignore un fichier EN SILENCE ; la règle
; `photos` `max:20` de StorePropertyMediaRequest refuse le lot avant, avec un 422.
max_file_uploads = 20
; nginx : fastcgi_read_timeout 60. Même borne d'HORLOGE (attente réseau comprise) : PHP est ZTS dans
; cette image, et ses minuteurs de Zend comptent le temps écoulé, pas le temps processeur. Sans effet
; en CLI (0). Mesuré par deploy/takussan/smoke-api.sh image (TCK-2355).
max_execution_time = 60
; PHP2Shell (CVE-2026-109619) : la progression d'envoi des sessions natives est un chemin d'attaque
; confirmé, actif par défaut même sans `session_start()`. Laravel n'utilise pas les sessions natives
; de PHP : rien ne la lit. Défense en profondeur, le correctif est PHP 8.4.27 (Dockerfile).
session.upload_progress.enabled = 0

; Le code d'une image ne change pas : aucune raison de revérifier les fichiers.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
