# Environnement de développement Takussan.
#
#   docker compose up -d          # démarre les quatre services
#   ./dev.sh                      # les démarre PUIS lance l'API, la file, le scheduler et le front
#
# Pourquoi ces quatre-là, et pas un de plus ni un de moins : chacun couvre une
# divergence dev↔prod qui coûtait cher tant qu'elle n'était pas provisionnée.
#
#   postgres     LE MOTEUR, et il n'y en a plus qu'un : PostgreSQL 17 sur TOUS les
#                environnements, suite de tests comprise (ADR-0020). Ce service n'est
#                donc plus « le banc d'essai qui reproduit la production » : c'est
#                l'environnement lui-même. Le gain principal n'est pas PostgreSQL, c'est
#                que **la base de test EST celle de la production** — ce que la suite
#                éprouve est ce que la production exécutera, et la divergence « tests
#                permissifs, production stricte » disparaît au lieu d'être compensée.
#
#                ⚠ CE SERVICE A ÉTÉ `mariadb:11.4`, PUIS `mysql:8.0`, ET LES DEUX
#                ÉTAIENT DES DÉFAUTS DIFFÉRENTS. `mariadb:11.4` tenait à un
#                `apt install mariadb-server` que personne n'avait exécuté ; mesuré sur
#                le serveur le 2026-08-13 :
#                    $ sudo mysql -e "SELECT VERSION(), @@collation_server;"
#                    8.0.46-0ubuntu0.24.04.3 | utf8mb4_0900_ai_ci
#                Ce n'était pas une question de version, c'était le mauvais MOTEUR
#                (TCK-289). Le suivant, `mysql:8.0`, était juste — et il reproduisait
#                une production qui n'a jamais servi (D-04). *Un banc d'essai ne se
#                déduit jamais d'une configuration, seulement d'une mesure ;
#                `scripts/check-db-engine.mjs` en fait une garde, et sa constante
#                s'appelle `CIBLE` et non `PROD` pour cette raison exacte.*
#
#                Le volume a changé de nom avec le moteur (`pgsql-data`) : les fichiers
#                de données de MySQL ne se lisent pas par PostgreSQL. Un environnement
#                déjà monté repart d'une base vide — `./dev.sh` la remigre.
#   meilisearch  la CI et la prod indexent sur Meilisearch, `.env.example` propose
#                `SCOUT_DRIVER=collection`. Le driver `collection` filtre en PHP sur
#                une collection Eloquent : il ne partage ni la tokenisation, ni le
#                classement, ni le typo-tolerance du moteur réel. Une recherche qui
#                « marche en local » n'a rien prouvé de celle qui tourne en prod.
#   redis        LE SEUL des quatre que le développement n'utilise PAS, et il faut le
#                dire ici plutôt que de le laisser croire. `.env.example` pose
#                `CACHE_STORE=redis` sans que rien ne fournisse Redis : l'application
#                ne démarre pas sur une copie fidèle de son propre exemple. Ce service
#                rend cette combinaison servable. Mais `.env.docker` s'aligne sur la
#                PRODUCTION, qui est en `database` — donc rien, dans l'environnement
#                de dev par défaut, ne s'y connecte.
#                Une version antérieure de cette note affirmait le contraire par
#                omission ; `./dev.sh doctor` sonde désormais Redis dès que les
#                conteneurs sont visés, et nomme le fait qu'aucun driver ne le
#                consomme. *Un service qu'on démarre sans jamais l'interroger ne prouve
#                rien : il occupe un port et rassure.*
#   mailpit      ~24 tâches planifiées envoient du courrier (rappels de paiement,
#                relances de facture, digests, invitations). En `MAIL_MAILER=log`
#                elles partent dans un fichier que personne ne relit ; on ne voit
#                jamais le rendu réel d'un e-mail avant la production.
#
# Les volumes sont nommés : `docker compose down` garde les données, `down -v` les
# efface. La bascule complète des variables d'environnement est dans
# `takussan-api/.env.docker`.
#
# PORTS — pourquoi aucun n'est le port canonique. Chaque service est décalé d'un cran
# (5433, 7701, 6380, 1026/8026 au lieu de 5432, 7700, 6379, 1025/8025). Ce n'est pas
# une préférence : **les quatre ports canoniques étaient occupés sur la machine où ce
# fichier a été écrit** — la base et Meilisearch installés nativement par brew, Redis et
# Mailpit tenus par les conteneurs d'un projet voisin. Mesuré, pas supposé.
#
# Le coût du conflit n'est pas l'échec : c'est que `docker compose up` échoue APRÈS
# avoir démarré une partie des services. On se retrouve avec un environnement à moitié
# levé qui se présente comme un démarrage raté plutôt que comme un conflit de ports, et
# la commande suivante travaille sur des services dont on croit qu'ils sont absents.
#
# Le décalage rend les deux mondes simultanés : l'installation native continue de
# servir ce qu'elle servait, Takussan tourne à côté, et on ne démonte rien pour
# reprendre le développement. Chaque port reste surchargeable par une variable dans un
# `.env` à la RACINE du dépôt (lu automatiquement par docker compose, jamais commité) :
#   TAKUSSAN_DB_PORT=5434
# Tout port changé ici doit l'être aussi dans `takussan-api/.env.docker` — c'est la
# seule chose que ce fichier ne peut pas garantir tout seul, et `./dev.sh` la vérifie.
#
# Les services n'écoutent que sur 127.0.0.1 : une base de développement sans mot de
# passe sérieux n'a rien à faire sur l'interface publique d'un portable en wifi.

services:
  postgres:
    # `pgvector/pgvector:pg17`, et surtout PAS `postgres:17`. L'extension `vector` doit
    # être DISPONIBLE sur tous les environnements dès maintenant, alors même qu'aucune
    # table ne l'utilise encore (ADR-0020, §2) : le jour où le chatbot arrive, une
    # instance qui refuse `CREATE EXTENSION vector` se découvre en production, six mois
    # plus tard, et le motif de la migration se referme en silence.
    #
    # Le tag suit les correctifs de la branche 17 sans changer de branche — un passage
    # en 18 doit rester une décision, pas un effet de bord d'un `docker pull`.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: takussan
      POSTGRES_USER: takussan
      POSTGRES_PASSWORD: takussan
      # L'encodage et la collation de la base, ÉCRITS plutôt que subis — même règle que
      # le `--collation-server` que portait MySQL ici : un défaut non écrit est un défaut
      # qu'on ne remarque pas quand il change.
      #
      # `--locale=C` est DÉLIBÉRÉ, et c'est la décision la plus lourde de l'ADR-0020 :
      # comparaison et tri DÉTERMINISTES, sensibles à la casse et aux accents. On ne
      # reproduit PAS l'`utf8mb4_0900_ai_ci` de l'ancienne production, et ce n'est pas un
      # oubli : PostgreSQL REFUSE `LIKE` sur une collation non déterministe, et le dépôt
      # en compte 21. Reproduire MySQL échangerait un problème visible — une comparaison
      # devenue sensible à la casse — contre un problème obscur.
      #
      # Ce que ça met à découvert est écrit dans l'ADR : six contraintes d'unicité sur
      # texte changent de sens, et une contrainte qui change de sens ne lève pas
      # d'erreur — elle laisse passer un doublon en silence.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Décalé d'un cran comme les trois autres (7701 / 6380 / 1026) : une
      # installation brew de PostgreSQL écoute sur 5432, et les deux mondes doivent
      # cohabiter plutôt que l'un démonte l'autre.
      #
      # ⚠ On RÉUTILISE `TAKUSSAN_DB_PORT` plutôt que d'introduire un second nom :
      # `dev.sh` compare cette variable à `DB_PORT` du `.env` — en 11 endroits — pour
      # décider si l'environnement vise les conteneurs du dépôt. Une variable neuve
      # aurait laissé cette comparaison porter sur un port mort, et `./dev.sh doctor`
      # aurait répondu juste sur une question devenue fausse.
      - '127.0.0.1:${TAKUSSAN_DB_PORT:-5433}:5432'
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      # Joué UNIQUEMENT à la première création du volume. Sur un volume existant,
      # rejouer le script à la main : voir l'en-tête de docker/pgsql-init.sql.
      - ./docker/pgsql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # `pg_isready` avec l'utilisateur ET la base : sans eux il interroge la base
      # `postgres` sous l'utilisateur du conteneur et déclare sain un serveur dont la
      # base applicative n'est pas encore créée — un `dev.sh` qui démarre l'API sur une
      # base absente, et c'est la première requête qui meurt.
      test: ['CMD-SHELL', 'pg_isready -U takussan -d takussan']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    # Version alignée sur celle de la CI (`.github/workflows/api-ci.yml`) et sur le
    # contrainte composer `meilisearch/meilisearch-php: ^1.16`. Les trois bougent
    # ensemble ou pas du tout.
    image: getmeili/meilisearch:v1.16
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    ports:
      - '127.0.0.1:${TAKUSSAN_MEILI_PORT:-7701}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      # `curl` EST présent dans l'image — vérifié. La sonde d'origine lançait
      # `meilisearch --help`, qui sort 0 sans jamais toucher au serveur : elle déclarait donc
      # le service sain avant qu'il accepte la moindre connexion, et `dev.sh` enchaînait sur
      # `migrate` contre un moteur pas encore prêt. Une sonde qui n'interroge pas ce qu'elle
      # prétend surveiller est pire qu'aucune sonde : elle donne une réponse.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      # 6380 et non 6379 : cf. la note PORTS de l'en-tête.
      - '127.0.0.1:${TAKUSSAN_REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # ÉPINGLÉ, comme les trois autres. C'était le seul `latest` d'un fichier qui fige PostgreSQL
    # à pg17, Meilisearch à v1.16 et Redis à 8 — et dont l'en-tête soutient qu'une version doit
    # bouger de concert avec la CI et le lock. Un `latest` qui glisse sous le développeur change
    # en silence le seul service dont le rôle est de RENDRE VISIBLE ce que le système produit.
    image: axllent/mailpit:v1.30.3
    ports:
      # 1026/8026 et non 1025/8025 : cf. la note PORTS de l'en-tête.
      - '127.0.0.1:${TAKUSSAN_MAILPIT_SMTP_PORT:-1026}:1025' # SMTP — MAIL_PORT côté Laravel
      - '127.0.0.1:${TAKUSSAN_MAILPIT_UI_PORT:-8026}:8025'   # UI web — http://localhost:8026
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgsql-data:
  meili-data:
  redis-data:
