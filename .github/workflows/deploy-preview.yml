name: Deploy Laravel API (Preview)

on:
  push:
    branches:
      - preview
    paths:
      - "takussan-api/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

concurrency:
  group: takussan-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Preview to Contabo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deploy script to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: "scripts/deploy.sh"
          target: "/var/www/takussan-preview/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          timeout: 10m
          envs: ENV_FILE
          script: |
            chmod +x /var/www/takussan-preview/deploy.sh
            bash /var/www/takussan-preview/deploy.sh "${{ secrets.REPO_URL }}" preview /var/www/takussan-preview
        env:
          ENV_FILE: ${{ secrets.ENV_FILE_PREVIEW }}

      - name: Smoke test
        run: |
          set -e
          sleep 3
          curl -fsS https://preview.api.takussan.com/up \
            || (echo "API preview DOWN"; exit 1)
          echo "✓ API preview responds on /up"
