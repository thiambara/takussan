# CI du frontend Next.js.
#
# Ce workflow n'existait pas. `api-ci.yml` est filtré sur `paths: takussan-api/**`, et aucun autre
# workflow ne mentionnait `takussan-web` : **une PR ne touchant que le frontend ne déclenchait
# rigoureusement rien** — ni les 802 tests vitest, ni ESLint, ni `tsc`, ni le build.
#
# Ce n'est pas resté théorique. Mesuré le 2026-08-12 sur la pointe de `dev` (arbre propre) :
# une erreur ESLint bloquante, une erreur de compilation TypeScript et un test en échec y vivaient
# depuis 53 à 94 jours. Les trois sont corrigées ; ce fichier est ce qui les empêche de revenir.
name: Web CI

on:
  pull_request:
    paths:
      - 'takussan-web/**'
      - '.github/workflows/web-ci.yml'
      # `src/types/__tests__/profile-types.parity.test.ts` (TCK-329) compare `PROFILE_TYPES` aux
      # clés de `ActiveProfileResolver::TYPE_MAP`. C'est une garde à DEUX côtés, et le second
      # n'était couvert par aucune ligne : une PR qui n'ajoute un type de profil QUE côté back —
      # exactement la dérive que la garde existe pour voir — ne déclenchait pas ce workflow, et
      # la garde restait muette. Même règle qu'en tête de `repo-ci.yml` : *les deux côtés qu'une
      # garde compare doivent la déclencher.*
      - 'takussan-api/app/Services/Profiles/ActiveProfileResolver.php'
      # `src/types/__tests__/search-filters.parity.test.ts` (TCK-335) compare les clés de
      # `SearchFilters` à celles de `SearchPublicPropertyRequest::rules()`, et vérifie que
      # `PropertySearchService` les consomme toutes. Même règle, deuxième occurrence : le
      # défaut d'origine — trois filtres produits par l'interface et supprimés par
      # `validated()` — a vécu parce que RIEN ne regardait les deux côtés ensemble.
      - 'takussan-api/app/Http/Requests/Public/SearchPublicPropertyRequest.php'
      # ⚠ `rules()` ÉTALE `...$this->reglesPointEtRayon()` depuis TCK-346 : les clés `lat`,
      # `lng` et `radius_km` vivent dans ce trait, partagé avec `MapPublicPropertyRequest`.
      # La garde le lit ; ce déclencheur doit donc le suivre, sinon elle dort quand le
      # contrat géographique bouge seul.
      - 'takussan-api/app/Http/Requests/Concerns/**'
      # ⚠ `property-labels.parity.test.ts` compare les libellés que `PropertyResource` ÉMET
      # (traduits par `enumLabel()` depuis ces fichiers) à ceux que le dictionnaire du front
      # affiche. Les deux côtés qu'une garde compare doivent la déclencher, sinon elle dort
      # quand le back bouge seul — et c'est précisément ce qui a laissé 44 divergences
      # s'installer sans que rien ne le signale (TCK-351).
      - 'takussan-api/lang/**'
      - 'takussan-api/app/Http/Resources/PropertyResource.php'
      - 'takussan-api/app/Services/Search/PropertySearchService.php'
  push:
    branches: [dev, master]
    paths:
      - 'takussan-web/**'
      - '.github/workflows/web-ci.yml'
      # Mêmes motifs qu'au déclencheur `pull_request`, et pour la même raison.
      - 'takussan-api/app/Services/Profiles/ActiveProfileResolver.php'
      - 'takussan-api/app/Http/Requests/Public/SearchPublicPropertyRequest.php'
      # ⚠ `rules()` ÉTALE `...$this->reglesPointEtRayon()` depuis TCK-346 : les clés `lat`,
      # `lng` et `radius_km` vivent dans ce trait, partagé avec `MapPublicPropertyRequest`.
      # La garde le lit ; ce déclencheur doit donc le suivre, sinon elle dort quand le
      # contrat géographique bouge seul.
      - 'takussan-api/app/Http/Requests/Concerns/**'
      # ⚠ `property-labels.parity.test.ts` compare les libellés que `PropertyResource` ÉMET
      # (traduits par `enumLabel()` depuis ces fichiers) à ceux que le dictionnaire du front
      # affiche. Les deux côtés qu'une garde compare doivent la déclencher, sinon elle dort
      # quand le back bouge seul — et c'est précisément ce qui a laissé 44 divergences
      # s'installer sans que rien ne le signale (TCK-351).
      - 'takussan-api/lang/**'
      - 'takussan-api/app/Http/Resources/PropertyResource.php'
      - 'takussan-api/app/Services/Search/PropertySearchService.php'

jobs:
  quality:
    name: Web (ESLint + tsc + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: takussan-web/package-lock.json

      - run: npm ci

      - name: ESLint
        # Étape séparée du build, et ce n'est PAS redondant : sous Next 16, `next build` ne lance
        # plus ESLint. C'est exactement pourquoi `react-hooks/set-state-in-effect` a survécu sur
        # `dev` — il n'existait aucun chemin automatisé où cette erreur bloquait quoi que ce soit.
        run: npm run lint

      - name: Types (tsc --noEmit)
        # `package.json` n'a pas de script `typecheck` : la commande est écrite ici, en toutes
        # lettres, plutôt que tenue par une convention que personne ne lance. `next build` fait
        # bien une vérification de types, mais il s'arrête à la première erreur et ne voit pas les
        # fichiers de test — or l'erreur trouvée sur `dev` était précisément dans un test.
        run: npx tsc --noEmit

      - name: i18n (parité des locales + cliquet sur le texte en dur)
        # Cette garde vit dans `takussan-web/scripts/` et NON dans `scripts/` à la racine, où sont
        # les sept autres. Ce n'est pas un oubli : `repo-ci.yml` n'exécute aucun `npm ci` — ses
        # gardes n'importent que des modules `node:` natifs — et celle-ci parse le TypeScript avec
        # le compilateur `typescript`. La brancher là-bas obligerait soit à installer les
        # dépendances dans un workflow documentaire qui existe pour être léger, soit à retomber sur
        # une analyse par regex, moins précise sur exactement le point qui compte (distinguer un
        # libellé affiché d'une chaîne technique). Elle est donc ici, où `npm ci` a déjà tourné.
        run: npm run check:i18n

      - name: i18n (découpage du dictionnaire par frontière de rendu)
        # Garde SŒUR de la précédente, et non un doublon : celle-là compare les trois locales
        # entre elles, celle-ci compare la table `src/i18n/namespaces.json` au GRAPHE D'IMPORTS
        # dont elle est dérivée. Elle vit ici pour la même raison — `repo-ci.yml` n'exécute aucun
        # `npm ci`.
        #
        # Elle a sa propre étape plutôt qu'une ligne dans la précédente parce que son échec se lit
        # autrement : « la table ne suit plus le code », pas « une locale a pris du retard ».
        #
        # ⚠ Ce qu'elle garde ne casse RIEN d'autre. Un espace de noms oublié dans le découpage
        # traverse `next build`, ESLint, `tsc --noEmit` et les ~810 tests sans un avertissement,
        # puis peint le chemin de la clé à l'écran d'un utilisateur. Aucune des quatre étapes
        # voisines ne peut le voir : c'est une donnée absente d'un objet, découverte au rendu.
        run: npm run check:i18n-namespaces

      - name: Classes Tailwind non émises (TCK-453)
        # Troisième garde qui vit dans `takussan-web/scripts/` et non dans `scripts/` à la racine,
        # et pour la MÊME raison que les deux i18n ci-dessus : `repo-ci.yml` n'exécute aucun
        # `npm ci`, or celle-ci COMPILE `globals.css` avec `@tailwindcss/postcss`. Elle est donc
        # ici, où `npm ci` a déjà tourné.
        #
        # ⚠ Ce qu'elle garde n'est vu par AUCUNE des cinq étapes voisines. Une classe dont le
        # jeton n'existe pas est une CHAÎNE : `tsc --noEmit` ne la lit pas, ESLint non plus,
        # `next build` réussit, et les ~810 tests passent — l'élément est simplement rendu sans sa
        # couleur. C'est arrivé sur les quatre voiles de la surface publique pendant TCK-440, et
        # seule une relecture de diff l'a rattrapé.
        #
        # Elle a son étape à elle plutôt qu'une ligne dans une autre parce que son échec se lit
        # autrement : « cette classe n'émet rien », pas « ce code est mal écrit ».
        run: npm run check:classes-emises

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
