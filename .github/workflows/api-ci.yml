name: API CI

on:
  pull_request:
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  lint-and-test:
    # TCK-320 — `contents: write` pour le step « Régénérer la carte d'impact » : il pousse un
    # commit sur `dev` après coup. `dev` n'est pas protégée (vérifié le 2026-08-17 : `gh api
    # repos/thiambara/takussan/branches/dev/protection` → 404), le push direct est donc possible.
    # Déclarer `permissions` sur le job REMPLACE les scopes par défaut du token — le reste du job
    # (checkout, upload-artifact) ne lit et n'écrit rien d'autre que `contents`, donc rien n'est
    # perdu qu'on utilisait déjà.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    # TCK-280 — search runs on Meilisearch on every environment, CI included.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.16
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          # TCK-302 — `coverage: none` vivait ici, et le bloc `<source>` de `phpunit.xml`
          # n'alimentait donc AUCUN rapport : ni seuil, ni tendance, ni garde-fou contre
          # l'érosion. Une couverture qu'on ne mesure pas ne baisse jamais — elle baisse
          # sans qu'on le voie, ce qui n'est pas la même chose.
          #
          # PCOV et pas Xdebug : c'est le pilote de couverture à faible surcoût (Xdebug
          # instrumente chaque opcode, PCOV se contente des lignes exécutables). Le job
          # ne fait pas de pas-à-pas, il compte des lignes.
          coverage: pcov
          # `pcov.directory` restreint la COLLECTE à `app/`. Sans lui, PCOV instrumente
          # aussi `vendor/` (~100 paquets) pour un résultat que `<source>` de
          # `phpunit.xml` filtre de toute façon à l'arrivée : on paierait la collecte
          # d'un rapport qu'on jette.
          ini-values: pcov.directory=${{ github.workspace }}/takussan-api/app, memory_limit=1G
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: takussan-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('takussan-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env || echo "APP_ENV=testing" > .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run Laravel Pint (lint)
        run: ./vendor/bin/pint --test

      - name: Guard — no Spatie\Permission imports (TCK-278)
        # Le package spatie/laravel-permission a été retiré en TCK-278 (cf.
        # Règle 5 : rôle = profil polymorphe). Tout import résiduel signale
        # une régression — l'app/ et tests/ doivent rester propres.
        run: |
          if grep -rn --include='*.php' 'Spatie\\Permission\\' app/ tests/ database/ config/ 2>/dev/null; then
            echo "::error::Spatie\\Permission references found — TCK-278 forbids them."
            exit 1
          fi
          echo "OK — no Spatie\\Permission references."

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7700/health > /dev/null; then
              echo "Meilisearch is up."; exit 0
            fi
            echo "Waiting for Meilisearch ($i)..."; sleep 2
          done
          echo "::error::Meilisearch did not become healthy in time."; exit 1

      # ⚠ L'ÉTAPE « Sync Meilisearch index settings » A ÉTÉ SUPPRIMÉE, et c'est une conséquence
      # directe du préfixe d'index rendu unique par processus de test.
      #
      # Elle exportait `SCOUT_PREFIX: testing_` pour viser exactement les index que la suite
      # allait lire. Ce préfixe est désormais engendré à l'amorçage de PHPUnit
      # (`tests/bootstrap.php` → `Tests\Support\TestSearchIndex`) et n'est donc PAS connaissable
      # depuis un step antérieur : maintenue, cette étape serait redevenue ce qu'elle avait déjà
      # été une fois — une garde qui pousse des réglages dans le vide, sur un index qu'aucun test
      # ne lit. Un step qui ne peut plus faire son travail et reste vert est pire qu'absent.
      #
      # La synchronisation n'est pas perdue : `InteractsWithMeilisearch` appelle
      # `scout:sync-index-settings` une fois par processus, DANS le processus, donc sur le bon
      # préfixe par construction. C'est la seule place où l'accord est structurellement garanti.
      #
      # ─── LE SEUIL DE COUVERTURE EST UN CLIQUET, PAS UN OBJECTIF (TCK-302) ───────────────────
      #
      # MESURE DU 2026-08-16, suite complète (2313 tests, 7136 assertions, 0 échec), PCOV 1.0.12,
      # périmètre `app/` (768 fichiers) tel que le définit le `<source>` de `phpunit.xml` :
      #
      #     Lignes   : 86,16 %  (21 148 / 24 544)   ← c'est CE nombre que `--min` compare
      #     Méthodes : 66,87 %  ( 1 821 /  2 723)
      #     Classes  : 43,81 %  (   301 /    687)
      #
      # Reproduction : `XDEBUG_MODE=coverage php artisan test --coverage`, ou en PCOV
      # `php -d pcov.directory=app vendor/phpunit/phpunit/phpunit --coverage-text=-`.
      # Les trois chiffres du clover et ceux du rapport texte de PHPUnit concordent — vérifié.
      #
      # `--min=86` est le seuil, c'est-à-dire la mesure de LIGNES **en CI** arrondie vers le bas.
      # Un seuil au-dessus de la mesure casse la CI sans rien améliorer ;
      # un seuil en dessous ne garde rien. Ce nombre dit « on ne redescend pas ». Il ne dit
      # **pas** « 85 % suffit », et il ne dit pas non plus que les 66,87 % de méthodes ou les
      # 43,81 % de classes seraient acceptables — ils ne sont simplement pas ce que ce cliquet
      # tient.
      #
      # ⚠ Ce que le seuil ne dit pas non plus : qu'un test assert quoi que ce soit. TCK-285 a
      # trouvé quatre défauts en ÉCRIVANT les tests, aucun en mesurant leur couverture. Une
      # méthode traversée sans assertion compte pour couverte. Le cliquet garde contre
      # l'ÉROSION ; il ne remplace ni la revue ni l'écriture de tests.
      #
      # À quoi sert la marge : un fichier de ~100 lignes ajouté sans test coûte ~0,35 point.
      #
      # ✅ **RESSERRÉ À 86 LE 2026-08-16, comme prévu.** La consigne écrite ici était « si la
      # première exécution en CI confirme 86,x, resserrer à 86 » — elle a rendu **86,3 %**
      # (run 31959304170, PR #176), ce qui confirme la mesure locale de 86,16 % et lève le doute
      # sur l'écart entre le PCOV compilé à la main et celui de `shivammathur/setup-php`.
      #
      # Marge restante : **0,3 point**, soit ~74 lignes non testées avant de rougir. C'est serré
      # DÉLIBÉRÉMENT — un cliquet trop lâche ne cliquette pas, et c'est tout ce qu'on lui demande.
      # Un refactor légitime qui le fait rougir se traite en re-mesurant puis en reposant le
      # seuil sur la nouvelle valeur, avec sa date : **jamais en desserrant pour faire passer**.
      # Desserrer sans re-mesurer, c'est transformer le cliquet en décoration.
      - name: Run tests (avec couverture — cliquet TCK-302)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SCOUT_DRIVER: meilisearch
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: masterKey
          # ⚠ Ne PAS réintroduire `SCOUT_PREFIX` ici : `tests/bootstrap.php` l'écrase de toute
          # façon, et le déclarer laisserait croire qu'il pilote encore quelque chose.
        run: |
          mkdir -p storage/coverage
          # Surcoût de PCOV MESURÉ le 2026-08-16, comparaison appariée sur la suite entière,
          # machine quasi au repos (load 4-8 sur 8 cœurs), Xdebug coupé des deux côtés :
          #     sans couverture           83 s
          #     avec PCOV + clover + HTML 113 s   →  +36 %
          # Sous la limite de 50 % que TCK-302 s'était fixée (AC4). Le chrono reste affiché :
          # une mesure prise une fois est une mesure qui vieillit, et c'est l'historique du job
          # qui dira si ce +36 % dérive.
          debut=$(date +%s)
          # `set +e` : le shell par défaut d'un step est `bash -e`, qui interromprait le step
          # à l'échec de la commande — donc AVANT que la durée ne soit affichée. Or c'est
          # exactement l'exécution qui rougit dont on veut connaître la durée.
          set +e
          php artisan test \
            --coverage \
            --min=86 \
            --coverage-clover=storage/coverage/clover.xml \
            --coverage-html=storage/coverage/html \
            --coverage-php=storage/coverage/cov.php
          code=$?
          set -e
          echo "Durée de la suite AVEC couverture : $(( $(date +%s) - debut )) s"
          exit "$code"

      # DEUX artefacts, et la coupure n'est pas un détail de rangement : les deux formats ne
      # répondent pas à la même question, et ne coûtent pas le même prix.
      #
      #   · `clover.xml` — 1,9 Mo, forme machine, la SÉRIE dont se lit une tendance. Publié à
      #     CHAQUE exécution : une tendance a besoin de tous ses points, y compris ceux des
      #     builds rouges.
      #   · `html/` — **150 Mo décompressés, mesuré le 2026-08-16** (768 fichiers). C'est le
      #     détail À LA LIGNE, ce qu'on ouvre le jour où le cliquet a sauté pour savoir QUOI
      #     est retombé. Le publier à chaque exécution, ce serait payer 150 Mo par build pour
      #     un rapport qu'on ouvre quelques fois par an.
      #
      # D'où `if: failure()` sur le second : il est produit exactement le jour où il sert, et
      # PHPUnit écrit ses rapports même quand des tests rougissent, donc il existe bien à ce
      # moment-là.
      #
      # ⚠ Et c'est précisément pour ces jours-là qu'il faut les DEUX artefacts, pas seulement le
      # journal : `collision` n'affiche son tableau par dossier — et n'évalue `--min` — que si
      # la suite est VERTE (`TestCommand.php:130`, `if ($exitCode === 0 && …)`). Sur une suite
      # rouge, le journal ne dit donc rien de la couverture ; les fichiers, eux, sont là.
      - name: Publier la couverture (clover — la série)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api-clover
          path: takussan-api/storage/coverage/clover.xml
          retention-days: 30
          # `warn` et non `error` : si un step ANTÉRIEUR a échoué (Pint, par exemple), le
          # fichier n'existe pas et un second rouge masquerait le premier. Le garde-fou contre
          # une couverture silencieusement cassée, c'est `--min`, pas ce step.
          if-no-files-found: warn

      - name: Publier la couverture (HTML — seulement quand ça rougit)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api-html
          path: takussan-api/storage/coverage/html
          retention-days: 14
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────────────────
      # La carte d'impact — régénérée sur push vers `dev`, JAMAIS sur une PR.
      #
      # Pourquoi pas sur PR : le fichier serait réécrit par chaque branche et
      # deviendrait un aimant à conflits de merge, pour une donnée que personne ne
      # relit. Sur `dev`, il n'y a qu'un seul écrivain.
      #
      # `[skip ci]` n'est pas une politesse : sans lui, ce push relancerait API CI
      # (le déclencheur couvre `takussan-api/**`, et la carte vit sous
      # `takussan-api/tests/`), qui régénérerait la carte, qui repousserait — une
      # boucle qui ne s'arrête pas toute seule.
      #
      # `dev` n'est pas protégée (vérifié le 2026-08-17 : `gh api
      # repos/thiambara/takussan/branches/dev/protection` → 404). Le jour où elle le
      # devient, ce step échouera au push et devra passer par une PR.
      - name: Régénérer la carte d'impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          php bin/build-impact-map.php storage/coverage/cov.php tests/impact-map.json

          # `git diff` SEUL compare l'arbre de travail à l'INDEX, pour des chemins déjà
          # suivis — un fichier jamais commité (ou redevenu absent du suivi) n'y apparaît
          # jamais comme « changé », même s'il vient d'être créé. On stage donc D'ABORD,
          # puis on compare l'index au dernier commit (`--cached`) : ça couvre la création
          # ET la modification. Sans ce détour, une carte pas encore trackée se ferait dire
          # « inchangée » à chaque exécution — le mécanisme censé la créer ne la créerait
          # jamais, en silence.
          git add tests/impact-map.json
          if git diff --cached --quiet -- tests/impact-map.json; then
            echo "carte inchangée — rien à pousser"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(tests): régénérer la carte d'impact [skip ci]"

          # Une seule tentative de rebase : si un autre push est arrivé entretemps, on
          # se replace dessus. Au-delà, on abandonne SANS faire rougir le job — la
          # carte est un index, sa fraîcheur n'est pas une garde (cf.
          # scripts/check-impact-map.mjs).
          git pull --rebase --quiet origin dev || { echo "⚠ rebase impossible — carte non poussée"; exit 0; }
          git push origin HEAD:dev || echo "⚠ push refusé — carte non poussée"

  # ────────────────────────────────────────────────────────────────────────────
  # Les migrations rejouées sur MySQL 8.0 — le moteur MESURÉ de la production (cf. le bloc
  # « CE JOB A TOURNÉ SUR LE MAUVAIS MOTEUR » plus bas).
  #
  # `CLAUDE.md` documente quatre familles de pièges « qui passent en CI mais cassent en prod » :
  # DEFAULT sur JSON/TEXT, dropUnique sur une colonne portant une FK, nom d'index auto-généré au-delà
  # de 64 caractères, et `enum()`. Le job ci-dessus ne peut en voir AUCUN : il tourne sur SQLite,
  # qui les accepte tous. Et `scripts/deploy.sh:148` lance `php artisan migrate --force` directement
  # sur la base de production — la première machine à exécuter ce DDL en conditions réelles était
  # donc le serveur.
  #
  # Le dépôt a déjà payé ce défaut DEUX fois, et les correctifs sont dans son propre historique :
  # `c473081b` (colonne JSON sans DEFAULT) et `9815694f` (nom d'index sous la limite des 64
  # caractères). Une famille de pièges connue, documentée, rencontrée deux fois, et que rien
  # n'attrapait : la documentation avait remplacé la garde.
  #
  # Ce job ne rejoue PAS la suite de tests — c'est le DDL qu'on éprouve, pas le code. Il tourne en
  # moins d'une minute.
  #
  # ─── CE JOB A TOURNÉ SUR LE MAUVAIS MOTEUR (2026-06-29 → 2026-08-13) ────────────────────────
  #
  # Il tournait sur `mariadb:11.4`, et son commentaire justifiait ce choix par « c'est ce que
  # `apt install mariadb-server` pose sur le serveur » — une phrase déduite de rien. Personne
  # n'avait exécuté cette commande. Mesuré sur le serveur le 2026-08-13 :
  #
  #     $ dpkg -l | grep -Ei 'mysql-server|mariadb-server'
  #     ii  mysql-server  8.0.46-0ubuntu0.24.04.3
  #     $ sudo mysql -e "SELECT VERSION(), @@collation_server, @@character_set_server;"
  #     8.0.46-0ubuntu0.24.04.3 | utf8mb4_0900_ai_ci | utf8mb4
  #
  # Ce n'était donc pas un écart de version — c'était le mauvais MOTEUR. MariaDB 11 et MySQL 8
  # ont divergé pour de bon : collation par défaut, contraintes `CHECK`, colonnes `JSON`
  # (natives chez MySQL, alias de LONGTEXT chez MariaDB), noms d'index générés. Un DDL accepté
  # par MariaDB 11.4 et refusé par MySQL 8 passait ce job et cassait quand même
  # `migrate --force` au déploiement — l'échec exact que ce job existe pour empêcher.
  #
  # Et `utf8mb4_unicode_ci` (ce que posait le compose) ne compare pas les chaînes comme
  # `utf8mb4_0900_ai_ci` (ce que fait la production) : unicité des e-mails, `LIKE` de recherche.
  #
  # ⚠ La production n'ayant JAMAIS été déployée, ce job n'a rien cassé — mais il n'a rien
  # prouvé non plus pendant six semaines, en l'annonçant à chaque exécution.
  #
  # *Un banc d'essai qui reproduit une hypothèse ne prouve rien de la production ; il prouve que
  # l'hypothèse est cohérente avec elle-même.* Et : **ne jamais déduire l'état d'un environnement
  # de la configuration qui le vise** — ici, d'une commande d'installation supposée.
  #
  # `scripts/check-db-engine.mjs` garde désormais l'accord entre ce job, `docker-compose.yml` et
  # la valeur mesurée : trois copies d'une version divergent, une garde ne les laisse pas faire.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  migrations-mysql:
    name: Migrations sur MySQL 8.0 (pièges que SQLite ne voit pas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    services:
      mysql:
        # Le moteur, la version ET la collation de la production, mesurés le 2026-08-13.
        # `docker-compose.yml` porte les mêmes ; `scripts/check-db-engine.mjs` le vérifie.
        image: mysql:8.0
        env:
          MYSQL_DATABASE: takussan_ci
          MYSQL_USER: takussan
          MYSQL_PASSWORD: takussan
          MYSQL_ROOT_PASSWORD: takussan
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptakussan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, mysqli, bcmath, intl, gd, zip
          # TCK-302 — `coverage: none` RESTE ici, délibérément, et ce n'est pas l'oubli que
          # c'était dans l'autre job : ce job-ci n'exécute AUCUN test. Il joue du DDL
          # (`migrate` / `migrate:rollback`). Y installer un pilote de couverture coûterait
          # le temps d'installation pour ne mesurer rien. Le second `coverage: none` du
          # fichier n'est donc pas le même défaut que le premier.
          coverage: none
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Le moteur de CI est-il celui de la production ?
        # Un conteneur de SERVICE n'accepte pas d'arguments de commande — impossible d'y passer
        # `--collation-server` comme le fait `docker-compose.yml`. La collation de ce serveur est
        # donc le DÉFAUT de l'image, et un défaut non vérifié est un défaut qui change sans
        # qu'on le voie : `utf8mb4_general_ci` jusqu'à MySQL 5.7, `utf8mb4_0900_ai_ci` depuis 8.0.
        #
        # On MESURE donc au lieu de prescrire, et on compare à la production (2026-08-13,
        # `sudo mysql -e "SELECT VERSION(), @@collation_server;"` → 8.0.46, utf8mb4_0900_ai_ci).
        # Si l'image dérive, ce job le dit ici plutôt que de laisser le DDL passer sur un moteur
        # qui n'est plus celui qu'on croit éprouver.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ptakussan -N -B \
            -e "SELECT VERSION(), @@collation_server, @@character_set_server;" > /tmp/moteur.tsv
          VERSION=$(cut -f1 /tmp/moteur.tsv)
          COLLATION=$(cut -f2 /tmp/moteur.tsv)
          CHARSET=$(cut -f3 /tmp/moteur.tsv)
          echo "CI       : ${VERSION} · ${COLLATION} · ${CHARSET}"
          echo "Attendu  : 8.0.* · utf8mb4_0900_ai_ci · utf8mb4  (production, mesurée le 2026-08-13)"
          ecart=0
          case "${VERSION}" in 8.0.*) ;; *) echo "::error::Version ${VERSION} — la production est en 8.0.x."; ecart=1 ;; esac
          [ "${COLLATION}" = "utf8mb4_0900_ai_ci" ] || { echo "::error::Collation ${COLLATION} ≠ utf8mb4_0900_ai_ci (production)."; ecart=1; }
          [ "${CHARSET}" = "utf8mb4" ] || { echo "::error::Jeu de caractères ${CHARSET} ≠ utf8mb4 (production)."; ecart=1; }
          exit "${ecart}"

      - name: Migrate (aller)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: php artisan migrate --force --no-interaction

      - name: Rollback des migrations AU-DESSUS de la borne TCK-278, puis re-migration (couverture partielle)
        # Le `down()` d'une migration est le code le moins exécuté du dépôt — **la suite de tests
        # n'en exécute aucun** — et c'est le seul dont on ait besoin le jour où un déploiement
        # tourne mal. C'est là que « dropIndex sur une colonne portant une FK » se déclare, et
        # nulle part ailleurs : ce job a trouvé le cas de `2026_06_18_000001` à sa PREMIÈRE
        # exécution, sur les trois tables à la fois.
        #
        # On ne peut pas faire `migrate:refresh` : `2026_05_18_120000_drop_spatie_permission_tables`
        # est **délibérément irréversible** (cutover TCK-278, son `down()` lève une RuntimeException
        # assumée). On roule donc en arrière jusqu'à la marche juste au-dessus d'elle — et on
        # CALCULE ce nombre plutôt que de l'écrire en dur, pour qu'il suive les migrations à venir
        # sans que personne ait à y penser.
        #
        # ⚠ LA COUVERTURE RÉELLE, puisque le nom de ce job et `CLAUDE.md` disent « aller et
        # retour » : **3 `down()` sur 124** aujourd'hui. La borne laisse au-dessus d'elle les
        # seules migrations postérieures au cutover TCK-278. Les 121 autres — dont TOUTES les
        # créations de tables, celles qu'il faudrait précisément pour dérouler une release
        # ancienne — ne sont exécutées nulle part, ni ici ni dans la suite de tests.
        #
        # Le chiffre est affiché à chaque exécution (`Migrations réversibles au-dessus de …`) :
        # il grandit d'une unité par migration ajoutée. Ne pas lire ce job comme « les down()
        # sont couverts » — il couvre les down() RÉCENTS, ce qui est déjà ce dont on a besoin
        # le jour où un déploiement tourne mal, mais pas davantage.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: |
          BORNE=2026_05_18_120000_drop_spatie_permission_tables
          # On compte des MIGRATIONS, pas des entrées de répertoire. `ls database/migrations`
          # listait tout : un `README.md`, un sous-dossier `archive/`, un `.sql` égaré — dès lors
          # qu'il trie après la borne — ajoutait 1 à STEP. `migrate:rollback` descendait alors
          # d'un cran SOUS la borne, jusqu'au cutover TCK-278 dont le `down()` lève
          # délibérément, et le job échouait en pointant la migration de cutover au lieu du
          # mauvais compte. Le glob `*.php` ne peut pas se tromper de la même façon.
          STEP=$(ls database/migrations/*.php | xargs -n1 basename | sed 's/\.php$//' | sort | awk -v b="$BORNE" '$0 > b' | wc -l | tr -d ' ')
          echo "Migrations réversibles au-dessus de $BORNE : $STEP"
          if [ "$STEP" -gt 0 ]; then
            php artisan migrate:rollback --step="$STEP" --force --no-interaction
            php artisan migrate --force --no-interaction
          else
            echo "::warning::Aucune migration au-dessus de la borne — aucun down() n'a été éprouvé."
          fi
