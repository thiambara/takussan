name: API CI

on:
  pull_request:
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    # TCK-280 — search runs on Meilisearch on every environment, CI included.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.16
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: takussan-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('takussan-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env || echo "APP_ENV=testing" > .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run Laravel Pint (lint)
        run: ./vendor/bin/pint --test

      - name: Guard — no Spatie\Permission imports (TCK-278)
        # Le package spatie/laravel-permission a été retiré en TCK-278 (cf.
        # Règle 5 : rôle = profil polymorphe). Tout import résiduel signale
        # une régression — l'app/ et tests/ doivent rester propres.
        run: |
          if grep -rn --include='*.php' 'Spatie\\Permission\\' app/ tests/ database/ config/ 2>/dev/null; then
            echo "::error::Spatie\\Permission references found — TCK-278 forbids them."
            exit 1
          fi
          echo "OK — no Spatie\\Permission references."

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7700/health > /dev/null; then
              echo "Meilisearch is up."; exit 0
            fi
            echo "Waiting for Meilisearch ($i)..."; sleep 2
          done
          echo "::error::Meilisearch did not become healthy in time."; exit 1

      - name: Sync Meilisearch index settings
        # SCOUT_PREFIX doit valoir CE QUE LA SUITE UTILISE. `phpunit.xml` force `testing_`, donc
        # `searchableAs()` rend `testing_properties` en test ; sans ce préfixe ici, cette étape
        # configurait `properties` — un index qu'aucun test ne lit. La garde poussait des
        # réglages dans le vide, et le premier test filtrant écrit sans le trait d'amorçage
        # échouerait sur « Attribute `status` is not filterable », en accusant le code.
        env:
          SCOUT_DRIVER: meilisearch
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: masterKey
          SCOUT_PREFIX: testing_
        run: php artisan scout:sync-index-settings

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SCOUT_DRIVER: meilisearch
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: masterKey
          # Doit rester ALIGNÉ sur `phpunit.xml` et sur l'étape de synchronisation ci-dessus.
          SCOUT_PREFIX: testing_
        run: php artisan test

  # ────────────────────────────────────────────────────────────────────────────
  # Les migrations rejouées sur MySQL 8.0 — le moteur MESURÉ de la production (cf. le bloc
  # « CE JOB A TOURNÉ SUR LE MAUVAIS MOTEUR » plus bas).
  #
  # `CLAUDE.md` documente quatre familles de pièges « qui passent en CI mais cassent en prod » :
  # DEFAULT sur JSON/TEXT, dropUnique sur une colonne portant une FK, nom d'index auto-généré au-delà
  # de 64 caractères, et `enum()`. Le job ci-dessus ne peut en voir AUCUN : il tourne sur SQLite,
  # qui les accepte tous. Et `scripts/deploy.sh:148` lance `php artisan migrate --force` directement
  # sur la base de production — la première machine à exécuter ce DDL en conditions réelles était
  # donc le serveur.
  #
  # Le dépôt a déjà payé ce défaut DEUX fois, et les correctifs sont dans son propre historique :
  # `c473081b` (colonne JSON sans DEFAULT) et `9815694f` (nom d'index sous la limite des 64
  # caractères). Une famille de pièges connue, documentée, rencontrée deux fois, et que rien
  # n'attrapait : la documentation avait remplacé la garde.
  #
  # Ce job ne rejoue PAS la suite de tests — c'est le DDL qu'on éprouve, pas le code. Il tourne en
  # moins d'une minute.
  #
  # ─── CE JOB A TOURNÉ SUR LE MAUVAIS MOTEUR (2026-06-29 → 2026-08-13) ────────────────────────
  #
  # Il tournait sur `mariadb:11.4`, et son commentaire justifiait ce choix par « c'est ce que
  # `apt install mariadb-server` pose sur le serveur » — une phrase déduite de rien. Personne
  # n'avait exécuté cette commande. Mesuré sur le serveur le 2026-08-13 :
  #
  #     $ dpkg -l | grep -Ei 'mysql-server|mariadb-server'
  #     ii  mysql-server  8.0.46-0ubuntu0.24.04.3
  #     $ sudo mysql -e "SELECT VERSION(), @@collation_server, @@character_set_server;"
  #     8.0.46-0ubuntu0.24.04.3 | utf8mb4_0900_ai_ci | utf8mb4
  #
  # Ce n'était donc pas un écart de version — c'était le mauvais MOTEUR. MariaDB 11 et MySQL 8
  # ont divergé pour de bon : collation par défaut, contraintes `CHECK`, colonnes `JSON`
  # (natives chez MySQL, alias de LONGTEXT chez MariaDB), noms d'index générés. Un DDL accepté
  # par MariaDB 11.4 et refusé par MySQL 8 passait ce job et cassait quand même
  # `migrate --force` au déploiement — l'échec exact que ce job existe pour empêcher.
  #
  # Et `utf8mb4_unicode_ci` (ce que posait le compose) ne compare pas les chaînes comme
  # `utf8mb4_0900_ai_ci` (ce que fait la production) : unicité des e-mails, `LIKE` de recherche.
  #
  # ⚠ La production n'ayant JAMAIS été déployée, ce job n'a rien cassé — mais il n'a rien
  # prouvé non plus pendant six semaines, en l'annonçant à chaque exécution.
  #
  # *Un banc d'essai qui reproduit une hypothèse ne prouve rien de la production ; il prouve que
  # l'hypothèse est cohérente avec elle-même.* Et : **ne jamais déduire l'état d'un environnement
  # de la configuration qui le vise** — ici, d'une commande d'installation supposée.
  #
  # `scripts/check-db-engine.mjs` garde désormais l'accord entre ce job, `docker-compose.yml` et
  # la valeur mesurée : trois copies d'une version divergent, une garde ne les laisse pas faire.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  migrations-mysql:
    name: Migrations sur MySQL 8.0 (pièges que SQLite ne voit pas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    services:
      mysql:
        # Le moteur, la version ET la collation de la production, mesurés le 2026-08-13.
        # `docker-compose.yml` porte les mêmes ; `scripts/check-db-engine.mjs` le vérifie.
        image: mysql:8.0
        env:
          MYSQL_DATABASE: takussan_ci
          MYSQL_USER: takussan
          MYSQL_PASSWORD: takussan
          MYSQL_ROOT_PASSWORD: takussan
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptakussan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, mysqli, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Le moteur de CI est-il celui de la production ?
        # Un conteneur de SERVICE n'accepte pas d'arguments de commande — impossible d'y passer
        # `--collation-server` comme le fait `docker-compose.yml`. La collation de ce serveur est
        # donc le DÉFAUT de l'image, et un défaut non vérifié est un défaut qui change sans
        # qu'on le voie : `utf8mb4_general_ci` jusqu'à MySQL 5.7, `utf8mb4_0900_ai_ci` depuis 8.0.
        #
        # On MESURE donc au lieu de prescrire, et on compare à la production (2026-08-13,
        # `sudo mysql -e "SELECT VERSION(), @@collation_server;"` → 8.0.46, utf8mb4_0900_ai_ci).
        # Si l'image dérive, ce job le dit ici plutôt que de laisser le DDL passer sur un moteur
        # qui n'est plus celui qu'on croit éprouver.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ptakussan -N -B \
            -e "SELECT VERSION(), @@collation_server, @@character_set_server;" > /tmp/moteur.tsv
          VERSION=$(cut -f1 /tmp/moteur.tsv)
          COLLATION=$(cut -f2 /tmp/moteur.tsv)
          CHARSET=$(cut -f3 /tmp/moteur.tsv)
          echo "CI       : ${VERSION} · ${COLLATION} · ${CHARSET}"
          echo "Attendu  : 8.0.* · utf8mb4_0900_ai_ci · utf8mb4  (production, mesurée le 2026-08-13)"
          ecart=0
          case "${VERSION}" in 8.0.*) ;; *) echo "::error::Version ${VERSION} — la production est en 8.0.x."; ecart=1 ;; esac
          [ "${COLLATION}" = "utf8mb4_0900_ai_ci" ] || { echo "::error::Collation ${COLLATION} ≠ utf8mb4_0900_ai_ci (production)."; ecart=1; }
          [ "${CHARSET}" = "utf8mb4" ] || { echo "::error::Jeu de caractères ${CHARSET} ≠ utf8mb4 (production)."; ecart=1; }
          exit "${ecart}"

      - name: Migrate (aller)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: php artisan migrate --force --no-interaction

      - name: Rollback des migrations AU-DESSUS de la borne TCK-278, puis re-migration (couverture partielle)
        # Le `down()` d'une migration est le code le moins exécuté du dépôt — **la suite de tests
        # n'en exécute aucun** — et c'est le seul dont on ait besoin le jour où un déploiement
        # tourne mal. C'est là que « dropIndex sur une colonne portant une FK » se déclare, et
        # nulle part ailleurs : ce job a trouvé le cas de `2026_06_18_000001` à sa PREMIÈRE
        # exécution, sur les trois tables à la fois.
        #
        # On ne peut pas faire `migrate:refresh` : `2026_05_18_120000_drop_spatie_permission_tables`
        # est **délibérément irréversible** (cutover TCK-278, son `down()` lève une RuntimeException
        # assumée). On roule donc en arrière jusqu'à la marche juste au-dessus d'elle — et on
        # CALCULE ce nombre plutôt que de l'écrire en dur, pour qu'il suive les migrations à venir
        # sans que personne ait à y penser.
        #
        # ⚠ LA COUVERTURE RÉELLE, puisque le nom de ce job et `CLAUDE.md` disent « aller et
        # retour » : **3 `down()` sur 124** aujourd'hui. La borne laisse au-dessus d'elle les
        # seules migrations postérieures au cutover TCK-278. Les 121 autres — dont TOUTES les
        # créations de tables, celles qu'il faudrait précisément pour dérouler une release
        # ancienne — ne sont exécutées nulle part, ni ici ni dans la suite de tests.
        #
        # Le chiffre est affiché à chaque exécution (`Migrations réversibles au-dessus de …`) :
        # il grandit d'une unité par migration ajoutée. Ne pas lire ce job comme « les down()
        # sont couverts » — il couvre les down() RÉCENTS, ce qui est déjà ce dont on a besoin
        # le jour où un déploiement tourne mal, mais pas davantage.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: |
          BORNE=2026_05_18_120000_drop_spatie_permission_tables
          # On compte des MIGRATIONS, pas des entrées de répertoire. `ls database/migrations`
          # listait tout : un `README.md`, un sous-dossier `archive/`, un `.sql` égaré — dès lors
          # qu'il trie après la borne — ajoutait 1 à STEP. `migrate:rollback` descendait alors
          # d'un cran SOUS la borne, jusqu'au cutover TCK-278 dont le `down()` lève
          # délibérément, et le job échouait en pointant la migration de cutover au lieu du
          # mauvais compte. Le glob `*.php` ne peut pas se tromper de la même façon.
          STEP=$(ls database/migrations/*.php | xargs -n1 basename | sed 's/\.php$//' | sort | awk -v b="$BORNE" '$0 > b' | wc -l | tr -d ' ')
          echo "Migrations réversibles au-dessus de $BORNE : $STEP"
          if [ "$STEP" -gt 0 ]; then
            php artisan migrate:rollback --step="$STEP" --force --no-interaction
            php artisan migrate --force --no-interaction
          else
            echo "::warning::Aucune migration au-dessus de la borne — aucun down() n'a été éprouvé."
          fi
