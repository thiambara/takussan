name: API CI

on:
  pull_request:
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - 'takussan-api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  lint-and-test:
    # TCK-320 — `contents: write` pour le step « Régénérer la carte d'impact » : il pousse un
    # commit sur `dev` après coup. `dev` n'est pas protégée (vérifié le 2026-08-17 : `gh api
    # repos/thiambara/takussan/branches/dev/protection` → 404), le push direct est donc possible.
    # Déclarer `permissions` sur le job REMPLACE les scopes par défaut du token — le reste du job
    # (checkout, upload-artifact) ne lit et n'écrit rien d'autre que `contents`, donc rien n'est
    # perdu qu'on utilisait déjà.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    # TCK-280 — search runs on Meilisearch on every environment, CI included.
    # ADR-0020 — et depuis, la BASE aussi : la suite tourne sur le moteur de production,
    # plus sur SQLite. La divergence « tests sur SQLite, production sur autre chose »
    # préexistait à la migration ; c'est elle que ce service ferme.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.16
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

      postgres:
        # `pgvector/pgvector:pg17`, PAS `postgres:17` — la même image qu'en développement.
        # L'extension `vector` doit être disponible partout, y compris ici : c'est le seul
        # endroit où une divergence d'image se verrait avant la production.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: takussan
          POSTGRES_USER: takussan
          POSTGRES_PASSWORD: takussan
          # `--locale=C` comme le compose : collation DÉTERMINISTE. Une base de CI créée
          # dans une autre collation n'éprouve pas les comparaisons de chaînes de la
          # production — c'est exactement ce que l'ancienne garde de collation gardait
          # pour MySQL, transposé.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports:
          # 5433 côté runner comme côté poste, pour que `phpunit.xml` n'ait pas deux
          # valeurs selon l'endroit où il s'exécute.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U takussan -d takussan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, intl, gd, zip
          # TCK-302 — `coverage: none` vivait ici, et le bloc `<source>` de `phpunit.xml`
          # n'alimentait donc AUCUN rapport : ni seuil, ni tendance, ni garde-fou contre
          # l'érosion. Une couverture qu'on ne mesure pas ne baisse jamais — elle baisse
          # sans qu'on le voie, ce qui n'est pas la même chose.
          #
          # PCOV et pas Xdebug : c'est le pilote de couverture à faible surcoût (Xdebug
          # instrumente chaque opcode, PCOV se contente des lignes exécutables). Le job
          # ne fait pas de pas-à-pas, il compte des lignes.
          coverage: pcov
          # `pcov.directory` restreint la COLLECTE à `app/`. Sans lui, PCOV instrumente
          # aussi `vendor/` (~100 paquets) pour un résultat que `<source>` de
          # `phpunit.xml` filtre de toute façon à l'arrivée : on paierait la collecte
          # d'un rapport qu'on jette.
          ini-values: pcov.directory=${{ github.workspace }}/takussan-api/app, memory_limit=1G
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: takussan-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('takussan-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        # ─── POURQUOI `--prefer-dist` A DISPARU D'ICI ────────────────────────────────────────
        #
        # Mesuré le 2026-08-17 : API CI est tombée TROIS fois de suite sur `4bd5aa71`, jamais
        # sur une ligne du dépôt. `codeload.github.com` rendait **429** sur des dizaines de
        # paquets — `intervention/image`, `symfony/polyfill-mbstring`, `psr/container`,
        # `sebastian/exporter`, `phpunit/php-invoker`, `theseer/tokenizer`… La première fois,
        # le job est mort en **26 secondes**, avant le premier test, sur un `composer.lock`
        # parfaitement valide.
        #
        # Composer nommait lui-même la sortie, et on ne l'écoutait pas :
        #
        #     Failed to download intervention/image from dist: … (HTTP/2 429 )
        #     Source fallback is disabled. Not trying alternative sources.
        #
        # `--prefer-dist` est ce qui désactive ce repli. Sans lui, Composer prend toujours
        # l'archive en premier — c'est son défaut pour une version stable — mais un échec de
        # téléchargement retombe sur `git clone` au lieu d'abandonner le job. Vérifié que le
        # repli est viable depuis un poste : `git ls-remote https://github.com/symfony/polyfill-mbstring.git`
        # rend `d3d318ba…`, la référence exacte que `codeload` refusait au même instant.
        # Le protocole git n'est pas soumis à la même limite que l'hôte d'archives.
        #
        # Ce que la relance ne pouvait pas régler, et c'est mesuré : `actions/cache` ne stocke
        # son cache que si le job RÉUSSIT (`post-if: success()`). Un job tombé à l'installation
        # repart à froid à chaque tentative. Trois tentatives, trois fois le même mur.
        #
        # ─── ET POURQUOI `COMPOSER_AUTH` NE SUFFIT PAS, CONTRAIREMENT À CE QU'ON CROIT ───────
        #
        # Le jeton est utile — il authentifie les appels de MÉTADONNÉES à `api.github.com`, qui
        # ont leur propre limite — mais il ne touche PAS le chemin qui échoue ici, et il ne
        # faut pas le croire tel. Lu dans `AuthHelper::addAuthenticationHeader` du phar
        # installé (Composer 2.8) plutôt que supposé :
        #
        #     } elseif ('github.com' === $origin && 'x-oauth-basic' === $auth['password']) {
        #         if (Preg::isMatch('{^https?://api\.github\.com/}', $url)) {
        #             $headers[] = 'Authorization: token '.$auth['username'];
        #
        # L'en-tête n'est ajouté QUE pour les URL `api.github.com`. Un téléchargement
        # `codeload.github.com` part donc anonyme, jeton ou pas.
        #
        # Accessoirement, `codeload` est difficile sur le schéma : mesuré deux fois de suite,
        # `Authorization: token <tok>` rend 200, tandis que `Bearer` et l'auth basic rendent
        # **429**. Une « amélioration » qui passerait le jeton en Bearer aggraverait la panne.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: composer install --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env || echo "APP_ENV=testing" > .env
          php artisan key:generate --force

      - name: Run Laravel Pint (lint)
        run: ./vendor/bin/pint --test

      - name: Guard — no Spatie\Permission imports (TCK-278)
        # Le package spatie/laravel-permission a été retiré en TCK-278 (cf.
        # Règle 5 : rôle = profil polymorphe). Tout import résiduel signale
        # une régression — l'app/ et tests/ doivent rester propres.
        run: |
          if grep -rn --include='*.php' 'Spatie\\Permission\\' app/ tests/ database/ config/ 2>/dev/null; then
            echo "::error::Spatie\\Permission references found — TCK-278 forbids them."
            exit 1
          fi
          echo "OK — no Spatie\\Permission references."

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7700/health > /dev/null; then
              echo "Meilisearch is up."; exit 0
            fi
            echo "Waiting for Meilisearch ($i)..."; sleep 2
          done
          echo "::error::Meilisearch did not become healthy in time."; exit 1

      # ⚠ L'ÉTAPE « Sync Meilisearch index settings » A ÉTÉ SUPPRIMÉE, et c'est une conséquence
      # directe du préfixe d'index rendu unique par processus de test.
      #
      # Elle exportait `SCOUT_PREFIX: testing_` pour viser exactement les index que la suite
      # allait lire. Ce préfixe est désormais engendré à l'amorçage de PHPUnit
      # (`tests/bootstrap.php` → `Tests\Support\TestSearchIndex`) et n'est donc PAS connaissable
      # depuis un step antérieur : maintenue, cette étape serait redevenue ce qu'elle avait déjà
      # été une fois — une garde qui pousse des réglages dans le vide, sur un index qu'aucun test
      # ne lit. Un step qui ne peut plus faire son travail et reste vert est pire qu'absent.
      #
      # La synchronisation n'est pas perdue : `InteractsWithMeilisearch` appelle
      # `scout:sync-index-settings` une fois par processus, DANS le processus, donc sur le bon
      # préfixe par construction. C'est la seule place où l'accord est structurellement garanti.
      #
      # ─── LE SEUIL DE COUVERTURE EST UN CLIQUET, PAS UN OBJECTIF (TCK-302) ───────────────────
      #
      # MESURE DU 2026-08-16, suite complète (2313 tests, 7136 assertions, 0 échec), PCOV 1.0.12,
      # périmètre `app/` (768 fichiers) tel que le définit le `<source>` de `phpunit.xml` :
      #
      #     Lignes   : 86,16 %  (21 148 / 24 544)   ← c'est CE nombre que `--min` compare
      #     Méthodes : 66,87 %  ( 1 821 /  2 723)
      #     Classes  : 43,81 %  (   301 /    687)
      #
      # Reproduction : `XDEBUG_MODE=coverage php artisan test --coverage`, ou en PCOV
      # `php -d pcov.directory=app vendor/phpunit/phpunit/phpunit --coverage-text=-`.
      # Les trois chiffres du clover et ceux du rapport texte de PHPUnit concordent — vérifié.
      #
      # `--min=86` est le seuil, c'est-à-dire la mesure de LIGNES **en CI** arrondie vers le bas.
      # Un seuil au-dessus de la mesure casse la CI sans rien améliorer ;
      # un seuil en dessous ne garde rien. Ce nombre dit « on ne redescend pas ». Il ne dit
      # **pas** « 85 % suffit », et il ne dit pas non plus que les 66,87 % de méthodes ou les
      # 43,81 % de classes seraient acceptables — ils ne sont simplement pas ce que ce cliquet
      # tient.
      #
      # ⚠ Ce que le seuil ne dit pas non plus : qu'un test assert quoi que ce soit. TCK-285 a
      # trouvé quatre défauts en ÉCRIVANT les tests, aucun en mesurant leur couverture. Une
      # méthode traversée sans assertion compte pour couverte. Le cliquet garde contre
      # l'ÉROSION ; il ne remplace ni la revue ni l'écriture de tests.
      #
      # À quoi sert la marge : un fichier de ~100 lignes ajouté sans test coûte ~0,35 point.
      #
      # ✅ **RESSERRÉ À 86 LE 2026-08-16, comme prévu.** La consigne écrite ici était « si la
      # première exécution en CI confirme 86,x, resserrer à 86 » — elle a rendu **86,3 %**
      # (run 31959304170, PR #176), ce qui confirme la mesure locale de 86,16 % et lève le doute
      # sur l'écart entre le PCOV compilé à la main et celui de `shivammathur/setup-php`.
      #
      # Marge restante : **0,3 point**, soit ~74 lignes non testées avant de rougir. C'est serré
      # DÉLIBÉRÉMENT — un cliquet trop lâche ne cliquette pas, et c'est tout ce qu'on lui demande.
      # Un refactor légitime qui le fait rougir se traite en re-mesurant puis en reposant le
      # seuil sur la nouvelle valeur, avec sa date : **jamais en desserrant pour faire passer**.
      # Desserrer sans re-mesurer, c'est transformer le cliquet en décoration.
      # ⚠ LE CLIQUET N'EST PLUS ÉVALUÉ PAR `--min` DE COLLISION, ET C'EST TOUT L'OBJET DE
      # TCK-331. Il l'est par `bin/coverage-gate.php`, qui lit le CLOVER. Raison mesurée :
      # `--min` n'est évalué que si Collision a pu relire son propre rapport
      # `--coverage-php`, option qu'il passe à PHPUnit dans le dos de l'appelant. Le jour
      # où le workflow l'a passée une seconde fois, PHPUnit l'a écartée, le rapport ne
      # s'est jamais matérialisé, `--min` n'a rien eu à évaluer, et le step est sorti en
      # **1 sans imprimer un chiffre** — sur une suite verte à 86,33 %.
      - name: Run tests (avec couverture — cliquet TCK-302)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
          # ⚠ Ne PAS déclarer `DB_DATABASE` ici — il valait `:memory:`, et cette valeur
          # donnait à chaque processus sa propre base SANS que personne ait eu à le
          # décider. Sur PostgreSQL, `tests/bootstrap.php` engendre le nom par processus
          # (`Tests\Support\TestDatabase`) ; un littéral ici serait écrasé, et laisserait
          # croire qu'il pilote encore quelque chose. Même raison que `SCOUT_PREFIX`.
          SCOUT_DRIVER: meilisearch
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: masterKey
          # ⚠ Ne PAS réintroduire `SCOUT_PREFIX` ici : `tests/bootstrap.php` l'écrase de toute
          # façon, et le déclarer laisserait croire qu'il pilote encore quelque chose.
        run: |
          mkdir -p storage/coverage
          # Surcoût de PCOV MESURÉ le 2026-08-16, comparaison appariée sur la suite entière,
          # machine quasi au repos (load 4-8 sur 8 cœurs), Xdebug coupé des deux côtés :
          #     sans couverture           83 s
          #     avec PCOV + clover + HTML 113 s   →  +36 %
          # Sous la limite de 50 % que TCK-302 s'était fixée (AC4). Le chrono reste affiché :
          # une mesure prise une fois est une mesure qui vieillit, et c'est l'historique du job
          # qui dira si ce +36 % dérive.
          #
          # ─── POURQUOI PHPUNIT DIRECTEMENT, ET PAS `artisan test --coverage` (TCK-331) ────
          #
          # Il faut TROIS sorties de couverture de la MÊME exécution : le clover (le cliquet
          # et la série d'artefacts), le HTML (le détail à la ligne, les jours rouges) et
          # `cov.php` (la carte d'impact, qui a besoin de l'attribution test → lignes que le
          # clover ne porte pas). `artisan test --coverage` ne peut pas les rendre toutes les
          # trois : il consomme lui-même `--coverage-php`, et une seconde occurrence en ligne
          # de commande est ÉCARTÉE par PHPUnit.
          #
          # Prouvé PAR ABLATION le 2026-08-20, même sous-ensemble, une seule variable, en
          # local (PHP 8.4.6 + Xdebug 3.4.2) :
          #
          #   php artisan test --coverage --min=0 --filter=… --coverage-clover=…
          #     → « Total: 0.8 % », sortie 0
          #   … la même, + --coverage-php=…
          #     → « WARN  Option --coverage-php cannot be used more than once »,
          #       AUCUNE ligne « Total: », sortie 1 — avec --min=0.
          #
          # Ce n'était PAS la mémoire (`cov.php` était écrit en entier, 104 Mo sur la suite
          # complète), PAS un seuil (86,33 % mesuré sur le clover de l'exécution ROUGE), et
          # PAS un effet de taille de suite : l'option n'avait jamais tourné avec succès.
          #
          # ⚠ SECOND DÉFAUT, MESURÉ AU PASSAGE ET QUI À LUI SEUL JUSTIFIE LE CHANGEMENT.
          # `artisan test` appelle `ignoreValidationErrors()` : la première option que
          # Symfony ne connaît pas INTERROMPT l'analyse, et toutes les suivantes sont
          # perdues SILENCIEUSEMENT. Mesuré :
          #
          #   php artisan test --testsuite=Unit --coverage --min=0 --coverage-clover=…
          #     → suite verte, clover écrit, et AUCUNE table de couverture : `--coverage`
          #       n'a jamais été vu, parce qu'il suivait `--testsuite=Unit`.
          #
          # Le cliquet dépendait donc de l'ORDRE DES ARGUMENTS. Personne ne l'avait écrit
          # nulle part, et rien ne l'aurait signalé. PHPUnit, lui, refuse une option qu'il
          # ne connaît pas.
          #
          # ─── `--coverage-php` N'EST PRODUIT QUE LÀ OÙ IL EST CONSOMMÉ ───────────────────
          #
          # Il a exactement UN consommateur — `bin/build-impact-map.php`, au step
          # « Régénérer la carte d'impact », conditionné à `push` + `refs/heads/dev`. Sur
          # une pull request, ce fichier d'environ 100 Mo serait écrit pour personne.
          COV_PHP=()
          if [ "${{ github.event_name }}" = 'push' ] && [ "${{ github.ref }}" = 'refs/heads/dev' ]; then
            COV_PHP=(--coverage-php=storage/coverage/cov.php)
            echo "carte d'impact : cov.php sera produit (push vers dev)."
          else
            echo "carte d'impact : cov.php n'est PAS produit (ce n'est pas un push vers dev)."
          fi

          debut=$(date +%s)
          # `set +e` : le shell par défaut d'un step est `bash -e`, qui interromprait le step
          # à l'échec de la commande — donc AVANT que la durée ne soit affichée. Or c'est
          # exactement l'exécution qui rougit dont on veut connaître la durée.
          #
          # `set -o pipefail` : le journal est dupliqué dans un fichier pour être RELU juste
          # après (les avertissements de PHPUnit), et sans pipefail `$?` rendrait le code de
          # `tee`, c'est-à-dire 0 quoi qu'il arrive. C'est exactement le mécanisme qui a rendu
          # le `WARN` invisible pendant deux exécutions : un `| tail` rend le code de `tail`.
          set +e
          set -o pipefail
          php vendor/phpunit/phpunit/phpunit \
            "${COV_PHP[@]}" \
            --coverage-clover=storage/coverage/clover.xml \
            --coverage-html=storage/coverage/html \
            2>&1 | tee storage/coverage/phpunit.log
          code=$?
          set -e
          echo "Durée de la suite AVEC couverture : $(( $(date +%s) - debut )) s"

          # Un avertissement du lanceur PHPUnit — option inconnue, option en double, fichier
          # de configuration ignoré — ne se perd plus dans le défilement : il est REMONTÉ en
          # annotation, là où on le lit. PHPUnit sort déjà en 1 dans ce cas ; l'annotation
          # dit POURQUOI, ce qui est précisément ce qui manquait.
          if grep -q 'PHPUnit test runner warning' storage/coverage/phpunit.log; then
            echo "::error::PHPUnit a émis des avertissements de lanceur — voir le journal ci-dessus."
            sed -n '/PHPUnit test runner warning/,/^$/p' storage/coverage/phpunit.log
          fi

          if [ "$code" -ne 0 ]; then
            echo "::error::La suite est sortie en $code — le cliquet n'est PAS évalué. Une couverture mesurée sur une suite rouge ne dit rien."
            exit "$code"
          fi

          # ⚠ LE CLIQUET, ET LE SEUL ENDROIT OÙ IL VIT DÉSORMAIS.
          #
          # Il rend LE MÊME NOMBRE que la table de Collision, à la décimale — vérifié par
          # mesure APPARIÉE le 2026-08-20, sur le clover d'une seule et même exécution
          # (`--testsuite=Unit`, 315 tests) :
          #     Collision      → « Total: 7.9 % »
          #     coverage-gate  → « Total: 7.9 % (1975 / 24966 lignes exécutables) »
          #
          # Et il garde ce que `--min` ne gardait pas : un rapport qui n'a mesuré AUCUNE
          # ligne exécutable est un ÉCHEC, jamais un 100 %. Le jour où PCOV disparaît du
          # runner, ce step rougit au lieu de laisser passer en silence.
          php bin/coverage-gate.php storage/coverage/clover.xml --min=86

      # DEUX artefacts, et la coupure n'est pas un détail de rangement : les deux formats ne
      # répondent pas à la même question, et ne coûtent pas le même prix.
      #
      #   · `clover.xml` — 1,9 Mo, forme machine, la SÉRIE dont se lit une tendance. Publié à
      #     CHAQUE exécution : une tendance a besoin de tous ses points, y compris ceux des
      #     builds rouges.
      #   · `html/` — **150 Mo décompressés, mesuré le 2026-08-16** (768 fichiers). C'est le
      #     détail À LA LIGNE, ce qu'on ouvre le jour où le cliquet a sauté pour savoir QUOI
      #     est retombé. Le publier à chaque exécution, ce serait payer 150 Mo par build pour
      #     un rapport qu'on ouvre quelques fois par an.
      #
      # D'où `if: failure()` sur le second : il est produit exactement le jour où il sert, et
      # PHPUnit écrit ses rapports même quand des tests rougissent, donc il existe bien à ce
      # moment-là.
      #
      # ⚠ Et c'est précisément pour ces jours-là qu'il faut les DEUX artefacts, pas seulement le
      # journal : `collision` n'affiche son tableau par dossier — et n'évalue `--min` — que si
      # la suite est VERTE (`TestCommand.php:130`, `if ($exitCode === 0 && …)`). Sur une suite
      # rouge, le journal ne dit donc rien de la couverture ; les fichiers, eux, sont là.
      - name: Publier la couverture (clover — la série)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api-clover
          path: takussan-api/storage/coverage/clover.xml
          retention-days: 30
          # `warn` et non `error` : si un step ANTÉRIEUR a échoué (Pint, par exemple), le
          # fichier n'existe pas et un second rouge masquerait le premier. Le garde-fou contre
          # une couverture silencieusement cassée, c'est `--min`, pas ce step.
          if-no-files-found: warn

      - name: Publier la couverture (HTML — seulement quand ça rougit)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api-html
          path: takussan-api/storage/coverage/html
          retention-days: 14
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────────────────
      # La carte d'impact — régénérée sur push vers `dev`, JAMAIS sur une PR.
      #
      # Pourquoi pas sur PR : le fichier serait réécrit par chaque branche et
      # deviendrait un aimant à conflits de merge, pour une donnée que personne ne
      # relit. Sur `dev`, il n'y a qu'un seul écrivain.
      #
      # `[skip ci]` n'est pas une politesse : sans lui, ce push relancerait API CI
      # (le déclencheur couvre `takussan-api/**`, et la carte vit sous
      # `takussan-api/tests/`), qui régénérerait la carte, qui repousserait — une
      # boucle qui ne s'arrête pas toute seule.
      #
      # `dev` n'est pas protégée (vérifié le 2026-08-17 : `gh api
      # repos/thiambara/takussan/branches/dev/protection` → 404). Le jour où elle le
      # devient, ce step échouera au push et devra passer par une PR.
      # Node n'est PAS installé par ce job — c'est un job PHP. `ubuntu-latest` en fournit
      # un par défaut, mais s'appuyer dessus ferait dépendre une garde d'une version que
      # personne ici n'a choisie, et qui change avec l'image du runner. On épingle la même
      # que `repo-ci.yml`, et seulement quand le step suivant tourne réellement.
      - uses: actions/setup-node@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          node-version: '24'

      # ⚠ TCK-331 — RÉACTIVÉ le 2026-08-20, après avoir été désactivé quelques heures.
      #
      # Il consomme `storage/coverage/cov.php`, que le step de test produit de nouveau — sur
      # push vers `dev` uniquement, et via une invocation DIRECTE de PHPUnit, la seule qui
      # accepte les trois sorties de couverture à la fois.
      #
      # ⚠ CE QU'IL FAUT SAVOIR EN LISANT L'HISTORIQUE DU JOB : ce step n'avait JAMAIS tourné
      # avec succès avant cette date. Les deux seules exécutions qui ont produit `cov.php`
      # ont échoué toutes les deux, AVANT lui, sur la sortie 1 muette du step de test —
      # `tests/impact-map.json` est donc restée figée à sa construction manuelle
      # (`eafab606`) depuis le 2026-08-17. C'est ce qui a fait repasser l'AC7 de TCK-320 à
      # NON TENU : il avait été coché en LISANT ce bloc, sur du code qui ne s'était jamais
      # exécuté. **Ne jamais déduire l'état d'un environnement de la configuration qui le
      # vise.**
      #
      # La chaîne complète — PHPUnit direct → `cov.php` → `build-impact-map.php` →
      # `check-impact-map.mjs` — a été jouée en local le 2026-08-20 sur un sous-ensemble
      # (`--filter='Tests\Unit\Rules'`) : 4 classes de test, 10 fichiers couverts sur 932
      # scannés, carte valide. Ce qui reste à observer ici, et NE PEUT l'être qu'ici, c'est
      # le commit automatique sur `dev`.
      - name: Régénérer la carte d'impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          # Pas de `-f` silencieux : si `cov.php` manque alors que la condition ci-dessus est
          # vraie, c'est que le step de test a menti sur ce qu'il produit. On le DIT.
          if [ ! -f storage/coverage/cov.php ]; then
            echo "::error::storage/coverage/cov.php absent alors que ce step tourne — le step de test ne produit pas ce qu'il annonce."
            exit 1
          fi

          php bin/build-impact-map.php storage/coverage/cov.php tests/impact-map.json

          # ⚠ LA CARTE EST VALIDÉE PAR CELUI QUI LA PRODUIT, ET C'EST LE SEUL MOMENT OÙ
          # ELLE PEUT L'ÊTRE. `repo-ci.yml` déclenche bien `check-impact-map.mjs` sur ce
          # fichier — mais le commit ci-dessous porte `[skip ci]`, qui saute TOUS les
          # workflows sur ce commit, Repo CI compris ; et aucune PR ne touche la carte,
          # puisqu'elle n'est réécrite que sur `dev`. Le déclencheur ajouté là-bas ne
          # s'exerce donc jamais sur le cas qu'il vise : une carte corrompue sortirait
          # « sur la PR de quelqu'un d'autre », exactement l'issue que son commentaire dit
          # éviter. Ici, en revanche, l'échec appartient à celui qui l'a causé.
          #
          # Pas de `|| exit 0` : une carte structurellement fausse ne se pousse pas. C'est
          # la SEULE chose de ce step qui fasse rougir le job — sa fraîcheur, non (cf. plus
          # bas), sa validité, oui.
          node ../scripts/check-impact-map.mjs --report

          # `git diff` SEUL compare l'arbre de travail à l'INDEX, pour des chemins déjà
          # suivis — un fichier jamais commité (ou redevenu absent du suivi) n'y apparaît
          # jamais comme « changé », même s'il vient d'être créé. On stage donc D'ABORD,
          # puis on compare l'index au dernier commit (`--cached`) : ça couvre la création
          # ET la modification. Sans ce détour, une carte pas encore trackée se ferait dire
          # « inchangée » à chaque exécution — le mécanisme censé la créer ne la créerait
          # jamais, en silence.
          git add tests/impact-map.json
          if git diff --cached --quiet -- tests/impact-map.json; then
            echo "carte inchangée — rien à pousser"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(tests): régénérer la carte d'impact [skip ci]"

          # Une seule tentative de rebase : si un autre push est arrivé entretemps, on
          # se replace dessus. Au-delà, on abandonne SANS faire rougir le job — la
          # carte est un index, sa fraîcheur n'est pas une garde (cf.
          # scripts/check-impact-map.mjs).
          git pull --rebase --quiet origin dev || { echo "⚠ rebase impossible — carte non poussée"; exit 0; }
          git push origin HEAD:dev || echo "⚠ push refusé — carte non poussée"

  # ────────────────────────────────────────────────────────────────────────────
  # Les migrations rejouées EN ARRIÈRE sur PostgreSQL — le seul code que rien d'autre n'exécute.
  #
  # ⚠ CE JOB A CHANGÉ DE RAISON D'ÊTRE AVEC ADR-0020, et le dire importe plus que le renommer.
  #
  # Il s'appelait `migrations-mysql` et il existait parce que le job de tests tournait sur SQLite :
  # il était la SEULE machine du dépôt à exécuter le DDL sur le moteur de production. `CLAUDE.md`
  # documentait quatre familles de pièges « qui passent en CI mais cassent en prod » — DEFAULT sur
  # JSON/TEXT, dropUnique sous FK, nom d'index au-delà de 64 caractères, `enum()` — qu'aucun test
  # ne pouvait voir. Le dépôt avait déjà payé ce défaut deux fois (`c473081b`, `9815694f`).
  #
  # **Cette raison-là est morte** : la suite entière tourne désormais sur PostgreSQL 17, donc
  # l'ALLER des migrations est exécuté par le job de tests, à chaque exécution, sur le moteur
  # cible. Un job qui rejouerait `migrate` ici ne prouverait plus rien de neuf.
  #
  # Ce qui reste, et qui n'est couvert par RIEN d'autre, c'est le RETOUR. *Le `down()` d'une
  # migration est le code le moins exécuté du dépôt — la suite de tests n'en exécute aucun — et
  # c'est le seul dont on ait besoin le jour où un déploiement tourne mal.* C'est là, et nulle
  # part ailleurs, que se déclare un `dropIndex` sur une colonne portant une FK : la version
  # MySQL de ce job a trouvé le cas de `2026_06_18_000001` à sa PREMIÈRE exécution, sur trois
  # tables à la fois (ardoise D-05).
  #
  # ─── Ce que ce job NE prouve pas, et il faut le lire avant de s'y fier ───────────────────────
  #
  # On ne peut pas faire `migrate:refresh` : `2026_05_18_120000_drop_spatie_permission_tables` est
  # DÉLIBÉRÉMENT irréversible (cutover TCK-278, son `down()` lève une RuntimeException assumée).
  # On roule donc en arrière jusqu'à la marche juste au-dessus d'elle, et on CALCULE ce nombre
  # plutôt que de l'écrire en dur.
  #
  # ⚠ LA COUVERTURE RÉELLE : **14 `down()` sur 134** au 2026-08-21 — et non « 3 sur 124 », chiffre
  # que `CLAUDE.md` a porté longtemps après avoir cessé d'être vrai. Il se recompte d'une ligne :
  #     ls database/migrations/*.php | xargs -n1 basename | sed 's/\.php$//' | sort \
  #       | awk '$0 > "2026_05_18_120000"' | wc -l
  # Les 120 autres — dont TOUTES les créations de tables, celles qu'il faudrait précisément pour
  # dérouler une release ancienne — ne sont exécutées nulle part, ni ici ni dans la suite.
  #
  # Le chiffre est affiché à chaque exécution : il grandit d'une unité par migration ajoutée. Ne
  # pas lire ce job comme « les down() sont couverts » — il couvre les down() RÉCENTS.
  #
  # ─── L'ancienne leçon de ce bloc, qui survit à la migration ──────────────────────────────────
  #
  # Ce job a tourné sur `mariadb:11.4` du 2026-06-29 au 2026-08-13, sur la foi d'un commentaire
  # affirmant que « `apt install mariadb-server` » avait été lancé sur le serveur. Personne ne
  # l'avait exécuté ; la mesure a rendu `mysql-server 8.0.46`. Ce n'était pas un écart de version,
  # c'était le mauvais MOTEUR — et le job l'annonçait comme une preuve à chaque exécution.
  #
  # *Ne jamais déduire l'état d'un environnement de la configuration — ni de la commande
  # d'installation — qui le vise.* Cette phrase s'applique DAVANTAGE aujourd'hui qu'hier : la
  # cible PostgreSQL de ce job est DÉCIDÉE par ADR-0020, elle n'est mesurée sur aucun serveur,
  # puisqu'aucune production PostgreSQL n'existe encore (D-04, TCK-288). `check-db-engine.mjs`
  # porte cette distinction dans sa constante, qui s'appelle `CIBLE` et non `PROD`.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  migrations-pgsql:
    name: Rollback des migrations sur PostgreSQL 17 (le code que rien d'autre n'exécute)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takussan-api

    services:
      postgres:
        # La MÊME image que le job de tests et que `docker-compose.yml`. Trois copies d'une
        # version divergent ; `scripts/check-db-engine.mjs` ne les laisse pas faire.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: takussan_ci
          POSTGRES_USER: takussan
          POSTGRES_PASSWORD: takussan
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U takussan -d takussan_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: takussan-api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('takussan-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Le moteur de CI est-il celui que le dépôt épingle ?
        # MESURÉ, pas supposé — c'est toute la leçon du bloc ci-dessus. Le service de GitHub
        # n'accepte pas d'arguments de serveur : sa collation ne peut être qu'observée, jamais
        # imposée. On l'observe donc, et on ÉCHOUE sur un écart plutôt que de l'imprimer.
        env:
          PGPASSWORD: takussan
        run: |
          LU=$(psql -h 127.0.0.1 -p 5433 -U takussan -d takussan_ci -tAc \
            "SELECT current_setting('server_version_num')::int / 10000 || '|' || datcollate || '|' \
             || pg_encoding_to_char(encoding) FROM pg_database WHERE datname = current_database();")
          echo "Moteur du runner : $LU"
          if [ "$LU" != "17|C|UTF8" ]; then
            echo "::error::moteur inattendu « $LU » — attendu « 17|C|UTF8 ». Une base de CI dans une"
            echo "::error::autre collation n'éprouve pas les comparaisons de chaînes du dépôt, et six"
            echo "::error::contraintes d'unicité sur texte en dépendent (ADR-0020)."
            exit 1
          fi
          # pgvector doit être DISPONIBLE ici aussi — c'est le seul endroit où une divergence
          # d'image se verrait avant le jour du chatbot.
          psql -h 127.0.0.1 -p 5433 -U takussan -d takussan_ci -tAc \
            "SELECT 1 FROM pg_available_extensions WHERE name = 'vector';" | grep -q 1 \
            || { echo "::error::extension vector indisponible — l'image n'est pas pgvector/pgvector."; exit 1; }

      - name: Migrate (aller)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: php artisan migrate --force --no-interaction

      - name: Rollback des migrations AU-DESSUS de la borne TCK-278, puis re-migration
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_DATABASE: takussan_ci
          DB_USERNAME: takussan
          DB_PASSWORD: takussan
        run: |
          BORNE=2026_05_18_120000_drop_spatie_permission_tables
          # On compte des MIGRATIONS, pas des entrées de répertoire. `ls database/migrations`
          # listait tout : un `README.md`, un sous-dossier `archive/`, un `.sql` égaré — dès lors
          # qu'il trie après la borne — ajoutait 1 à STEP. `migrate:rollback` descendait alors
          # d'un cran SOUS la borne, jusqu'au cutover TCK-278 dont le `down()` lève
          # délibérément, et le job échouait en pointant la migration de cutover au lieu du
          # mauvais compte. Le glob `*.php` ne peut pas se tromper de la même façon.
          STEP=$(ls database/migrations/*.php | xargs -n1 basename | sed 's/\.php$//' | sort | awk -v b="$BORNE" '$0 > b' | wc -l | tr -d ' ')
          echo "Migrations réversibles au-dessus de $BORNE : $STEP"
          if [ "$STEP" -gt 0 ]; then
            php artisan migrate:rollback --step="$STEP" --force --no-interaction
            php artisan migrate --force --no-interaction
          else
            echo "::warning::Aucune migration au-dessus de la borne — aucun down() n'a été éprouvé."
          fi
