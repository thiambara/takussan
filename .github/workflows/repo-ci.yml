# Gardes transverses au dépôt — celles qui n'appartiennent ni au back ni au front.
#
# Elles vérifient toutes la même chose sous trois formes : **qu'un document dérivé suit encore sa
# source, et que la source suit encore la réalité.** C'est la famille de défauts qui a coûté le
# plus cher à ce dépôt, parce qu'aucun de ses membres ne se signale tout seul :
#
#   · `INDEX.md` maintenu à la main → faux sur 213 de ses 266 entrées (80,1 %) ;
#   · `.env.example` et `.env.docker` qui divergent d'une clé → une intégration qui lit `null` ;
#   · un `spec_refs` qui pointe un fichier disparu → dix minutes perdues par lecteur, à vie.
#
# Aucune de ces gardes ne compile. Elles tiennent la documentation au même niveau d'exigence que
# le code, et c'est tout leur objet.
#
# UNE exception, et elle est assumée : `test-deploy-search-reindex.sh` est un vrai test. Il vit
# ici parce que son sujet — la décision de réindexation de `deploy.sh` — n'a pas d'autre maison :
# ni PHPUnit ni vitest ne lisent du bash. Cette phrase disait « ni ne teste quoi que ce soit »
# avant que le test n'existe ; la corriger était moins cher que de laisser l'en-tête mentir.
name: Repo CI

on:
  pull_request:
    paths:
      - 'takussan-api/.env.example'
      - 'takussan-api/.env.docker'
      # Chaque garde doit être déclenchée par les DEUX côtés qu'elle compare, sinon elle
      # ne voit qu'une moitié de l'écart qu'elle existe pour trouver :
      #   check-queues       → les `onQueue()` de takussan-api/app, scripts/server-setup.sh ET dev.sh
      #   check-pro-routes   → PRO_ROUTES et les pages, tous deux sous takussan-web/src
      #   check-backlog      → les tickets ET les specs qu'ils citent
      #   check-models-spec  → takussan-api/app/Models ET docs/models-spec.md
      #
      # TROIS entrées ont manqué successivement : `takussan-web/**`, puis `dev.sh`, puis les
      # specs. Les deux premières se corrigeaient en ajoutant une ligne ; la troisième a montré
      # que la liste elle-même était le défaut. `check-backlog` vérifie que CHAQUE `spec_refs`
      # pointe sur un fichier existant, et les tickets en citent HUIT sous `docs/` —
      # features-by-actor, ardoise, design-guidelines, configuration, pdf-templates,
      # spatie-query-builder… — quand cette liste en nommait deux. Supprimer l'un des six autres
      # ne déclenchait aucune garde : le pointeur cassé arrivait sur `dev`, et l'échec sortait
      # sur la PR suivante, imputé à quelqu'un qui n'y était pour rien.
      #
      # D'où `docs/**` : la garde lit tout `docs/`, le déclencheur couvre tout `docs/`. Une
      # énumération se re-vérifie à chaque garde ajoutée ; un préfixe, jamais.
      - 'takussan-api/app/**'
      - 'takussan-api/routes/**'
      - 'takussan-api/database/**'
      - 'takussan-web/src/**'
      - 'scripts/**'
      - 'dev.sh'
      - 'docs/**'
      # `check-doc-links` lit aussi les documents normatifs hors `docs/`. Même règle qu'en haut de
      # ce bloc : la garde les lit, le déclencheur doit les couvrir — sinon un lien cassé dans
      # `takussan-web/README.md` arrive sur `dev` et sort sur la PR de quelqu'un d'autre.
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'takussan-api/CLAUDE.md'
      - 'takussan-web/CLAUDE.md'
      - 'takussan-web/README.md'
      # `check-auth-interrupts` compare `takussan-web/src` ET `takussan-web/next.config.ts` :
      # l'interdiction de `forbidden()` n'a de sens que TANT QUE `experimental.authInterrupts`
      # est absent de la config. Même règle qu'en haut de ce bloc — sans cette ligne, activer le
      # drapeau seul n'exécuterait pas la garde qui existe pour en juger.
      - 'takussan-web/next.config.ts'
      # `check-db-engine` compare le compose, les deux services PostgreSQL d'`api-ci.yml`
      # (tests + `migrations-pgsql`) et l'init SQL. Les trois fichiers doivent déclencher,
      # sinon la garde ne voit qu'une moitié de l'écart qu'elle existe pour trouver — la
      # règle posée en haut de ce bloc.
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/repo-ci.yml'
      # `check-skills-dir` cherche un SECOND répertoire de compétences. Le nommer ici serait la
      # faute que ce bloc documente déjà : on n'énumère que les endroits où l'on a DÉJÀ été
      # surpris, et le prochain arbre ne s'appellera pas `.agents/` — il s'appellera `.codex/`,
      # `.cursor/` ou `agent-skills/`. Une PR qui n'ajouterait QUE ce répertoire ne déclencherait
      # aucune des lignes ci-dessus, et la garde resterait muette sur le seul défaut qu'elle
      # existe pour voir.
      #
      # D'où deux motifs, et aucun nom : tout ce qui touche un dossier `skills/` à n'importe quelle
      # profondeur, et tout `SKILL.md` où qu'il soit. *Une énumération se re-vérifie à chaque
      # arbre ajouté ; un motif, jamais.*
      - '**/skills/**'
      - '**/SKILL.md'
      # `check-infra-versions` confronte `docs/infra/versions.json` à TOUS les workflows (elle
      # liste le dossier plutôt que d'énumérer) et à `composer.json`. Le préfixe, pas
      # l'énumération : les deux lignes ci-dessus sont donc redondantes, et c'est voulu — une
      # liste écrite cesse de couvrir le fichier qu'on ajoute, un préfixe jamais. C'est la règle
      # posée en haut de ce bloc, appliquée à elle-même.
      - '.github/workflows/**'
      - 'takussan-api/composer.json'
      # `check-deps-dev-atteignables` lit le LOCK, et lui seul sait ce qui est livré : c'est le
      # lock qui range un paquet en `packages` ou en `packages-dev`, pas le `composer.json`. Un
      # `composer update` qui fait basculer une dépendance TRANSITIVE d'un côté à l'autre ne touche
      # pas `composer.json` — et c'est exactement par là que `dompdf/dompdf` est arrivé (TCK-354).
      - 'takussan-api/composer.lock'
      # `check-impact-map` lit la carte. Aucune entrée existante ne la couvre : les
      # déclencheurs de ce workflow visent `takussan-api/app/**`, `routes/**` et
      # `database/**`, jamais `tests/`. Sans cette ligne, une carte corrompue arriverait
      # sur `dev` et sortirait sur la PR de quelqu'un d'autre — la règle posée en haut
      # de ce bloc.
      - 'takussan-api/tests/impact-map.json'
      # `check-test-base-classes` (TCK-309) lit TOUT `takussan-api/tests/`, et rien ci-dessus ne
      # l'y déclenche : la ligne juste au-dessus vise UN fichier, les autres visent `app/`,
      # `routes/` et `database/`. Une PR qui n'ajouterait qu'une quatrième classe de base de test
      # ne déclencherait donc aucune ligne, et la garde resterait muette sur le seul défaut
      # qu'elle existe pour voir — la règle posée en haut de ce bloc, à la lettre.
      #
      # Le préfixe rend la ligne `impact-map.json` redondante. Elle reste, et c'est voulu : même
      # raison que pour `.github/workflows/**` plus haut — un préfixe couvre le fichier qu'on
      # ajoutera, une énumération se re-vérifie à chaque ajout.
      - 'takussan-api/tests/**'

      # `check-impact-triggers` compare les trois constantes d'`ImpactSelector` à l'énumération
      # de `takussan-api/CLAUDE.md`. Le second côté est déjà couvert plus haut ; le premier ne
      # l'est par AUCUNE entrée — les déclencheurs visent `app/`, `routes/`, `database/` et le
      # seul fichier `tests/impact-map.json`. Sans cette ligne, un déclencheur ajouté au code
      # sans être documenté passerait sans que la garde ne s'exécute : la règle posée en haut de
      # ce bloc, *les DEUX côtés qu'une garde compare doivent la déclencher*.
      #
      # Le préfixe plutôt que le nom du fichier : `tests/Support/` porte aussi `ImpactMap`,
      # `SearchableModels` et `TestProcessToken`, et la prochaine garde de ce genre y vivra.
      - 'takussan-api/tests/Support/**'
  push:
    branches: [dev, master]
    paths:
      - 'takussan-api/.env.example'
      - 'takussan-api/.env.docker'
      - 'takussan-api/app/**'
      - 'takussan-api/routes/**'
      - 'takussan-api/database/**'
      - 'takussan-web/src/**'
      - 'scripts/**'
      - 'dev.sh'
      - 'docs/**'
      # `check-doc-links` lit aussi les documents normatifs hors `docs/`. Même règle qu'en haut de
      # ce bloc : la garde les lit, le déclencheur doit les couvrir — sinon un lien cassé dans
      # `takussan-web/README.md` arrive sur `dev` et sort sur la PR de quelqu'un d'autre.
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'takussan-api/CLAUDE.md'
      - 'takussan-web/CLAUDE.md'
      - 'takussan-web/README.md'
      # `check-auth-interrupts` compare `takussan-web/src` ET `takussan-web/next.config.ts` :
      # l'interdiction de `forbidden()` n'a de sens que TANT QUE `experimental.authInterrupts`
      # est absent de la config. Même règle qu'en haut de ce bloc — sans cette ligne, activer le
      # drapeau seul n'exécuterait pas la garde qui existe pour en juger.
      - 'takussan-web/next.config.ts'
      # `check-db-engine` compare le compose, les deux services PostgreSQL d'`api-ci.yml`
      # (tests + `migrations-pgsql`) et l'init SQL. Les trois fichiers doivent déclencher,
      # sinon la garde ne voit qu'une moitié de l'écart qu'elle existe pour trouver — la
      # règle posée en haut de ce bloc.
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/repo-ci.yml'
      # Mêmes motifs qu'au déclencheur `pull_request` — et pour la même raison : une garde
      # déclenchée d'un seul côté ne voit qu'une moitié de l'écart qu'elle cherche.
      - '**/skills/**'
      - '**/SKILL.md'
      # `check-infra-versions` confronte `docs/infra/versions.json` à TOUS les workflows (elle
      # liste le dossier plutôt que d'énumérer) et à `composer.json`. Le préfixe, pas
      # l'énumération : les deux lignes ci-dessus sont donc redondantes, et c'est voulu — une
      # liste écrite cesse de couvrir le fichier qu'on ajoute, un préfixe jamais. C'est la règle
      # posée en haut de ce bloc, appliquée à elle-même.
      - '.github/workflows/**'
      - 'takussan-api/composer.json'
      # `check-deps-dev-atteignables` lit le LOCK, et lui seul sait ce qui est livré : c'est le
      # lock qui range un paquet en `packages` ou en `packages-dev`, pas le `composer.json`. Un
      # `composer update` qui fait basculer une dépendance TRANSITIVE d'un côté à l'autre ne touche
      # pas `composer.json` — et c'est exactement par là que `dompdf/dompdf` est arrivé (TCK-354).
      - 'takussan-api/composer.lock'
      # `check-impact-map` lit la carte. Aucune entrée existante ne la couvre : les
      # déclencheurs de ce workflow visent `takussan-api/app/**`, `routes/**` et
      # `database/**`, jamais `tests/`. Sans cette ligne, une carte corrompue arriverait
      # sur `dev` et sortirait sur la PR de quelqu'un d'autre — la règle posée en haut
      # de ce bloc.
      - 'takussan-api/tests/impact-map.json'
      # `check-test-base-classes` (TCK-309) lit TOUT `takussan-api/tests/`, et rien ci-dessus ne
      # l'y déclenche : la ligne juste au-dessus vise UN fichier, les autres visent `app/`,
      # `routes/` et `database/`. Une PR qui n'ajouterait qu'une quatrième classe de base de test
      # ne déclencherait donc aucune ligne, et la garde resterait muette sur le seul défaut
      # qu'elle existe pour voir — la règle posée en haut de ce bloc, à la lettre.
      #
      # Le préfixe rend la ligne `impact-map.json` redondante. Elle reste, et c'est voulu : même
      # raison que pour `.github/workflows/**` plus haut — un préfixe couvre le fichier qu'on
      # ajoutera, une énumération se re-vérifie à chaque ajout.
      - 'takussan-api/tests/**'

      # `check-impact-triggers` compare les trois constantes d'`ImpactSelector` à l'énumération
      # de `takussan-api/CLAUDE.md`. Le second côté est déjà couvert plus haut ; le premier ne
      # l'est par AUCUNE entrée — les déclencheurs visent `app/`, `routes/`, `database/` et le
      # seul fichier `tests/impact-map.json`. Sans cette ligne, un déclencheur ajouté au code
      # sans être documenté passerait sans que la garde ne s'exécute : la règle posée en haut de
      # ce bloc, *les DEUX côtés qu'une garde compare doivent la déclencher*.
      #
      # Le préfixe plutôt que le nom du fichier : `tests/Support/` porte aussi `ImpactMap`,
      # `SearchableModels` et `TestProcessToken`, et la prochaine garde de ce genre y vivra.
      - 'takussan-api/tests/Support/**'

jobs:
  guards:
    name: Gardes documentaires
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `check-backlog.mjs` confronte les statuts des tickets à l'historique de `dev` : un
          # ticket en `review` dont le code est déjà mergé est le défaut qui a produit une colonne
          # de 177 entrées face à ZÉRO pull request ouverte. Sur un clone superficiel il ne peut
          # pas, et il le dit en rouge plutôt qu'en silence.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Les deux fichiers d'environnement déclarent les mêmes clés
        run: node scripts/check-env-parity.mjs

      - name: Les clés des gardes webhook sont déclarées, pas seulement lues
        # `check-env-parity` compare les deux fichiers ENTRE EUX. Il ne peut pas voir
        # qu'une clé manque des DEUX — c'est une parité parfaite. Les sept clés des
        # gardes de webhook entrant (SMS + WhatsApp) manquaient précisément ainsi, et
        # elles échouent FERMÉ : jeton vide → 404, allowlist vide → 403, secret vide →
        # rejet. Un déploiement sans elles ne produit aucune erreur, seulement un canal
        # muet — pas d'accusé de livraison, pas d'alerte, rien à diagnostiquer.
        #
        # La liste des clés est DÉRIVÉE de `config/sms.php` et `config/whatsapp.php` à
        # chaque exécution, pas recopiée : une clé fail-closed ajoutée demain est gardée
        # sans que personne ne pense à cette garde (TCK-296).
        run: node scripts/check-webhook-env-keys.mjs --report

      - name: Aucune substitution involontaire dans un heredoc non quoté
        # `server-setup.sh` écrit /etc/sudoers.d et /etc/logrotate.d par heredoc, et ces blocs
        # NE PEUVENT PAS être quotés : ils interpolent ${DEPLOY_USER}, ${APP_DIR}. Bash y
        # exécute donc aussi les backticks — y compris dans une ligne qui commence par « # ».
        # Un commentaire écrivant `setup_queue_service` a réellement invoqué la fonction, EN
        # ROOT, et supprimé le mot du fichier écrit. Reproduit avant correction.
        run: node scripts/check-heredocs.mjs --report

      - name: La décision de réindexation de `deploy.sh` fait ce qu'elle annonce
        # Le seul VRAI test de ce workflow, et il est ici parce que son sujet n'est couvert
        # nulle part ailleurs : ni PHPUnit ni vitest ne lisent du bash, et `deploy.sh` n'a
        # jamais été exécuté une seule fois (D-04, TCK-288). Il décide pourtant, à chaque
        # déploiement, quels modèles réindexer — et se tromper est muet des deux côtés :
        # trop réindexer noie la file de jobs (3308 tâches mesurées pour une exécution, D-44),
        # trop peu laisse la recherche répondre faux sur un index périmé, application en
        # parfaite santé. Le harnais extrait le bloc du fichier réel, talonne `php`, et joue
        # huit scénarios plus une ablation qui échoue exprès.
        run: ./scripts/test-deploy-search-reindex.sh

      - name: Le banc d'essai tourne sur le moteur de base de la production
        # `docker-compose.yml` et le job `migrations-mysql` tournaient sur `mariadb:11.4`, sur la
        # foi d'un `apt install mariadb-server` que personne n'avait exécuté. Mesuré le
        # 2026-08-13 : le serveur est en **MySQL 8.0.46**, `utf8mb4_0900_ai_ci`. Ce n'était pas
        # un écart de version, c'était le mauvais MOTEUR — et le job d'éprouvage des migrations
        # validait donc du DDL que la production n'exécuterait jamais (TCK-289).
        run: node scripts/check-db-engine.mjs --report

      - name: Toute file de jobs poussée par le code est consommée en production
        # L'unité systemd lançait `queue:work` SANS `--queue` : elle ne consommait que
        # `default`, et les jobs poussés sur `media`, `notifications-urgent` et
        # `reconciliation` s'empilaient dans la table `jobs` sans jamais s'exécuter.
        # Rien ne le signalait — une file sans consommateur ne se manifeste que par
        # l'absence de quelque chose, et l'absence ne déclenche rien.
        run: node scripts/check-queues.mjs --report

      - name: Toute route cadenassée est gardée côté serveur
        # La règle « réservé aux agences standard » est écrite deux fois, en PHP et en
        # TypeScript — le docblock PHP se déclare lui-même « backend twin ». Rien ne
        # vérifiait qu'elles restent d'accord.
        #
        # Sa première version ne cherchait qu'une CHAÎNE (`ensureStandardAgencyOrRedirect`)
        # et a donc déclaré nues quatre pages qui gardent en ligne. On a agi sur ce faux
        # négatif. Elle reconnaît désormais les deux formes, et REFUSE DE CONCLURE quand
        # elle ne comprend pas une page — « je ne sais pas » plutôt que « il n'y en a pas ».
        run: node scripts/check-pro-routes.mjs --report

      - name: Aucun écran ne réinvente son état vide ni son bloc d'erreur
        # `docs/design-guidelines.md:13` demande « une seule façon d'afficher un état vide ».
        # Mesuré avant TCK-246 : le nom `EmptyState` était pris ONZE fois, chaque fois comme
        # fonction privée locale jamais exportée. Une convention que rien ne mesure a été
        # violée onze fois — c'est la seule preuve dont on avait besoin qu'il fallait une garde.
        #
        # ⚠ Elle est HONNÊTE SUR SA PORTÉE, et le dit dans sa propre sortie : seul son contrôle
        # A (« le nom n'est pas repris hors de `components/feedback/` ») prouve une propriété.
        # Les deux autres sont des CLIQUETS heuristiques — des planchers, pas des inventaires.
        # Chercher un jeton ne mesure pas une propriété (dette D-23) ; plutôt que de laisser
        # croire le contraire, cette garde écrit ce qu'elle ne couvre pas.
        run: node scripts/check-feedback-states.mjs --report

      - name: Il n'y a qu'un jeu de jetons de couleur — le dialecte app-* ne repousse pas
        # `globals.css` déclarait HUIT variables `--app-*` qui redisaient au hex près des jetons
        # déjà documentés (`--app-ink` ≡ `--foreground`, `--app-surface-1` ≡ `--card`…), et le
        # bloc `.dark` n'en redéfinissait AUCUNE : le shell de `/admin`, bâti dessus, serait
        # resté en clair au premier commutateur de thème.
        #
        # TCK-244 avait déjà fait cette migration et était `done`. Son AC1 rejouée verbatim le
        # 2026-08-26 rendait 7 là où elle exigeait 0 — elle échouait DANS SON PROPRE PÉRIMÈTRE,
        # parce qu'elle greppait `src/app/(dashboard)`, les pages, quand le vocabulaire vivait
        # dans les composants qu'elles montent : 1049 occurrences dans `src/components` pour 15
        # dans le répertoire audité. *Un grep qui ne suit pas les imports mesure le répertoire,
        # pas l'écran.* D'où la forme de cette garde : `takussan-web/src` en ENTIER, sans
        # exception de répertoire, et la liste large des préfixes d'utilitaires — l'AC2 de
        # TCK-244 cherchait `stroke-` quand le code écrivait `fill-`.
        #
        # Elle PROUVE, elle ne cliquette pas : une classe Tailwind est un littéral, sous peine
        # de ne pas être compilée. Vérifiée par ablation (TCK-372, AC3).
        run: node scripts/check-app-tokens.mjs --report

      - name: Les trois espaces ne parlent qu'un vocabulaire de couleur
        # Même défaut que la garde ci-dessus, sur un autre périmètre, et découvert APRÈS elle :
        # TCK-245 avait éteint la palette Tailwind brute de la console super-admin et était
        # `done`. Son AC1 greppait `src/app/(super-admin)/**` — les wrappers de page. L'écran
        # vit dans les composants qu'ils montent. Rejouée le 2026-08-26 : 11 dans le périmètre
        # audité (l'AC exigeait 0, et elles étaient REVENUES avec deux pages créées après),
        # 218 dans `src/components/admin/super`, 12 dans les trois `layout/SuperAdmin*`, 1 dans
        # `src/components/super-admin`. Trois vocabulaires cohabitaient — jetons du DS, palette
        # brute, dialecte `app-*` — et six fichiers en mélangeaient deux.
        #
        # D'où les périmètres nommés dans `PERIMETRES`, et une liste de familles qui est celle
        # de Tailwind et non celle du relevé : recopier les dix familles que la console
        # utilisait ce jour-là laisserait passer le premier `bg-teal-100` venu.
        #
        # ⚠ Cette étape fait DEUX choses, et une seule des deux est une preuve.
        #
        #   PREUVE — le PÉRIMÈTRE GARDÉ doit être à zéro. Une classe Tailwind est un littéral,
        #   sous peine de ne pas être compilée : une lecture de texte suffit, sans heuristique.
        #   Vérifiée par ablation (TCK-358, AC3), et re-vérifiée par 20 mutations dont 6 formes
        #   que la version d'origine passait au vert.
        #
        #   CLIQUET — le RESTE NON GARDÉ. La revue adverse de TCK-358 a montré que le périmètre
        #   est une liste de répertoires quand l'écran est un graphe de rendu : la garde sortait
        #   en 0 pendant que `/super-admin/payouts` rendait six pastilles de palette brute, deux
        #   maillons plus loin dans `src/components/billing`. La garde calcule donc aussi la
        #   clôture des imports depuis `src/app/(super-admin)/**`, en retire le périmètre gardé,
        #   et REFUSE que le compte du reste monte. Ce reste vit dans des primitives partagées
        #   avec `/app` et le site public (`ui/`, `forms/`, `files/`) : les porter est TCK-384.
        #
        # ⚠ DEUX ESPACES depuis TCK-381, et le nom du fichier n'en dit qu'un. Le tableau de bord
        # `/app` a rejoint la garde : même mécanique, cliquet propre. Relevé du 2026-08-27 sur sa
        # clôture d'import réelle — 403 fichiers, 119 porteurs, 1070 occurrences — quand le ticket
        # annonçait 259 / 45 / 393. *Un relevé de ticket est une hypothèse, pas une mesure*, et
        # celui-ci se trompait d'un facteur 2,7, dans le sens qui rassure.
        #
        # TCK-381 a aussi élargi la garde par MUTATION plutôt que par prudence : six préfixes de
        # couleur réels — les côtés de bordure, les axes de séparateur, `ring-offset` — sortaient
        # au vert, et trois manœuvres de désarmement de la configuration elle-même (retirer un
        # répertoire, retirer son témoin, retirer un espace) le faisaient aussi. Les trois crans
        # ajoutés — témoins, plancher de fichiers gardés, forme de la configuration — n'empêchent
        # pas la manœuvre à trois gestes : ils l'obligent à être VISIBLE dans le diff (trou T6).
        #
        # ⚠ QUATRE désarmements de plus, mesurés par la revue adverse de TCK-381 le 2026-08-27,
        # dont DEUX se jouaient à UN SEUL GESTE sur une garde qui déclarait six trous — sans
        # qu'aucun des deux y figure :
        #   · retirer une famille de `FAMILLES` : 13 des 22 n'étaient éprouvées par rien, et la
        #     garde sortait en 0 AVEC un ✓ pendant qu'un `bg-indigo-500` vivait dans un fichier
        #     gardé. 15 des 27 préfixes étaient dans le même cas ;
        #   · lever `RESTE_PLAFOND` de la console super-admin : le cliquet n'était pas bilatéral,
        #     et la garde IMPRIMAIT elle-même « (cliquet 200) » en sortant en 0 ;
        #   · `globals.css` — le seul fichier où une couleur a le droit d'être décidée — n'était
        #     lu par personne, pendant que la garde affirmait prouver le contraire ;
        #   · la couleur en attribut de présentation (`fill="#a85332"`) échappait aux 4 contrôles.
        #
        # Les deux premiers sont fermés par une AUTO-ÉPREUVE PAR ABLATION : à chaque exécution, la
        # garde reconstruit ses cinq contrôles sans chaque entrée de configuration et exige que
        # quelque chose cesse d'être vu. *Une entrée dont le retrait ne change rien ne garde rien*
        # — c'est la règle que ce dépôt applique déjà à ses tests, appliquée à une configuration.
        #
        # `--report` imprime tout, et c'est délibéré : un vert qui ne dit pas ce qu'il a mesuré
        # est le vert qui a rendu TCK-245 `done` pendant quatre mois.
        run: node scripts/check-super-admin-tokens.mjs --report

      - name: La chrome publique ne parle qu'en jetons
        # TCK-440. Même motif que la garde ci-dessus, sur l'autre moitié du produit : la surface
        # que voient les INCONNUS. Relevé du 2026-08-27 avant conversion, avec la commande du
        # ticket : 121 classes de palette neutre brute, dont 54 dans la seule navbar et 8 dans le
        # pied de page — les deux composants rendus sur TOUTES les pages publiques, et les deux
        # plus éloignés du design system. La page d'accueil qui les contient tous les deux était,
        # elle, à zéro.
        #
        # Trois choses qu'aucune autre entrée de ce fichier ne couvre :
        #   · `check-super-admin-tokens` garde la console et `/app` ; ses trois périmètres publics
        #     (`compare`, `favorites`, `search`) n'y entrent que par CLÔTURE — seuls les fichiers
        #     que `/app` monte réellement. `FilterSidebar`, qui portait 27 occurrences, n'y était
        #     pas ;
        #   · `check-app-tokens` ne cherche que le dialecte `app-*`, pas la palette Tailwind ;
        #   · `check-chart-contrast` mesure les couleurs de graphiques, pas la chrome.
        #
        # ⚠ Cette garde DÉCLARE deux trous, mesurés, plutôt que de laisser croire qu'elle voit
        # tout : les familles chaudes et sémantiques (260 occurrences, pierre en tête) et les
        # couleurs nommées (54, dont deux voiles qui attendent une classe dédiée). Les fermer est
        # le travail d'un ticket, pas d'une régression d'expression régulière.
        run: node scripts/check-public-chrome-tokens.mjs --report

      - name: Les consoles ne figent aucune locale
        # TCK-364 a supprimé 18 formatages `'fr-FR'` écrits en dur dans 13 fichiers. Son AC1 était
        # un grep, il était vert, et il l'est resté exactement le temps de la fusion : trois
        # tickets de la MÊME vague ont créé des fichiers NEUFS portant chacun le même helper
        # module-level avec `'fr-FR'` dedans. Git n'a signalé aucun conflit — un fichier qui
        # n'existe que d'un côté d'une fusion ne peut pas en produire — et l'AC avait été mesuré
        # sur une base où les fautifs n'existaient pas encore.
        #
        #   *Un AC vérifié par un grep manuel n'est pas une garde, c'est une photographie.*
        #
        # La garde refuse DEUX formes, pas une : le littéral (`Intl.DateTimeFormat('fr-FR', …)`)
        # et son inverse silencieux, `toLocaleString()` NU — qui ne fige rien mais suit la locale
        # du NAVIGATEUR. Le second est le pire des deux : il ne rend pas la même mauvaise réponse
        # à tout le monde, il en rend une différente par machine, donc irreproductible en test.
        #
        # DEUX CLIQUETS, pas un — depuis la revue adverse du 2026-08-27. Le périmètre était une
        # liste de RÉPERTOIRES, l'écran est un GRAPHE DE RENDU, et les deux ne coïncident jamais
        # tout seuls : `/super-admin/payouts`, `/super-admin/plans` et l'onglet KYC rendaient
        # NEUF `'fr-FR'` depuis `components/billing` et `components/kyc`, noyés dans un « reste »
        # indifférencié. La garde calcule désormais la clôture transitive des imports depuis
        # `app/(super-admin)/**` et compte séparément ce que la console REND.
        #
        # Les deux chiffres sont des cliquets DANS LES DEUX SENS : la garde échoue s'ils montent
        # (récidive) ET s'ils descendent sans que la ligne soit corrigée. C'est ce qui rend une
        # HAUSSE de plafond immédiatement rouge — l'une des trois façons de désarmer une garde à
        # seuil, à côté du répertoire retiré et du fichier exempté, que ses témoins couvrent.
        run: node scripts/check-locale-figee.mjs --report
      - name: Aucun chemin de vocabulaire d'enum n'est composé à la main
        # TCK-466. `PROPERTY_ENUM_NAMESPACES` (`property-form/options.ts`) porte depuis TCK-292 la
        # consigne « ne jamais recopier ces chaînes à la main ailleurs », et rien ne la vérifiait.
        # TCK-464 a dû la faire respecter TROIS FOIS À LA MAIN, sur trois tâches différentes :
        # *une règle qu'une revue doit rappeler à chaque tâche n'est pas une règle, c'est une
        # habitude — et une habitude ne survit pas à la fusion.*
        #
        # Le contournement visé n'a pas l'air d'en être : le traducteur est borné PLUS HAUT
        # (`useTranslations('property')`) et le reste du chemin se recompose dans un gabarit
        # (`t(`types.${bien.type}`)`). Les deux moitiés sont anodines séparément — ni le typage ni
        # le lint n'y voient rien. La garde recompose et confronte à la table.
        #
        # ⚠ LA TABLE EST LUE, jamais recopiée : une entrée ajoutée est gardée le jour même, sans
        # que la garde bouge. Une copie des dix chemins ici recréerait l'inventaire parallèle que
        # la règle existe pour interdire (J-07).
        #
        # Le jour de sa pose elle a nommé un contournement VIVANT que personne n'avait vu :
        # `PropertyCard.tsx:187`, le composant le plus rendu du site public, recopiait
        # `property.types` en deux morceaux. Corrigé dans le même geste.
        #
        # ⚠⚠ C'EST UN PLANCHER, PAS UNE PREUVE, et son en-tête le dit avant tout le reste : une clé
        # d'enum écrite en dur SANS interpolation (`if (type === 'villa') t('types.villa')`) ne
        # matche aucun motif et reste un travail de revue. *Une garde qui se lit comme une garantie
        # est pire qu'une garde absente.* Trois autres faux négatifs sont énumérés et mesurés là-bas.
        #
        # BORNE APPLIQUÉE = BORNE DÉCLARÉE : zéro, sur tout `takussan-web/src` hors tests. Pas de
        # cliquet, pas de fichier exempté. Éprouvée par ablation dans LES DEUX SENS le 2026-08-29 :
        # le contournement de `PropertyCard` rétabli la fait rougir en nommant fichier et ligne ;
        # et démonter sa branche de garde, vider son corpus dérivé, ou court-circuiter les boucles
        # qui l'exercent la font échouer — ce dernier cas est un trou qu'elle avait, trouvé par
        # l'ablation et fermé (l'inégalité portait sur la LONGUEUR du corpus, pas sur ce qui en
        # était réellement éprouvé).
        run: node scripts/check-enum-namespaces.mjs --report
      - name: Les couleurs de série des graphiques atteignent 3:1 sur --card
        # TCK-374. L'AC ne demandait qu'un contraste « calculé et reporté dans la PR » — donc un
        # nombre vrai le jour où on l'écrit, que personne ne rejoue. Or la matière première est un
        # HEX dans `globals.css` : elle bougera. La garde recalcule les deux thèmes à partir des
        # SOURCES, qui disent quels jetons servent de couleur et sous quelle forme.
        #
        # Ce qu'elle a attrapé le jour de sa pose : `--chart-3` (#c89a4a) rend 2,57:1 sur `--card`
        # en thème CLAIR — moins bien que l'`emerald-500` hors charte qu'il devait remplacer, et
        # irréprochable en sombre (8,17:1). Un défaut d'un seul thème, dans une charte qu'on
        # croyait « suffire à régler le contraste ».
        #
        # ⚠ RÉÉCRITE le 2026-08-27 par la revue de TCK-374, et le motif mérite d'être ici. La
        # première version ne lisait QUE `charts/palette.ts`, avec une expression régulière qui
        # exigeait un chiffre unique suivi d'une apostrophe. Sur douze mutations, elle en attrapait
        # TROIS — et six sortaient en 0 : un `/50` d'opacité (le trait rend alors 2,11:1), un jeton
        # à deux chiffres, un hex arbitraire, un thème retiré de sa propre table, un seuil abaissé
        # de 3 à 1, et l'amputation de son alternative `bg`, dont le compte affiché ne bougeait
        # même pas. Onze classes de jeton vivaient par ailleurs hors de son périmètre.
        #
        # La version actuelle lit `components/charts` ET `components/reporting`, refuse toute
        # forme qu'elle ne sait pas interpréter au lieu de l'omettre, exige que ce qui n'est pas
        # une série se DÉCLARE avec sa mesure, et s'auto-éprouve (constantes ancrées, témoins de
        # périmètre, valeur de contrôle, cliquet à 28 mesures qui échoue dans les deux sens).
        # Vérifiée par ablation : 14 mutations, 14 rouges.
        run: node scripts/check-chart-contrast.mjs --report
      - name: Le couple RENDU par ProfileBadge atteint 4,5:1 (texte, deux thèmes, deux surfaces)
        # TCK-444. Garde SŒUR de la précédente, et la distinction est tout le sujet :
        # `check-chart-contrast` mesure les jetons `--chart-*` NUS au seuil de 3:1 (objet
        # graphique, WCAG 1.4.11) ; celle-ci mesure le COUPLE COMPOSÉ que `ProfileBadge` rend —
        # l'aplat `bg-chart-N/20` aplati sur la surface, plus l'encre posée dessus — au seuil de
        # 4,5:1 (TEXTE, 1.4.3). Le badge porte un mot, pas une icône.
        #
        # ⚠ La garde de graphiques était VERTE pendant que **12 couples sur 20** échouaient ici,
        # et son en-tête le disait déjà : elle « ne dit rien [d']une série posée sur une autre
        # surface ». Ce n'était pas un défaut de la garde, c'était le périmètre qu'elle annonce —
        # d'où une sœur, et non un élargissement qui aurait mélangé deux seuils.
        #
        # Ce que la recette avait de faux n'était pas une ligne, c'était le MOTIF : du texte posé
        # sur un aplat à 20 % de SA PROPRE couleur. Le contraste y est borné par celui du jeton nu
        # sur la surface — 3,55:1 pour `--chart-3` — donc **aucune valeur d'alpha ne pouvait
        # sauver `agent`**. Corriger la seule ligne fautive aurait corrigé un cinquième du défaut.
        #
        # BORNE APPLIQUÉE = BORNE DÉCLARÉE : 4,5:1, sur les 24 couples (5 types + le repli) × 2
        # thèmes × 2 surfaces, aucun exempté. Le compte est un cliquet à DEUX sens — une garde à
        # lecture de texte meurt en ne trouvant plus rien, pas en rougissant.
        #
        # Ablation le 2026-08-29, dans les deux sens : remettre le SEUL type `agent` sur
        # `text-chart-3` la fait rougir en nommant le type, le thème ET la surface (2,87:1 clair
        # sur --card, 2,74 sur --background, et rien en sombre — `--chart-3` s'y comporte bien,
        # ce qui est exactement le piège du « vérifié dans un seul thème ») ; remettre les CINQ
        # rend 12 défauts, le compte même du ticket. L'auto-épreuve refuse par ailleurs qu'on
        # abaisse le seuil à 3, qu'on retire un thème ou une surface, et qu'on lise les
        # commentaires — le docblock de la table CITE la recette interdite pour l'expliquer.
        run: node scripts/check-profile-badge-contrast.mjs --report
      - name: Aucune encre héritée ne rend un descendant illisible
        # TCK-471. `bg-foreground text-background` retourne DEUX PROPRIÉTÉS, pas les jetons : un
        # descendant qui tire son fond d'une variante (`outline` → `bg-background`) hérite de
        # l'encre du conteneur et peint du #fcf9f3 sur du #fcf9f3. **Contraste 1,00:1** sur le
        # bouton « Déverifier » de la fiche agence — le bouton occupait sa place, réagissait au
        # survol, se cliquait, et son libellé n'existait visuellement pas.
        #
        # ⚠ Ce défaut ne se voit qu'en thème CLAIR, qui est le thème de tout le monde : sous une
        # portée `.dark` les jetons basculent et le libellé réapparaît. La seule condition qui le
        # révèle est la condition normale, et c'est pourquoi il a survécu.
        #
        # La garde part du MOTIF, jamais de cette ligne-là : tout conteneur qui pose le couple et
        # contient un descendant dont le fond vient d'une variante. Elle a d'ailleurs trouvé une
        # seconde occurrence que le ticket disait unique (`TwoFactorSection.tsx`, 3,94:1).
        run: node scripts/check-heritage-encre.mjs --report

      - name: La couleur d'un statut se décide en un seul endroit
        # TCK-472. `console/StatusBadge.tsx` ouvrait sur « le seul endroit du dépôt où la couleur
        # d'un statut est décidée ». Ils étaient NEUF, et trois portaient le nom `StatusBadge`
        # sans être celui-là — dans un fichier qui définit son propre homonyme, `<StatusBadge …>`
        # résout vers le local, et ni le typage ni le lint ne le signalent.
        #
        # ⚠ Le relevé qui aurait dû les trouver ne le POUVAIT pas : l'AC3 de TCK-450 partait des
        # fichiers qui IMPORTENT le canonique. Un homonyme local n'importe rien, il est invisible
        # par construction. *Un relevé qui part des importateurs ne voit jamais les doublons — il
        # ne voit que les usages corrects.* Cette garde part des DÉFINITIONS et des LITTÉRAUX.
        #
        # Son contrôle C est un cliquet à DEUX SENS : un fichier de plus est un doublon neuf, un
        # fichier de moins est une entrée périmée — et une liste périmée est exactement ce dont ce
        # ticket est né.
        run: node scripts/check-status-badge-unique.mjs --report
      - name: Aucun refus par `forbidden()` tant que authInterrupts est désactivé
        # TCK-167 avait retiré `forbidden()` de six pages, posé `assertCanReachAgentArea` et
        # décidé en AC3 que `experimental.authInterrupts` ne serait pas activé. Les trois points
        # tenaient encore le 2026-08-27 — mais RIEN NE LES REJOUAIT : le quatrième point de son
        # delta, un e2e des six routes, n'a jamais été fait faute de harnais. Trois pages écrites
        # après (TCK-042, TCK-083, TCK-266) ont donc réintroduit l'appel, chacune de bonne foi,
        # et l'une d'elles portait un docblock affirmant « les autres tombent en 403 ».
        #
        # Ils n'y tombaient pas. Mesuré PAR EXÉCUTION du module installé : sans le drapeau,
        # `forbidden()` lève `E488`, la frontière `(dashboard)/error.tsx` l'attrape, et
        # l'utilisateur non autorisé reçoit « une erreur est survenue » avec un bouton
        # « réessayer » qui relèvera la même erreur. *Un refus n'est pas une panne.*
        #
        # La garde s'auto-éprouve à chaque invocation — 34 formes de source (alias, import
        # multiligne, `import * as`, réexport, crochets, espace avant la parenthèse…) et 10
        # décisions synthétiques — parce que le mode d'échec d'une garde n'est pas de rougir à
        # tort, c'est de CESSER DE MATCHER. Vérifiée par ablation ET par 21 mutations de son
        # propre code (TCK-378, AC5).
        run: node scripts/check-auth-interrupts.mjs --report

      - name: Les compétences des agents vivent dans un seul répertoire
        # `.agent/` (646 fichiers) et `.agents/` (602) coexistaient, et les quatre points d'entrée
        # du dépôt désignaient `.agent/`. Le 2026-05-18, la correction « `spatie/laravel-permission`
        # a été retiré » a été écrite dans `.agents/` — la copie que personne ne charge. Elle était
        # juste, et elle n'a atteint `.agent/` que le 2026-08-15 : pendant trois mois, chaque agent
        # a lu qu'il fallait utiliser un paquet désinstallé sur lequel `api-ci` casse à l'import.
        #
        # Rien ne pouvait le signaler — un répertoire mort ne produit aucune erreur, il absorbe.
        # La garde vérifie l'UNICITÉ (aucune compétence non préfixée hors de `.agent/skills/`) et
        # la NON-VACUITÉ (le canonique porte bien les deux compétences que les points d'entrée
        # citent), parce qu'« aucune copie parasite » n'est pas « la bonne copie » (TCK-303, D-46).
        run: node scripts/check-skills-dir.mjs --report
      - name: Tout modèle de premier niveau est mentionné dans models-spec.md
        # `docs/models-spec.md` est DÉSIGNÉ source de vérité data. Mesuré le 2026-08-16 : 16 de
        # ses 62 modèles n'y étaient mentionnés nulle part — RoleDelegation, WizardDraft,
        # ThresholdAlert, WelcomeView… tous en base et en code depuis des mois.
        #
        # Ce n'est pas un trou de documentation, c'est une NÉGATION : dans un document qui prétend
        # couvrir le domaine, l'absence d'un modèle se lit « à créer », pas « non documenté ». La
        # passe de synchronisation 009 en a d'ailleurs fait la démonstration en 2026-05, en
        # recommandant d'ajouter deux modèles avec des colonnes qu'elle avait DÉDUITES de leur nom
        # — aucune n'existait dans la migration.
        #
        # ⚠ La garde écrit sa propre portée dans sa sortie : elle vérifie qu'un NOM apparaît, pas
        # qu'il est bien décrit. C'est un cliquet contre la régression franche, pas une mesure de
        # qualité (dette D-23 : chercher un jeton ne mesure pas une propriété).
        run: node scripts/check-models-spec.mjs --report
      - name: L'enveloppe de pagination se construit en un seul endroit
        # Mesuré le 2026-08-17, avant convergence : **57 contrôleurs et 1 service** recopiaient la
        # forme à la main, et les jeux de clés divergeaient — `total` 88 occurrences,
        # `current_page` 67, `last_page` 51, `->perPage()` 40. Un tiers des endpoints émettait
        # `total` sans `per_page`. Un client de l'API ne pouvait donc pas lire la pagination de la
        # même façon d'un endpoint à l'autre : il devait la DÉCOUVRIR endpoint par endpoint.
        # `takussan-web/src/types/api.ts` déclarait d'ailleurs `links` OBLIGATOIRE quand 52 des 57
        # ne l'émettaient pas — et l'helper de test `assertJsonStructurePaginated` l'exigeait
        # aussi, ce qui explique qu'aucun test ne l'appelait : il aurait rougi partout.
        #
        # La dette grossissait à la vitesse à laquelle on écrit des contrôleurs — 44 fichiers au
        # 2026-08-12 (ardoise D-31), 58 quatre jours plus tard. `takussan-api/CLAUDE.md` tranchait
        # déjà pour le code neuf, et n'a rien freiné : une convention qui n'existe que dans un
        # document est lue une fois, par ceux qui la respectaient déjà (TCK-304).
        #
        # ⚠ La garde écrit sa portée dans sa sortie : elle interdit de RECONSTRUIRE l'enveloppe,
        # elle ne vérifie pas que chaque liste l'émet. Un endpoint qui ne pagine pas du tout la
        # satisfait — c'est un cliquet contre la ré-divergence, pas une preuve de couverture.
        #
        # Déclencheurs : `takussan-api/app/**` (ce qu'elle balaye) et `scripts/**` (elle-même)
        # sont déjà dans les deux blocs `paths` ci-dessus. Rien à ajouter, et c'est vérifié —
        # une garde déclenchée d'un seul côté ne voit qu'une moitié de l'écart qu'elle cherche.
        run: node scripts/check-pagination-envelope.mjs --report

      - name: Aucun contrôleur ne valide en ligne
        # Mesuré le 2026-08-17 avant convergence : **120 `$request->validate()` inline** dans
        # 58 contrôleurs, **511 champs de règles**, face à 74 classes FormRequest. Deux conventions
        # pour le même geste, et rien qui arbitre : une contrainte métier ne pouvait pas être revue
        # sans d'abord chercher laquelle des deux l'endpoint avait retenue.
        #
        # `takussan-api/CLAUDE.md` tranchait DÉJÀ pour le code neuf, et le compte a continué de
        # monter — comme pour l'enveloppe de pagination, deux gardes plus haut. *Une convention qui
        # n'existe que dans un document est lue une fois, par ceux qui la respectaient déjà.*
        #
        # La garde interdit QUATRE orthographes, pas une. La convergence a trouvé une troisième
        # forme que le compte de 120 ne voyait pas — `validator([...], [...])->validate()` sur un
        # tableau reconstruit à la main — et c'était exactement l'échappatoire par laquelle on
        # aurait pu la contourner sans jamais mentir (TCK-305).
        #
        # ⚠ La garde écrit sa portée dans sa sortie : elle interdit de valider DANS un contrôleur,
        # elle ne vérifie pas qu'un endpoint valide quoi que ce soit. Un contrôleur qui ne valide
        # rien la satisfait — cliquet contre la ré-divergence, pas mesure de couverture (D-23).
        run: node scripts/check-inline-validation.mjs --report

      - name: Aucun contrôleur ne définit sa propre règle d'autorisation
        # Mesuré le 2026-08-17 : **25 contrôleurs** définissaient chacun leur `authorizeAccess()` /
        # `authorizeManage()` — **88 appels** — avec la même logique copiée-collée. La règle
        # « propriétaire, périmètre d'agence, ou super-admin » était recopiée DIX fois pour le seul
        # modèle `Property`, sous trois formes syntaxiques différentes.
        #
        # C'est le lot où une divergence ne rougit pas : elle ouvre une porte. Deux exemples
        # mesurés, invisibles tous les deux : `DocumentController::authorizeManage()` autorisait le
        # seul téléverseur quand `DocumentVersionController::authorizeManage()`, sur le MÊME modèle,
        # autorisait aussi l'agence ; et un commentaire annonçait « Mirrors
        # DocumentController::authorizeUpload() » sur sept branches recopiées — un commentaire qui
        # annonce une duplication ne la corrige pas, il vieillit avec elle.
        #
        # La garde cherche une FORME, pas deux noms — et c'est ainsi qu'elle a trouvé 19 helpers de
        # plus, sous 19 noms différents, que l'inventaire du ticket (« authorizeAccess ou
        # authorizeManage ») ne pouvait pas voir. Ils sont hors périmètre de TCK-306 et inscrits
        # dans EXEMPTIONS_JUSTIFIEES : la dette devient comptable au lieu d'être invisible.
        #
        # ⚠ La garde écrit sa portée dans sa sortie : elle interdit de DÉFINIR une règle dans un
        # contrôleur, elle ne vérifie pas qu'un endpoint autorise quoi que ce soit (dette D-23).
        run: node scripts/check-controller-authorization.mjs --report

      - name: Aucune surface authentifiée n'est cacheable par un cache partagé
        # TCK-341. `Cache-Control: public` autorise un CDN ou un reverse proxy à
        # stocker une réponse et à la resservir à quelqu'un d'autre. Sur une route
        # authentifiée, cela ne produit ni erreur ni ralentissement — cela produit la
        # réponse d'un utilisateur servie à un autre, et rien dans le code applicatif
        # ne peut le voir.
        #
        # Un test seul ne suffit pas, et c'est le motif exact de cette garde : le
        # défaut ne s'introduit pas en ajoutant un en-tête de cache, il s'introduit en
        # ajoutant `auth:sanctum` autour d'un groupe qui en portait déjà un — le
        # fichier modifié n'est alors même pas celui qui porte le `public`, et la route
        # continue de répondre exactement ce qu'on lui demande.
        #
        # Elle regarde les DEUX formes, parce que la seconde est la seule employée
        # aujourd'hui : le middleware `cache.headers:…public…`, ET les
        # `->header('Cache-Control', 'public, …')` posés à la main dans un contrôleur —
        # ceux-là, aucune lecture d'un fichier de routes ne peut les voir. Le
        # rattachement se fait méthode par méthode : `PublicPropertyController` sert à
        # la fois `discovery` (qui émet `public`) et `booking-request` (sous
        # `auth:sanctum`), et les confondre la rendrait rouge à tort dès son premier
        # jour.
        #
        # ⚠ Elle écrit sa portée dans sa sortie : elle refuse le COUPLE (cache partagé,
        # authentification). Elle ne dit PAS qu'une réponse `public` non authentifiée
        # est sûre — mesuré le 2026-08-21, la fiche publique varie avec un porteur
        # Bearer sans porter le moindre `auth:` (`ResolveActiveProfile` le propage au
        # garde par défaut, TCK-179). Cette variance-là se prouve en comparant deux
        # corps : `tests/Feature/Public/CataloguePublicCacheTest.php`.
        run: node scripts/check-cache-headers-auth.mjs --report

      - name: Le filtrage passe par un seul mécanisme
        # `BaseModelTrait::scopeFilter(Builder, array)` coexistait avec spatie/laravel-query-builder
        # sur les MÊMES modèles — `AbstractModel` compose les deux traits, donc les 68 modèles qui
        # en héritent portaient les deux. Mesuré le 2026-08-17 : ZÉRO appelant dans tout le dépôt,
        # contre 46 `buildQuery()` dans les seuls contrôleurs. Son unique usage était le test qui
        # le testait (TCK-307).
        #
        # Le coût n'était pas les dix-neuf lignes, c'était l'AMBIGUÏTÉ : deux mécanismes également
        # disponibles sur le même modèle ne se lisent pas « un vivant et un mort », ils se lisent
        # « deux conventions, choisis ». Qui prenait le mauvais écrivait du code qui MARCHAIT et
        # qui sortait du contrat de lecture — pas de sparse fieldsets, pas d'`include=`, pas de
        # routage Scout, pas de tri déclaré.
        #
        # La garde a trois contrôles et le dit dans sa sortie : la non-vacuité (elle rougit si elle
        # ne trouve plus sa cible — c'est le mode de défaillance qui rend une garde muette), le NOM
        # (un cliquet, dette D-23), et la FORME — un scope à paramètre `array` qui déroule des
        # `where()` en boucle, qui survit à un renommage. Elle ne couvre PAS le filtrage ad hoc en
        # contrôleur : il y en a par choix assumé (TCK-281, « Hors périmètre »), et une garde qu'on
        # ne peut pas rendre verte n'est pas une garde.
        run: node scripts/check-filtering-single-mechanism.mjs --report
      - name: Toute ressource API étend BaseResource
        # `BaseResource` existe depuis TCK-048 et `takussan-api/CLAUDE.md` tranche pour le code neuf
        # depuis. Mesuré le 12/08, le 16/08 puis le 17/08 : 7, 7 puis 8 ressources sur 44
        # l'étendaient. Une dette qui ne bouge pas d'un pouce en quatre jours n'est pas violée par
        # malveillance — elle est INVISIBLE au moment d'écrire le fichier suivant, parce que
        # `extends JsonResource` est ce que rendent l'IDE, `artisan make:resource` et les 36 fichiers
        # voisins. Une convention sans garde ne converge pas, elle stagne (D-36, TCK-308).
        #
        # La migration des 36 a été un ÉCHANGE DE PARENT et rien d'autre — 72 insertions, 72
        # suppressions, deux lignes par fichier, aucun corps de `toArray()` touché. C'est ce qui la
        # rend sûre sur le point le plus cher du dépôt : `BaseResource` n'offre AUCUN helper de
        # montant, il ne peut donc pas en changer la représentation (principe n°3 — XOF n'a pas de
        # sous-unité). `tests/Unit/Http/Resources/AmountRepresentationTest.php` fige ce point pour
        # l'avenir, et il a été vérifié par ablation.
        #
        # ⚠ La garde couvre l'HÉRITAGE, pas l'EMPLOI. L'emploi des helpers de DATE est gardé par
        # l'étape suivante depuis TCK-327 ; celui des trois autres (`enumValue`, `enumLabel`,
        # `mediaUrl`) ne l'est toujours pas.
        run: node scripts/check-resources-extend-base.mjs --report

      - name: Toute date d'API passe par BaseResource (ADR-0018)
        # Mesuré le 2026-08-20, AVANT conversion : 138 lignes de `app/Http/Resources/` émettaient
        # une date sous QUATRE appels distincts pour TROIS chaînes distinctes — 55 `toISOString()`
        # (`…T12:34:56.000000Z`), 37 `toIso8601String()`, 28 `$this->iso(…)` et 18
        # `toDateString()`. Les trois cohabitaient parfois dans le même fichier.
        #
        # Le défaut n'était pas cosmétique : `PlatformPayout::period_start` est casté `date` — une
        # période comptable, sans heure — et sortait en `2026-08-17T00:00:00+00:00`, quand les DEUX
        # autres ressources portant le même couple de champs sur le même cast sortaient
        # `2026-08-17`. Le même concept, le même cast, deux contrats.
        #
        # ⚠ C'est le profil exact de la RÉGRESSION SILENCIEUSE DES DEUX CÔTÉS : les trois formes
        # sont des `string`, `new Date(…)` les parse toutes, aucun typage TypeScript ne les
        # distingue, aucun lint du front ne s'en émeut. Un test seul ne suffit pas — il ne couvre
        # que les champs qu'on a pensé à lui donner. La garde, elle, lit TOUS les fichiers ; le test
        # (`tests/Unit/Http/Resources/DateRepresentationTest.php`) connaît la valeur. Les deux.
        #
        # Prouvée par mutation, y compris le cas où elle perd sa cible : dossier renommé, arbre
        # fondu à 3 fichiers, helper renommé, `->utc()` retiré. Ce dernier l'a laissée VERTE à la
        # première tentative — le docblock d'`iso()` cite `->utc()` et satisfaisait le motif. Elle
        # dénude désormais les commentaires avant de lire.
        run: node scripts/check-resource-date-format.mjs --report
      - name: Aucun document normatif ne cite un chemin markdown mort
        # `models-spec.md` a cité `docs/claude-code-prompt-notifications.md` — JAMAIS ÉCRIT — assez
        # longtemps pour qu'on finisse par annoter la citation « *(jamais écrit — pointeur mort)* »
        # au lieu de la retirer. L'ardoise (D-19) en dénombrait cinq ; la re-mesure du 2026-08-16
        # n'en a trouvé qu'un : la dette avait fondu de 5 à 1 sans que personne ne l'écrive, faute
        # de quoi que ce soit qui la mesure. Un pointeur mort ne se signale jamais tout seul.
        #
        # ⚠ La garde est HONNÊTE SUR SON PÉRIMÈTRE et l'imprime : les documents NORMATIFS, pas tout
        # `docs/`. Les 269 chemins morts de `_archive/INDEX-manuel-2026-08-12.md` et ceux des
        # `sync-passes/` sont des FAITS D'HISTOIRE dans des archives gelées à dessein — les
        # « corriger » falsifierait la pièce. Une garde qu'on ne peut pas rendre verte n'est pas
        # une garde, c'est un bandeau d'avertissement de plus.
        run: node scripts/check-doc-links.mjs --report

      - name: features-by-actor.md est à jour de features.md
        # Ce fichier se déclarait « vue miroir de features.md » et était maintenu À LA MAIN : il a
        # gelé au 2026-04-14 pendant que sa source évoluait six fois. C'est D-15 à l'identique,
        # celui qui a rendu INDEX.md faux sur 213 de ses 266 entrées. Il est désormais DÉRIVÉ, et
        # `--check` échoue s'il ne suit plus sa source (TCK-311).
        run: node docs/gen-features-by-actor.mjs --check

      - name: Les guides de déploiement ne contredisent pas les `.env` livrés
        # `docs/configuration.md` donnait TROIS réponses au même sujet : sa ligne 422 affirmait
        # « la production tourne en CACHE_STORE=database », sa checklist §5.7 prescrivait
        # `CACHE_STORE=redis`, et les deux `.env` livrés déclarent `redis`. Le défaut n'est pas
        # qu'une des trois soit fausse — c'est qu'il y en ait trois : une valeur recopiée dans
        # trois documents diverge au premier changement, et rien ne le signale.
        #
        # `docs/infra/prod-drivers.json` est la source unique. La garde confronte la checklist
        # §5.7 (dans le dépôt, donc bloquante) et les `.env` livrés (hors dépôt, absents du
        # runner, donc signalés sans bloquer) — elle ne peut pas garantir ce que le dépôt ne
        # contient pas (TCK-300).
        run: node scripts/check-prod-drivers.mjs --report

      - name: INDEX.md est à jour de ses frontmatters
        # `--check` n'écrit rien et sort non nul si l'index est périmé. Sans cette étape, la règle
        # « on régénère après avoir touché un ticket » redeviendrait tenue par la seule discipline
        # — celle qu'on vient précisément de retirer.
        run: node docs/backlog/gen-index.mjs --check

      - name: Les statuts des tickets ne sont pas contredits par git
        # L'étape précédente garantit que la SORTIE suit la SOURCE. Celle-ci garantit que la
        # SOURCE suit la RÉALITÉ : pointeur cité qui n'existe plus, dépendance incohérente, date
        # impossible, statut ouvert sur du code déjà mergé. La première ne peut rien voir de la
        # seconde — elle compare deux fichiers, elle ne regarde jamais le dépôt.
        #
        # `--report` fait ÉCRIRE au script la référence git sur laquelle il a confronté les
        # statuts. Sans elle, une exécution verte prouve seulement qu'aucune erreur n'a été
        # levée — il faut alors RAISONNER pour conclure que la confrontation a eu lieu. Avec
        # elle, le journal le montre. (`--report` ajoute de la sortie, il ne désarme pas la
        # garde : le script sort toujours en 1 sur une incohérence.)
        run: node docs/backlog/check-backlog.mjs --report

      - name: Les versions d'infrastructure disent la vérité, y compris sur ce qu'on ignore
        # Même famille que `check-db-engine`, un cran plus haut : celle-ci garde TOUTES les versions
        # de service, et surtout la colonne « production ».
        #
        # Mesuré le 2026-08-16 (TCK-298) : développement et CI sont épinglés des deux côtés, la
        # PRODUCTION ne l'est nulle part dans le dépôt. `scripts/server-setup.sh` n'installe rien —
        # il lit `php -v` et imprime la commande à lancer à la main — et le seul document qui nomme
        # une installation est un guide (`apt install meilisearch`, sans version) que personne ne
        # peut dater. C'est la mécanique de D-43 à l'identique : ce qu'un guide prescrit n'est pas
        # ce qu'une machine exécute.
        #
        # La garde refuse donc une valeur de production qui ne cite pas sa mesure, ET refuse de
        # laisser combler la colonne avec une version plausible. « Non mesuré + la commande qui le
        # mesurerait » est une réponse valable ; « probablement 8.4 » ne l'est pas.
        #
        # `--report` imprime le tableau dev/CI/prod dans le journal : une exécution verte MONTRE
        # alors ce qui a été confronté, au lieu de le laisser déduire.
        run: node scripts/check-infra-versions.mjs --report

      - name: Carte d'impact — structure et fraîcheur
        run: node scripts/check-impact-map.mjs --report

      # ── TCK-309 — trois conventions qui avaient chacune DEUX emplacements également
      # plausibles. Elles sont regroupées ici parce qu'elles sont de même nature, et pas
      # parce qu'elles se touchent : quand deux endroits sont aussi défendables l'un que
      # l'autre, le désordre ne stagne pas, il se REPRODUIT — le suivant lit le partage
      # comme un précédent, et il n'existe aucun signal pour l'en dissuader.

      - name: Il n'y a qu'une classe de base de test par usage
        # Trois classes coexistaient EN CHAÎNE — `Tests\TestCase` → `Tests\BaseTestCase` →
        # `Tests\ApiTestCase` — sans qu'aucun document ne dise laquelle étendre (D-37). Le
        # maillon du milieu n'avait pas d'usage propre : ses helpers ne servaient rien de
        # particulier aux tests non-API. Le partage qui en résultait ne suivait donc AUCUNE
        # règle, seulement l'ordre d'écriture — 49 classes d'un côté, 38 de l'autre.
        #
        # La garde refuse une quatrième base, et refuse `Illuminate\Foundation\Testing\TestCase`
        # en direct : celui-là contourne la coupure de synchronisation Scout de
        # `Tests\TestCase::setUp()`, et le contournement est MUET — le test passe, et c'est la
        # suite entière qui bascule au hasard plus tard (D-44).
        run: node scripts/check-test-base-classes.mjs --report

      - name: Aucune commande ne porte le nom du produit en préfixe
        # `takussan:create-super-admin` était le SEUL `takussan:` sur 16 commandes ; les 15
        # autres portent un préfixe de DOMAINE (D-38). `takussan:` n'en est pas un — c'est le
        # nom du dépôt, et tout ce qui est ici lui appartient : le préfixe ne partitionne rien.
        #
        # La garde tolère UN alias déprécié, nommément, parce que `docs/features.md` §2.1
        # prescrit encore l'ancien nom à l'installation d'un environnement. Elle rougit dans
        # les DEUX sens : si le préfixe revient en `$signature`, et si l'alias déclaré
        # disparaît du code — sans quoi le retirer par mégarde casserait un appelant hors du
        # code, un jour de déploiement, en silence.
        run: node scripts/check-command-prefixes.mjs --report

      - name: L'authentification vit dans un seul namespace
        # `Controllers\Auth\` (8 fichiers) et `Controllers\Api\Auth\` (5) servaient la même
        # surface `api/auth/*`, câblée depuis le même unique `routes/api/auth.php`, sans
        # qu'aucune règle n'ait jamais été écrite (D-40).
        #
        # La garde contrôle les DEUX bouts : aucun namespace `…\Auth` ailleurs, ET tout
        # contrôleur câblé par `routes/api/auth.php` sous le namespace retenu. Le second
        # attrape ce que le premier ne peut pas voir — un contrôleur d'auth posé à la racine,
        # sans le mot `Auth` dans son namespace.
        #
        # ⚠ Elle ne prouve PAS que les URLs n'ont pas bougé, et elle l'écrit dans sa sortie :
        # cela demande de démarrer l'application. C'est `php artisan route:list` avant/après
        # qui l'a prouvé au déplacement — 516 routes, diff vide.
        run: node scripts/check-auth-controller-namespace.mjs --report

      - name: Les déclencheurs durs du sélecteur d'impact sont documentés tels qu'ils sont codés
        # La liste des chemins qui imposent la SUITE ENTIÈRE est définie dans trois constantes
        # d'`ImpactSelector` et recopiée à la main dans `takussan-api/CLAUDE.md`. Elle avait déjà
        # dérivé le JOUR OÙ ELLE A ÉTÉ ÉCRITE — `composer.json` manquait à la copie — et c'est une
        # revue de code qui l'a vu. Le fichier a ensuite porté l'aveu « rien ne la garde » : honnête,
        # et sans effet sur le déclencheur suivant.
        #
        # Les deux sens ne coûtent pas pareil, d'où l'égalité stricte : un déclencheur absent de la
        # doc fait perdre du temps ; un chemin documenté que le code ne déclenche PAS fait croire à
        # une escalade qui n'a pas lieu — `impacted-tests.php` rend alors un vert qui ne prouve
        # rien, la panne exacte que TCK-320 existe pour rendre impossible. `INERT_PREFIXES` est
        # couverte au même titre : c'est la seule dont un ajout non documenté fabrique ce faux vert.
        #
        # ⚠ La garde compare des ENSEMBLES de chemins, jamais la prose qui les entoure, et elle
        # échoue DUR si une constante devient introuvable — une garde qui passe parce qu'elle ne
        # trouve plus sa cible est pire qu'aucune garde (TCK-325).
        run: node scripts/check-impact-triggers.mjs --report

      - name: Aucune dépendance de développement n'est atteignable depuis le code de production
        # Le défaut ne vit dans aucun fichier : `deploy.sh` installe en `--no-dev` (juste),
        # `PaymentReceiptPdf` faisait `new Dompdf(…)` (du PHP valide), et `dompdf/dompdf` n'est
        # déclaré NULLE PART dans `composer.json` — il n'arrivait qu'en dév et TRANSITIVEMENT, par
        # les `require-dev` de `phpoffice/phpspreadsheet` et `spatie/laravel-pdf`. Le reçu de
        # paiement rendait donc 500 sur tout environnement déployé, et vert en local.
        #
        # ⚠ AUCUN TEST NE PEUT VOIR ÇA, et c'est le point : la suite tourne avec les dépendances
        # de dév installées. Seule une lecture de `composer.lock` distingue « disponible ici » de
        # « livré ». Vérifiée par ablation le 2026-08-24 : remise dans l'état d'avant, elle rougit
        # en nommant `app/Services/Payments/PaymentReceiptPdf.php` et ses deux lignes d'import.
        #
        # ⚠ Elle ne lit que les `use` de portée fichier. Un `new \Dompdf\Dompdf` en dur lui
        # échappe — c'est un PLANCHER, elle attrape la forme qui a coûté, pas toutes les formes.
        run: node scripts/check-deps-dev-atteignables.mjs --report

      - name: Aucune tête de branche n'éteint la CI, et le frein anti-boucle est lu des deux côtés
        # ⚠ LIRE LA PORTÉE AVANT DE CROIRE CE VERT (TCK-479). Ce step porte DEUX contrôles qui
        # ne valent pas la même chose ici :
        #
        #   · le contrôle B — le marqueur `[carte-impact]` qu'`api-ci.yml` COMMITE est bien
        #     celui que ses conditions `if:` LISENT — s'exerce pleinement. C'est lui qui garde
        #     le remède : les deux côtés divergent en silence, et la boucle de régénération
        #     repart un dimanche.
        #
        #   · le contrôle A — la tête ne porte pas le marqueur d'exclusion global de GitHub —
        #     est VERT PAR CONSTRUCTION quand il tourne ici. Le défaut supprime son propre
        #     détecteur : une tête marquée saute TOUS les workflows, Repo CI compris, et ce
        #     step n'est jamais exécuté. Aucun événement `push` ni `pull_request` ne peut voir
        #     ce cas — le câbler ailleurs n'y changerait rien.
        #
        # Il reste ici pour le contrôle B, et parce qu'un vert qui explique ce qu'il ne prouve
        # pas vaut mieux qu'un vert muet. Le contrôle A s'exerce, lui, AVANT le push : dans le
        # rituel `for g in scripts/check-*.mjs` de CLAUDE.md, et sur la tête distante avant
        # d'ouvrir une PR d'intégration —
        #   git fetch origin dev && node scripts/check-skip-ci-marker.mjs --tete origin/dev
        run: node scripts/check-skip-ci-marker.mjs --report
