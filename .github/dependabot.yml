# Dependabot — où sont réellement les manifestes de ce dépôt.
#
# ## Pourquoi ce fichier existe
#
# Mesuré le 2026-08-16 : le tableau de bord GitHub affichait **3 alertes** (1 haute,
# 2 modérées) là où `npm audit` en trouvait **23** — 5 dans `takussan-api` (dont 2
# CRITIQUES : `shell-quote`, `concurrently`) et 18 dans `takussan-web` (11 hautes,
# dont `next` lui-même). Un écart de 3 contre 23 n'est pas un retard d'indexation,
# c'est un angle mort.
#
# Les trois alertes visibles portaient `manifest_path: "package.json"` — un chemin NU.
# Or **aucun `package.json` n'a jamais existé à la racine** de ce dépôt
# (`git log --all -- package.json` ne rend rien). Les manifestes réels sont
# `takussan-api/package.json` et `takussan-web/package.json`. Les alertes étaient donc
# ancrées sur un fichier inexistant : Dependabot ne pouvait ni les réévaluer, ni les
# fermer quand la dépendance a été corrigée. Créées les 2026-04-07 et 2026-06-20, elles
# n'avaient jamais été mises à jour depuis.
#
# ⚠️ **Et elles disaient vrai à moitié, ce qui est le pire cas.** Leur plage affichée
# (`vite <= 6.4.2`) faisait croire à un faux positif, puisque le dépôt tourne sur vite 8.
# `npm audit` a montré qu'il existe une plage PARALLÈLE, `8.0.0 - 8.0.15`, et que la
# version installée y tombait. *Lire l'avis ne remplace pas mesurer l'arbre de
# dépendances* — c'est la règle maison « ne jamais déduire l'état d'une chose de la
# documentation qui la décrit », appliquée aux avis de sécurité.
#
# ## Ce que ce fichier change, et ce qu'il ne change pas
#
# Il déclare les quatre écosystèmes réels, chacun à son emplacement. Les alertes futures
# seront ancrées sur des manifestes qui existent, donc réévaluables et refermables.
#
# Il ne remplace PAS une vérification périodique : `npm audit` reste la mesure de
# référence, et il voit ce que le tableau de bord n'a pas vu. Cf. ardoise D-00 et D-53.

version: 2
updates:
  # ── Backend PHP ────────────────────────────────────────────────────────────
  - package-ecosystem: composer
    directory: /takussan-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # ── Chaîne d'assets du backend (Vite/Tailwind pour `welcome.blade.php`) ─────
  # Petite mais réelle : c'est ici que vivaient les deux vulnérabilités CRITIQUES
  # (`shell-quote` via `concurrently`), dans des devDependencies que le déploiement
  # installe pourtant, puisque `deploy.sh` lance `npm ci` puis `npm run build`.
  - package-ecosystem: npm
    directory: /takussan-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /takussan-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # `next`, `eslint-config-next` et `@next/*` se montent ENSEMBLE ou pas du tout :
      # les monter séparément produit un état intermédiaire qui ne compile pas.
      next:
        patterns:
          - next
          - eslint-config-next
          - '@next/*'

  # ── Actions GitHub ─────────────────────────────────────────────────────────
  # Une action épinglée sur une version obsolète est une dépendance comme une autre,
  # et elle s'exécute avec les secrets du dépôt.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
