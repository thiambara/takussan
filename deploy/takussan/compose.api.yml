# Pile d'API Takussan d'UN environnement — préproduction ou production —, déployée par Dokploy
# (ADR-0028 §5). Le même fichier sert les deux : seuls l'onglet Environment de Dokploy (écrit en
# .env à côté de ce fichier) et IMAGE_TAG changent.
#
# ⚠ Les commandes `queue:work` s'écrivent en CHAÎNES, sur UNE ligne : scripts/check-queues.mjs
# les lit ligne à ligne. Une forme en tableau, ou repliée sur plusieurs lignes, la rendrait
# aveugle.
#
# Le domaine n'est pas ici : Dokploy pose les labels Traefik du service `api` (port 8080) — et de
# `temps-reel` (port 8080 aussi, TCK-2956) — depuis son onglet Domains. `container_name` est
# interdit : Dokploy nomme les conteneurs.
#
# ── DEUX RÉSEAUX (ADR-0069 § 4, TCK-880) ─────────────────────────────────────────────────────────
#
# `dokploy-network`, partagé par toutes les piles du serveur : Traefik, PostgreSQL, Meilisearch, et
# le front, qui joint l'API sous `${API_ALIAS}` (`takussan-api-preview`, `takussan-api-production`)
# — JAMAIS sous `api`, que Compose donne à chaque service de chaque pile sur chaque réseau : avec
# deux environnements, `api` désignerait les deux API. scripts/check-reseau-par-environnement.mjs
# refuse une URL vers l'hôte `api` dans la configuration et la documentation de déploiement.
#
# `interne`, propre à la pile : son Redis n'est que là, sans port publié, avec le mot de passe de
# l'environnement (`REDIS_PASSWORD`). Aucun conteneur d'un autre environnement ne peut le joindre ;
# le Redis partagé `redis-takussan` mêlait cache et sessions de la préproduction et de la production.
# `REDIS_HOST` et `REDIS_PORT` sont écrits ICI, et non dans l'onglet Environment : ce sont des faits
# de la pile, pas des réglages, et `environment` l'emporte sur `env_file`. Une valeur restée dans
# Dokploy est donc sans effet — smoke-api.sh le prouve avec une valeur fausse dans son `.env`.
#
# ── LE TEMPS RÉEL : `temps-reel` (ADR-0129 § 5, TCK-2956) ─────────────────────────────────────────
#
# Le serveur WebSocket Reverb, sur l'image de l'API. Il est sur `dokploy-network` parce que Traefik
# doit le joindre (le navigateur y arrive par un sous-domaine en wss, docs/infra/hebergement.md) — et
# c'est ce qui rend son nom de service ambigu : sur ce réseau, `temps-reel` désigne le Reverb de
# CHAQUE environnement, exactement comme `api`. L'API publie donc ses signaux sous l'alias
# `${API_ALIAS}-temps-reel` (`takussan-api-preview-temps-reel`, `takussan-api-production-temps-reel`),
# DÉRIVÉ d'API_ALIAS : aucune clé de plus à poser dans Dokploy, aucun déploiement qui échoue faute
# d'elle. `REVERB_HOST`, `REVERB_PORT` et `REVERB_SCHEME` sont écrits ici, sur le patron de
# `REDIS_HOST` : un fait de la pile, que l'onglet Environment ne peut pas détourner vers l'autre
# environnement. scripts/check-reseau-par-environnement.mjs refuse `temps-reel` seul comme hôte et
# exige l'alias. Les identifiants `REVERB_APP_*` viennent du MÊME `.env` pour l'API qui signe et le
# serveur qui vérifie : ils ne peuvent pas diverger.

x-api: &api
  image: ghcr.io/thiambara/takussan-api:${IMAGE_TAG:?IMAGE_TAG manquant}
  pull_policy: always
  env_file: .env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # TCK-2956 — la publication de serveur à serveur, vers le Reverb de CETTE pile (cf. l'en-tête). Le
    # navigateur, lui, passe par le sous-domaine en wss (TEMPS_REEL_URL du front).
    REVERB_HOST: ${API_ALIAS:?API_ALIAS manquant — takussan-api-preview ou takussan-api-production}-temps-reel
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  restart: unless-stopped
  volumes:
    - storage:/app/storage/app
  networks:
    - dokploy-network
    - interne

# ⚠ Une clé présente dans DEUX ancres fusionnées garde la valeur de la PREMIÈRE (`<<: [*api, …]`) :
# `depends_on` ne vit donc que dans celle-ci, jamais dans `x-api`.
x-apres-release: &apres-release
  depends_on:
    release:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  # Migrations, réconciliation des rôles, Meilisearch. Les autres services attendent son SUCCÈS
  # pour DÉMARRER — et c'est tout ce que `depends_on` garantit. ⚠ Un seul `up -d --build` ne
  # laisse PAS l'ancienne version servir quand release échoue : Compose retire l'ancien `api` et
  # crée le neuf AVANT de lancer release, et le neuf reste « Created » (mesuré le 2026-09-14,
  # TCK-522 : `/up` → `000`). D'où la commande de déploiement en deux temps, posée dans le champ
  # « Command » du service Compose de Dokploy (runbook, hebergement.md) et rejouée par
  # smoke-api.sh : `run --rm release && up -d --build` — `up` n'est jamais lancé si release échoue.
  release:
    <<: *api
    restart: "no"
    entrypoint: ["/app/docker/release.sh"]
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy

  # Le cache et les sessions de CET environnement. volatile-lru : seules les clés À DURÉE DE VIE
  # sont évincées ; un verrou ou un compteur sans durée ne l'est jamais en silence. Même image et
  # mêmes réglages que l'ancien `redis-takussan` (deploy/server/compose.data.yml). 128 Mo : celui-ci
# servait le cache et les sessions de la préproduction avec 1,65 Mo (pic 1,73 Mo, mesuré le 2026-10-18).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis:/data
    mem_limit: 192m
    networks:
      - interne

  api:
    <<: [*api, *apres-release]
    networks:
      dokploy-network:
        aliases:
          - ${API_ALIAS:?API_ALIAS manquant — takussan-api-preview ou takussan-api-production}
      interne:
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Les workers, les files qu'écrivait scripts/server-setup.sh (retiré par ADR-0028) :
  # notifications-urgent passe devant default, et le média lourd ne retarde pas une notification.
  #
  # ── `mem_limit` des workers : 384m, AU-DESSUS de `memory_limit` (TCK-951, P43.04) ──────────
  #
  # `memory_limit = 256M` (docker/php.ini) ne borne que le tas de PHP. Le processus porte en plus son
  # binaire, ses extensions et son allocateur. Mesuré le 2026-10-18 dans l'image (`:local`, PHP
  # 8.4.26), Laravel amorcé comme par `artisan` : RSS 62 Mio pour 32 Mio de tas au repos, et un pic
  # de RSS (`VmHWM`) de 288 Mio quand le tas atteint 256 Mio, trois fois sur trois. La marge hors tas
  # vaut donc 32 Mio. Relevé sur la préproduction le même jour : `worker` 52 Mio au repos,
  # `worker-media` 48 Mio.
  #
  #   256 (memory_limit) + 32 (marge mesurée) = 288 Mio au pic d'un job qui épuise son tas
  #   384 − 288 = 96 Mio pour ce que PHP ne compte pas : le résultat d'une requête que libpq garde
  #   entier en mémoire avant que PDO le copie (un `cursor()` sur PostgreSQL), les tampons de curl.
  #
  # Avec `mem_limit: 256m`, le noyau tuait le worker par SIGKILL avant l'erreur PHP : ni
  # « Allowed memory size » au journal, ni `failed()`, et le job était rejoué. Avec 384m, c'est
  # l'erreur de PHP qui joue, et elle se lit. Le script de la mesure est dans TCK-951.
  # ⚠ Monter `memory_limit` sans monter ces limites rouvre le défaut.
  #
  # ── `worker-long` : les jobs plus longs que le délai de reprise de `database` (TCK-2397, ADR-0078) ──
  #
  # `retry_after` appartient à la CONNEXION : 90 s sur `database`. Les jobs de `$timeout` supérieur
  # (balayages d'alertes, évaluations IA, flux de calendriers, expiration des réservations) passent
  # par `database-long` / `long` (`RunsOnLongQueue`), dont le délai est de 1900 s. `worker-long` en
  # est le SEUL consommateur : un worker de `database` qui lirait `long` les relivrerait après 90 s.
  # Effet de bord voulu : une évaluation de 30 min ne retient plus `notifications-urgent`.
  # `scripts/check-queues.mjs` lit la connexion de chaque `queue:work` et le délai de chaque job.
  worker:
    <<: [*api, *apres-release]
    command: php artisan queue:work --queue=notifications-urgent,default --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 60s
    mem_limit: 384m

  worker-long:
    <<: [*api, *apres-release]
    command: php artisan queue:work database-long --queue=long --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 60s
    mem_limit: 384m

  # ── `worker-ia` : les appels au modèle, seuls (TCK-2402, ADR-0078 amendement) ──────────────────────
  #
  # `ExtractRadarListing` et `VerifyRadarConsentReply` (`$timeout` 85 s, `RunsOnAiQueue`) passent par la
  # file `ai` de la connexion `database` : son délai de reprise (90 s) les couvre, il n'y a donc pas de
  # connexion de plus. `worker-ia` est le SEUL à la lire et ne lit rien d'autre — sur `worker`, derrière
  # `notifications-urgent`, un appel de 85 s retiendrait de nouveau une notification urgente, parce que
  # l'ordre des files ne joue qu'entre deux jobs. `stop_grace_period` 90 s : de quoi finir un appel.
  # `scripts/check-queues.mjs` refuse `ai` sur un worker qui lit autre chose.
  worker-ia:
    <<: [*api, *apres-release]
    command: php artisan queue:work --queue=ai --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 90s
    mem_limit: 384m

  worker-media:
    <<: [*api, *apres-release]
    command: php artisan queue:work --queue=media,reconciliation --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 120s
    mem_limit: 384m

  scheduler:
    <<: [*api, *apres-release]
    command: php artisan schedule:work
    # 192m : memory.events `max` 17 en 1 h 10 le 2026-11-01, autour de `memory_limit` 256M (le défaut que TCK-951 a corrigé sur les workers).
    mem_limit: 384m

  # ── `temps-reel` : le serveur WebSocket (ADR-0129 § 5, TCK-2956) ─────────────────────────────
  #
  # `reverb:start` écoute 0.0.0.0:8080 (défaut de config/reverb.php) : la cible de l'onglet Domains,
  # `temps-reel:8080`. Il lit le cache au démarrage puis toutes les 5 s (signal de `reverb:restart`) :
  # c'est le Redis de la pile, d'où `apres-release`. Il n'accepte de connexion que de l'hôte de
  # `FRONTEND_URL` (config/reverb.php, hors `local`) : 4009 « Origin not allowed » pour tout autre.
  #
  # Sans `REVERB_APP_KEY` dans le `.env`, le serveur démarre, se déclare sain, puis sort en 0 SANS UN
  # MOT vers 60 s (mesuré par TCK-2953) — et `restart` le relance en boucle, muet. La commande refuse
  # donc de démarrer, en le disant, tant que l'action docs/deploiement/actions/
  # 2026-11-17-poser-le-temps-reel.md n'est pas faite : le service est alors « Restarting » avec une
  # ligne qui nomme l'action, au lieu d'un service « Up » qui disparaît toutes les minutes.
  #
  # `mem_limit` (relevé le 2026-11-18, TCK-2956) : `reverb:start` sous PHP 8.4.27, code de l'API,
  # `APP_ENV=staging` — RSS 72 Mio au repos, 81 Mio (pic `VmHWM`) avec 500 connexions tenues ; 57 puis
  # 66 Mio au compte du cgroup (`docker stats`). Relevé sur `serversideup/php:8.4.27-cli-alpine` (le
  # service de développement), PAS sur l'image de l'API : l'ordre de grandeur, pas le chiffre de la
  # préproduction (à relever dans le conteneur, cf. l'action). La limite n'est pas dictée par cet usage
  # mais par `memory_limit = 256M` (docker/php.ini), qui borne aussi ce processus : sous 288 Mio
  # (256 + la marge hors tas mesurée par TCK-951), le noyau tuerait le serveur par SIGKILL avant
  # l'erreur de PHP, sans rien au journal. D'où 384m, le raisonnement des workers, et non leur chiffre.
  temps-reel:
    <<: [*api, *apres-release]
    command: sh -c 'test -n "$${REVERB_APP_KEY:-}" || { echo "temps-reel — REVERB_APP_KEY absente ou vide, serveur non démarré. Poser les clés — docs/deploiement/actions/2026-11-17-poser-le-temps-reel.md" >&2; exit 1; }; exec php artisan reverb:start'
    networks:
      dokploy-network:
        aliases:
          - ${API_ALIAS:?API_ALIAS manquant — takussan-api-preview ou takussan-api-production}-temps-reel
      interne:
    stop_grace_period: 30s
    mem_limit: 384m
    healthcheck:
      # `GET /up`, la route de santé du serveur Reverb lui-même (`{"health":"OK"}`) — pas un `--help`.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Jamais démarré par `up` : `docker compose --profile seed run --rm seed`.
  seed:
    <<: *api
    image: ghcr.io/thiambara/takussan-api:${IMAGE_TAG:?IMAGE_TAG manquant}-seed
    profiles: ["seed"]
    restart: "no"
    entrypoint: ["/app/docker/seed.sh"]
    mem_limit: 768m
    depends_on:
      redis:
        condition: service_healthy

volumes:
  storage:
  redis:

networks:
  dokploy-network:
    external: true
  interne:
