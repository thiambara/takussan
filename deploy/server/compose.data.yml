# Données partagées du serveur (ADR-0028 §6) : Meilisearch, et lui seul depuis le 2026-10-18.
# Redis n'est plus partagé : chaque environnement porte le sien dans sa pile d'API
# (deploy/takussan/compose.api.yml, ADR-0069 § 4, TCK-880). `redis-takussan` mêlait le cache et les
# sessions de la préproduction et de la production ; `redis-cpp` était parti le 2026-10-04 avec
# CheckPrint Plus. Le volume `serveur-donnees-qomjjz_redis-takussan` reste sur le disque une semaine
# après le retrait (décision du porteur, É4), puis se supprime avec son accord.
#
# PostgreSQL n'y est PAS : c'est un service Database de Dokploy, pour la sauvegarde vers R2
# et la restauration intégrées. Ce fichier ne porte que ce qui se
# reconstruit — l'index depuis la base, le cache par définition.
#
# Aucun port publié : ces services ne sont joignables que depuis `dokploy-network`.
# Déployé par Dokploy (projet « Serveur », Compose « donnees »), jamais à la main.
#
# Les versions sont celles du développement et de la CI (docs/infra/versions.json) : la même
# image partout. Ce qui tourne réellement se relève dans le conteneur, pas ici.

services:
  meilisearch:
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY manquante}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    volumes:
      - meili:/meili_data
    mem_limit: 768m
    networks:
      - dokploy-network

volumes:
  meili:

networks:
  dokploy-network:
    external: true
