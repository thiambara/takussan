# NOTE: This project uses a custom ticket-based backlog (docs/backlog/tickets/TCK-NNN-*.md)
# instead of standard BMad epics. The mapping used here:
#   - Epics  → Couches (layers) from docs/backlog/INDEX.md
#   - Stories → Individual TCK-NNN tickets
#   - Source of truth for ticket details: docs/backlog/tickets/
#   - Source of truth for specs: docs/features.md + docs/models-spec.md

# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Ticket exists in backlog, not yet started
#   - ready-for-dev: Story file created in implementation-artifacts folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# WORKFLOW NOTES:
# ===============
# - Start with Couche 1 (no dependencies)
# - Respect the dependency graph in docs/backlog/INDEX.md
# - Blocked tickets (Couche 6) await external decisions before starting
# - Re-run sprint-planning to refresh auto-detected statuses

